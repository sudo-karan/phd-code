name: Pages

# Builds the explorer (ui/explorer.html + ui_data/ + docs/decisions.yaml) on every push and pull
# request to main, so a broken index fails before merge. Publishes to GitHub Pages only from main.
#
# Frozen copies: every tag named paper-* is built from its own commit into v/<tag>/ beside the
# live site, so a link cited in a write-up (…/v/paper-v1/#run/step?…) keeps opening what it showed
# when it was cited. Pushing such a tag republishes the site with the new copy.

on:
  push:
    branches: [main]
    tags: ["paper-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The live site is always main, also when a paper-* tag started the run; the full history
      # and the tags are fetched for the frozen copies.
      - uses: actions/checkout@v4
        with:
          ref: ${{ startsWith(github.ref, 'refs/tags/') && 'main' || '' }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the site
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python scripts/build_ui_site.py --out _site

      - name: Add the frozen copies (tags named paper-*)
        run: |
          git fetch --tags --force --quiet origin
          for tag in $(git tag --list 'paper-*'); do
            dir="$RUNNER_TEMP/frozen/$tag"
            git worktree add --detach --quiet "$dir" "$tag"
            python "$dir/scripts/build_ui_site.py" --out "_site/v/$tag"
            git worktree remove --force "$dir"
          done

      - name: Upload the site for Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/paper-')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/paper-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
