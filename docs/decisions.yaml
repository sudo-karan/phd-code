    Commit df45350: cached assets live at {asset_root}/{config_name}/{stage}/{key}__{fingerprint}, so
    a copy under a new name is recomputed. Commit 06852f3: a stage that fails partway returns without
    waiting for the exports it already submitted, and the cache check sees only finished assets. The wrapper's
