  - path: configs/odisha_v120_3ha_squares_koraput_keptland.yaml
    what: Copies configs/odisha_v120_3ha_squares_koraput.yaml (3 ha, boxes); the other three districts the same way
  - path: tests/test_keptland_configs.py
    what: >-
      The six configs and their sources, and exactly which keys each changes; max_area_ha 10 for Sanjay Van and 3
      for Odisha, k as in the source, pass2_skip_at_min_area true in all six; the metrics reference outside the
      fingerprint; the fingerprints
  - path: scripts/reuse_upstream_assets.py
    what: >-
      REUSE_SAFE_KEYS holds merge.pass2_skip_at_min_area and metrics.reference_config_name, which no stage before
