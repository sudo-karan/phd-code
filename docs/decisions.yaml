- id: spec-kmeans-one-row-per-unit
  title: k-means is fitted on every stand, one row each, not on a pixel sample
  decision: >-
    The clustering stage takes exactly one row per unit (a stand, or a superpixel when merge is off) and
    uses all units for the skewness check, the scaling statistics and the k-means fit. The old n_training_samples
    setting is removed; a config that still has it fails to load.
  alternatives_considered:
  - 'Sampling 10,000 pixels (the retired n_training_samples): named and rejected'
  rationale: >-
    clustering.py: the feature stack is constant inside a unit, so a pixel sample drew each unit's vector
    once per pixel. A 10 ha stand outweighed a 0.1 ha stand 100 to 1 in every statistic and in the fit.
    That weighting is a property of stand size, not of what a stand is, and nothing declared it. With
    a few hundred stands there is no reason to sample. A second reader (entry dn-kmeans-fits-on-every-unit)
    recorded: The feature stack is constant within a unit, so a pixel sample drew each unit's vector once
    per pixel and area-weighted every statistic computed from it (skewness, median, IQR, the k-means fit).
    The code says that weighting is a property of stand size, not of what a stand is. The old 10,000 was
    pixels, about 37 per superpixel, never 10,000 superpixels.
