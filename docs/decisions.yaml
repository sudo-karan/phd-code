- id: dn-snic-independent-per-arm
  title: Each arm segments on its own feature space
  decision: >-
    Stop holding SNIC boundaries identical across arms. Each arm segments on its own features (AlphaEarth
    on all 64 dimensions through band: "*"), and the two stand maps are compared as products. Everything
    that is not the feature representation stays controlled: SNIC hyperparameters, k, seed, masking, analysis
    scale, merge rules.
  alternatives_considered:
  - >-
    hold SNIC byte-identical across arms (the earlier design, called the experiment's control)
  rationale: >-
    Holding SNIC identical reduced the embedding arm to asking which labels k-means gives inside boundaries
    the hand-crafted stack drew. Which representation finds better stand boundaries is the thesis question,
    and the old design never put it to the embedding. The note states the cost: the arms produce different
    stand maps, so ARI/NMI against a shared tessellation is no longer the comparison, and there is no
    ground-truth stand map to declare either correct.
