- id: dn-radar-vv-minus-vh-in-db
  title: Cross-polarisation contrast is VV minus VH in dB, not VV divided by VH
  decision: The contrast band is the difference VV_dB - VH_dB (computed on the medians).
  alternatives_considered:
  - Dividing the dB values directly, vv.divide(vh), as the notebook did
  - >-
    The ratio in linear units, VV_linear / VH_linear (stated to be the same quantity under the log transform)
  rationale: >-
    Dividing dB values 'isn't mathematically meaningful; dB is log-scale, and a "ratio" of log values
    produces a number with no clean physical interpretation'. The dB difference was chosen 'because it
    has clean physical meaning ("VV is X dB stronger than VH") and matches standard SAR vegetation literature'.
