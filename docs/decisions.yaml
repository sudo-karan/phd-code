- id: spec-manifests-record-the-environment-and-the-input-images
  title: >-
    Run manifests record the Python environment and, per input collection, the images the run used
  decision: >-
    Every pipeline manifest, export manifest and Odisha run record gets an environment block
    (fmu.utils.provenance.environment_state): the Python version, the earthengine-api version, and the SHA-256 of
    the sorted lines of pip freeze, without comments and without this package's own line, with the number of lines.
    A stage that reads image collections names them (Stage.input_collections: masking the annual LULC images and
    WorldCover, data_load the composite's Sentinel-2 images, features_optical the phenology collection,
    features_radar the Sentinel-1 collection, features_static CHIRPS, features_embedding the annual embeddings).
    When it runs live the manifest records, per collection, the count and SHA-256 of the sorted image ids, and the
    ids themselves when there are at most 100; every id goes to the run folder's input_images.json; in the per-step
    layout the count and SHA-256 also go on each asset it exports (property fmu_input_images), and a later run that
    reads the asset from the cache records them from there.
  alternatives_considered:
  - >-
    Record the ids only as the stage logs a count of images: the state before round 9, not chosen
  rationale: >-
    The round 9 brief (17 Oct 2026, task B: "Manifests also record: Python package versions (earthengine-api and pip
    freeze hash) and, per input collection, the list of image IDs the run used (or a hash of the sorted list plus the
    count, if the list is too long)"). Between 27 Aug and 13 Oct 2026 the same Sentinel-2 filter gave 192 and then
    195 images at Sanjay Van, and the Kendujhar composite changed with its count unchanged (docs/reproducibility.md).
    This package's own pip freeze line names the commit, which the git block records, and would make two checkouts
    of one commit differ. The limit of 100 listed ids is Claude Code's choice. No paper was searched for this
    decision. Review C33 (19 Oct 2026; added here 20 Oct 2026, round 13): the line names the commit of the
    checkout the venv's editable install points at, the live checkout, when pip freeze ran, not always the one the
    git block records. In a run-tree batch the code is imported from the run tree (PYTHONPATH=<run tree>/src), so
    the two differ: in 92 of the 108 committed JSON records that hold both blocks at their top level (counted 20
    Oct 2026). The line is left out of the hash, so the hash is unaffected, and nothing reads it. The docstring of
    environment_state says so since round 13; whether to drop the line is put to Jaskaran.
  evidence:
  - path: src/fmu/utils/provenance.py
    what: environment_state
  - path: src/fmu/stages/base.py
    what: Stage.input_collections
  - path: src/fmu/pipeline.py
    what: _live_input_images, _recorded_input_images, the manifest's environment and input_images
  - path: tests/test_pipeline_cache_layout.py
    what: The records, computed and read back from an asset
  - path: tests/test_provenance.py
    what: environment_state
  - path: docs/reviews/2026-10-19-review.md
    what: C33, the left-out pip line in run-tree batches
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, round 9 brief (17 Oct 2026)
- id: spec-k-elbow-as-a-cached-step
  title: >-
    The k elbow is a cached step of its own, keyed without k; built and tested, not used to set k
  decision: >-
    src/fmu/stages/k_elbow.py: k-means (scikit-learn, seed 42, 25 starts) on the clustering stage's training rows,
    read back from its cached feature_stack, for k from k_elbow.k_min to k_elbow.k_max (default 2 to 12), with the
    elbow by the rule of the earlier elbows (the point farthest from the chord). Its output is a table cached as an
    asset, in the per-step layout only, under a key over the clustering settings but k, the steps upstream of
    clustering and the new k_elbow config block, so a configuration's elbow is computed once and read back by later
    runs whatever its k. It is in no default run and nothing reads it; k stays as each config sets it.
    Round 14 (26 Oct 2026): with k_elbow.in_fit_space on (off by default) the step runs on the fit's own rows, in its own space, reads none of the clustering stage's outputs, and records the starts' agreement at each k (spec-k-elbow-in-the-fits-space); for R3, k is chosen by Jaskaran from its elbow report (field-r3-k-chosen-by-jaskaran-from-the-elbow-report).
  alternatives_considered:
  - >-
    Recompute the elbow offline from each run's exported stand layer, as odisha_script/odisha_phase3_2_stand_k_elbow.py
    and scripts/remerge_demo_set.py did: not chosen
  rationale: >-
    The round 9 brief (17 Oct 2026, task B: "The k elbow as a cached step: key it on what determines it (feature set,
    scaling, settings), so it is computed once per configuration and reused by later runs of the same configuration.
    Not used this round (k stays as in the configs); build and test it only."). Whether k is set from the elbow is
    issue #44 item 13, out of scope this round. No paper was searched for this decision.
  evidence:
  - path: src/fmu/stages/k_elbow.py
    what: The step
  - path: src/fmu/config.py
    what: KElbowParams
  - path: tests/test_k_elbow.py
    what: The rule, the sweep on planted data, the table, the refusal of the legacy layout
  - path: tests/test_cache_layout.py
    what: test_k_moves_clustering_and_not_the_elbow
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, round 9 brief (17 Oct 2026)
- id: spec-export-and-read-back-by-roi-part
  title: >-
    The export stage builds, counts and sends each vector layer one ROI part at a time, and the runner reads each part
    back in pages
  decision: >-
    src/fmu/stages/export.py splits the ROI into its own polygons (_roi_parts: roi.geometries(), so each part keeps the
    ROI's projection and edges), builds each vector layer over each part with the stage's own builders (now given a
    region), counts its polygons and stands one request per part (_count_by_part), and sends the union of the parts,
    numbered 1..N over all of them by the stage's own sort key, to Drive (_layer_by_part). An ROI of one polygon is one
    part, and its layers are built exactly as before; parts within two pixels of each other are not split, with a
    warning. The manifest records roi_parts per layer. odisha_script/odisha_phase2_2_run_pipeline.py reads each layer
    back over the same parts, a page of 2,500 polygons at a time, and numbers the polygons over all parts with the same
    key (read_layer_by_part); odisha_script/odisha_read_back_export.py takes the same parts by default (--parts stage),
    or the ROI file's polygons as before (--parts file).
  alternatives_considered:
  - >-
    Leave the export stage and the runner as they were, and finish a stopped export pass with the read-back tool
    (spec-export-read-back-tool-when-an-export-pass-stops, rounds 6 and 7): superseded
  - >-
    Count the polygons in batch, or not at all: not chosen; the manifest's counts are what the run records report
  rationale: >-
    The round 9 brief (17 Oct 2026, task C, issue #44 item 11: "Export and read-back one ROI part at a time (method of
    odisha_script/odisha_read_back_export.py). The export stage is Locked: add the docs/decisions.yaml entry MODULES.md
    requires."), and question 5 of PR #43, which Jaskaran answered yes for the final round. The export stage counted
    all stand polygons of the whole ROI in one request, which timed out for the eight Dhenkanal boxes, and the runner
    read a layer back in one request, which Earth Engine stops above 5,000 elements (8,744 superpixel polygons in
    Koraput). Checked read-only before the change was committed, with odisha_script/odisha_read_back_export.py --check:
    for odisha_v120_3ha_squares_dhenkanal_keptland_s1desc (8 parts) the three layers built and read back one stage part
    at a time equal the files its export pass wrote over the whole ROI (559, 2,889 and 85 polygons; no polygon,
    property or outline differs). For odisha_v120_3ha_squares_koraput_keptland_s1desc (7 parts) the superpixels equal
    the file (8,744 polygons); of its 1,631 stand polygons one differs from the file its export pass wrote over the
    whole ROI, stand 1315, by an edge pixel at a part's outline, the same polygon and the same difference with the ROI
    file's parts (rounds 6 and 7 found it too); and 90 of its 324 same-type regions differ in profile medians only,
    which the profiling stage computes live with Earth Engine's percentile reducer (a histogram over large clusters),
    every outline equal. No paper was searched for this decision.
  evidence:
  - path: src/fmu/stages/export.py
    what: _roi_parts, _layer_by_part, _count_by_part; the builders' region; roi_parts in the manifest
  - path: odisha_script/odisha_phase2_2_run_pipeline.py
    what: read_layer_by_part and pull_vectors
  - path: odisha_script/odisha_read_back_export.py
    what: The method, and its --parts option
  - path: tests/test_export_by_part.py
    what: One part as before, several parts built and numbered over all, the counts, the runner's read-back
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, round 9 brief (17 Oct 2026); PR #43 question 5
- id: field-keptland-scores-of-record-are-the-r9-re-runs
  title: >-
    The kept-land field check's scores of record are those on the _r9 stands; round 7's stay as history
  decision: >-
    From 18 Oct 2026 the record of the declared kept-land field check (odisha_script/PHASE_KEPTLAND_PREDECLARED.md) is
    its scores on the stands of the _r9 runs, made from empty caches in the per-step cache layout:
    odisha_script/keptland_scores/keptland_s1desc_r9_scores.{json,txt} for the hand-crafted re-runs, with their joined
    table and run record, and keptland_alphaearth_r9_scores.{json,txt} for the AlphaEarth arm, scored under the
    amendment that adds it, whose only runs are _r9 runs. Round 7's scores on the stands of the runs of 15 Oct 2026,
    keptland_s1desc_{joined.csv,scores.json,scores.txt,scores_run.json} (f56ad57), stay in the repo unchanged as
    history, and a committed file that quotes them as current gets a one-line note saying so.
  alternatives_considered:
  - >-
    Round 7's scores stay the record and the _r9 scores are a check beside them (option (b) of question 1 of
    docs/handoff/2026-10-18-round10.md): not chosen
  rationale: >-
    Jaskaran's answer (a) to question 1 of docs/handoff/2026-10-18-round10.md, 18 Oct 2026 (the round 11 brief): "the
    _r9 kept-land scores become the record; round 7's stay as history. Add a one-line note wherever a committed file
    quotes round 7's kept-land scores as current." Round 7's stands were made under the old cache layout; the _r9
    stands are what the pipeline makes since the cache fix (spec-cache-on-the-analysis-grid-with-per-step-keys), whose
    test on Kendujhar (round 9, Task D) gave the same superpixels, stands and stand types from two empty caches, which
    Jaskaran ruled a property of the pipeline. Against round 7's, every score of the primary and of the three checks is
    a little higher on the re-run stands, by +0.0004 to +0.0598, every ARI among the five scores stays under 0.06 (the
    largest, S1's labelling mean, +0.0566), and the box runs' scores are equal, as they must be
    (odisha_script/keptland_scores/keptland_s1desc_r9_vs_s1desc.md). The declared chance test, run on both arms'
    _r9 stands at Jaskaran's request of 18 Oct 2026 (docs/handoff/2026-10-18-round10.md, "After the round"), reads
    the same stands (keptland_s1desc_r9_chance.* and keptland_alphaearth_r9_chance.*); Claude (chat)'s rehearsal of
    it on round 7's stands (keptland_s1desc_chance_rehearsal.*) stays as it is. No paper was searched for this
    decision.
  evidence:
  - path: docs/handoff/2026-10-18-round10.md
    what: The re-runs and their field check (Task G), the chance test on both arms, and the question, with its two options
  - path: docs/handoff/2026-10-18-round11.md
    what: Jaskaran's answer, as he gave it
  - path: odisha_script/keptland_scores/keptland_s1desc_r9_scores.json
    what: The hand-crafted scores of record
  - path: odisha_script/keptland_scores/keptland_s1desc_r9_vs_s1desc.md
    what: Round 7's scores and the re-run's side by side
  - path: odisha_script/keptland_scores/keptland_s1desc_scores.json
    what: Round 7's scores, kept as history
  papers: []
  status: adopted
  design_notes_section: null
