- id: spec-cache-name-only-keys
  title: Cache keyed on the config name only (replaced by a content fingerprint)
  decision: >-
    Earlier, a cached asset's path was {asset_root}/{config_name}/{stage}/{key}, so changing a threshold
    without renaming the config reused the old asset. This was replaced: the path now ends in a short
    hash of the config contents that can change a raster.
  alternatives_considered:
  - >-
    A per-stage dependency map instead of one coarse fingerprint: named in caching.py and left as a follow-up
  rationale: >-
    caching.py: reusing an old asset after editing a threshold is a correctness bug, not a performance
    one; under the merge design the segmentation is the primary output and threshold tuning is the main
    activity. One coarse hash was chosen because a wrong narrow map silently brings the bug back for one
    stage; over-invalidation costs compute, under-invalidation costs a result.
