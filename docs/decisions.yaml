- id: spec-merge-calibration-admit-rate-applies-the-floor
  title: >-
    The merge's joint admit rate counts only the pairs its gate admits, the two-criterion floor included
  decision: >-
    calibrate_thresholds (fmu.utils.region_merge, Locked, part of the merge stage) takes min_defined_criteria, a
    required keyword, and counts a pair as admitted only when every criterion defined on both sides is within its
    tolerance and at least min_defined_criteria of them are defined on both sides, the rule of the merge's gate
    (compare in merge_superpixels). The merge stage passes merge.min_defined_criteria. joint_admit_rate_pct is that
    count over n_pairs_with_any_defined_criterion, the pairs with at least one criterion defined on both sides, as
    before, and the per-band figures are unchanged. Before 20 Oct 2026 the rate also counted a pair with fewer criteria
    defined that passed the ones it had, which the gate rejects. Nothing reads the rate to merge, type or export a
    stand: it goes into merge_diagnostics and the stage metadata, and scripts print it. The merge is not cached, so no
    step key moves and no revision is raised.
  alternatives_considered:
