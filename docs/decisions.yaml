    each window kept the days up to the day before its end (2017-01-01 to 2022-12-30 against the recorded 2017-01-01
    to 2022-12-31). A read-only check on Earth Engine (call 4 of the round 13 record) found the images of 31 Dec 2022
    the exclusive end left out of the _r9 runs' collections: one Sentinel-1 scene over the Angul, Dhenkanal and
