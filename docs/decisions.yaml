# Decision register for the forest-stand pipeline (fmu).
#
# What this is: one entry per decision that the repo records. Each entry says what was
# decided, which alternatives the source names, why, where the evidence is, and which papers
# the repo cites for it. It is written to be read by a program (a user interface) and by people.
# It is built by a script from readers' extracts of the repo; do not expect hand formatting.
#
# How to read it:
#   status                 adopted, superseded, open (no decision yet) or pending (waiting for
#                          a decision or a review; the night-* entries await review of PR #42).
#   alternatives_note      present only when alternatives_considered is empty. It means the
#                          source names no alternatives. None were made up to fill the list.
#   design_notes_section   the exact "## " heading in docs/design_notes.md, or null.
#   evidence               files in this repo. Line numbers in the "what" text were read at
#                          commits a477ab1 to 950f1ef and may have moved since. Those that point
#                          into files changed after a477ab1 were checked again at ab1e286.
#
# How papers are verified: the DOI is looked up at https://api.crossref.org/works/<doi>, and
# the title and first author that Crossref returns must match the paper the repo names.
# A paper marked "verified: false" HAS NOT BEEN CONFIRMED: treat its DOI, title and what it is
# said to support as unchecked. "verified: true" confirms which paper it is. It does not
# confirm every claim the repo makes about the paper: supports_what says, claim by claim, what
# the verifiers could and could not confirm, and whether they read the full text, only the
# abstract or only the title.
#   supports   used = others use the method or it is the source of a method or data set;
#              recommended = a review recommends it; shown_better = a comparison shows it beats
#              the alternatives. These are different strengths of support.
# One caution: for Xiong et al. 2024 (10.14214/sf.23014) Crossref's author list starts with an
# institution name that was deposited as an author. The first person listed is Xiong, Hao,
# marked "first", and the publisher page agrees, so it is recorded as verified.
#
# Reviewed after assembly: every DOI was fetched from Crossref again and its title, first author
# and year compared with this file; quoted passages and numbers in an entry were searched for in
# the files the entry names (for the night-* entries, also in the commit messages). Not every line
# of every entry was read against its source by hand. "superseded" can mean superseded in part:
# read the entry that replaced it before relying on the status alone.
schema_version: 1
decisions:
- id: dn-config-pydantic-over-dataclasses
  title: Config schema is written in Pydantic, not dataclasses or dicts
  decision: >-
    The experiment config is a set of Pydantic models. One extra dependency is accepted as the cost.
  alternatives_considered:
  - Plain dataclasses (the note says they would need a hand-rolled validator)
  - Dicts (the note says they lose all of this)
  rationale: >-
    The note says Pydantic gives clear error messages when a YAML field is wrong, type-checks at load
    time, and supports .env integration through pydantic-settings. Cost: one more dependency, judged worth
    it.
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''Config: Pydantic v2 vs dataclasses / dicts'', lines 9-15'
  - path: src/fmu/config.py
    what: All 23 config classes subclass pydantic BaseModel (import on line 11)
  - path: src/fmu/settings.py
    what: Settings subclasses pydantic_settings.BaseSettings and reads .env
  - path: pyproject.toml
    what: Core dependencies pydantic>=2.5 and pydantic-settings>=2.1 (lines 32-33)
  - path: tests/test_config.py
    what: Tests that the schema loads the baseline and rejects bad input
  papers: []
  status: adopted
  design_notes_section: 'Config: Pydantic v2 vs dataclasses / dicts'
  source: docs/design_notes.md lines 9-15
- id: dn-config-extra-forbid
  title: Unknown YAML fields are an error (extra="forbid" on every config model)
  decision: >-
    Every config model sets extra="forbid", so a misspelt field in a YAML file fails at load.
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: >-
    The note says: so a typo in YAML errors immediately instead of silently using a default.
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''Config: Pydantic v2 vs dataclasses / dicts'', lines 17-18'
  - path: src/fmu/config.py
    what: >-
      23 BaseModel classes and 23 lines 'model_config = ConfigDict(extra="forbid")', one per class
  - path: tests/test_config.py
    what: >-
      test_unknown_field_raises (line 117): a config with 'typo_field' raises ValidationError; test_masking_rejects_removed_builtup_fields
      (line 210)
  papers: []
  status: adopted
  design_notes_section: 'Config: Pydantic v2 vs dataclasses / dicts'
  source: docs/design_notes.md lines 17-18
- id: dn-settings-vs-config
  title: Per-machine Settings (.env) are kept apart from per-experiment Config (YAML)
  decision: >-
    Two separate Pydantic objects. Settings (settings.py) is per machine, read from .env and gitignored:
    project ID, output paths, log level. Config (config.py) is per experiment, read from YAML and kept
    in git: ROI, dates, parameters.
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: >-
    The note says two people running the same --config file should get the same output, and that only
    holds if the scientific parameters are in the YAML and not in the environment.
  evidence:
  - path: docs/design_notes.md
    what: Section 'Settings vs Config', lines 20-31
  - path: src/fmu/settings.py
    what: >-
      Settings holds only gee_project_id, gee_asset_root, output_dir, log_level; reads .env
  - path: src/fmu/config.py
    what: Config holds ROI, dates, datasets and all stage parameters; loaded from YAML
  - path: .env.example
    what: Template of the per-machine values
  - path: .gitignore
    what: Keeps .env out of git (the note says gitignored)
  - path: tests/test_settings.py
    what: Tests of Settings defaults and env-var loading
  - path: tests/test_config.py
    what: Tests of the YAML schema
  papers: []
  status: adopted
  design_notes_section: Settings vs Config
  source: docs/design_notes.md lines 20-31
- id: dn-roi-geojson-asset-reserved
  title: >-
    ROI comes from a GeoJSON file; an Earth Engine asset path is reserved but not implemented
  decision: >-
    The region of interest is read from a GeoJSON file (roi_file). The schema also accepts roi_asset for
    large polygons, but only roi_file is implemented.
  alternatives_considered:
  - >-
    A GEE asset path for the ROI (roi_asset): accepted by the schema, reserved, not implemented
  rationale: >-
    The note says GeoJSON works for small ROIs and is version-controlled. GEE inline geometry is capped
    around 5 MB, which complex or national-park-scale polygons would hit; roi_asset is reserved for that
    case.
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''ROI: GeoJSON now, GEE asset path reserved'', lines 33-38'
  - path: src/fmu/config.py
    what: >-
      ROIConfig (lines 14-24): roi_file and roi_asset, comment 'reserved; only roi_file is implemented',
      validator requires exactly one of the two
  - path: src/fmu/utils/gee.py
    what: >-
      load_roi_geometry(roi_file) (line 114) reads GeoJSON only; there is no loader for roi_asset
  - path: aois/sanjay_van.geojson
    what: A version-controlled ROI file
  - path: tests/test_config.py
    what: >-
      ROIConfig tests, including test_roi_asset_only (line 89): the schema accepts roi_asset
  - path: tests/test_gee_utils.py
    what: test_load_roi_* tests of the GeoJSON loader (lines 184-255)
  - path: docs/current_flow.md
    what: >-
      Decision table lists 'DEC-005 ROI loaded from GeoJSON' and 'ENG-005 roi_file in YAML, roi_asset
      reserved' (lines 514-516)
  papers: []
  status: adopted
  design_notes_section: 'ROI: GeoJSON now, GEE asset path reserved'
  source: docs/design_notes.md lines 33-38
- id: dn-logging-per-run-folder
  title: Each run gets its own output folder with its log and manifest
  decision: >-
    Every run writes to outputs/runs/<config>_<timestamp>/, holding fmu.log and manifest.json, instead
    of one rolling log file.
  alternatives_considered:
  - A single rolling log (named in the heading only)
  rationale: >-
    The note says a per-run folder lets individual runs be archived (tar) and supports the longitudinal
    record of validation metrics.
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''Logging: per-run folder, not single rolling log'', lines 40-45'
  - path: src/fmu/utils/logging.py
    what: >-
      _make_run_dir builds output_dir/runs/<name>_<YYYYmmdd_HHMMSS> (lines 19-24); init_logging writes
      fmu.log in it (line 42)
  - path: src/fmu/pipeline.py
    what: Pipeline.run writes manifest.json into the run folder (line 260)
  - path: tests/test_logging.py
    what: >-
      test_init_logging_creates_run_dir, test_run_dir_is_under_output_dir_runs, test_log_file_in_run_dir_has_init_message
  - path: tests/test_pipeline.py
    what: Orchestrator tests, including the manifest
  papers: []
  status: adopted
  design_notes_section: 'Logging: per-run folder, not single rolling log'
  source: docs/design_notes.md lines 40-45
- id: dn-gee-explicit-init
  title: Earth Engine is initialised by an explicit call, never on import
  decision: >-
    init_gee() must be called explicitly. No module initialises Earth Engine when it is imported.
  alternatives_considered:
  - Auto-initialise on import
  rationale: >-
    The note says auto-init on import would mean tests that do not touch GEE could not import any module
    without authenticating, and that errors at import time are confusing.
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''GEE: explicit init, not auto-on-import'', lines 47-51'
  - path: src/fmu/utils/gee.py
    what: >-
      init_gee() (lines 53-76): idempotent, raises if no project ID, adds an 'earthengine authenticate'
      hint on an auth error; is_initialized()
  - path: scripts/inspect_masking.py
    what: >-
      One of the scripts that calls init_gee() itself (line 34); every inspect_* script does the same
  - path: tests/test_gee_utils.py
    what: test_init_gee_* tests (lines 32-102), run with Earth Engine mocked
  - path: .github/workflows/ci.yml
    what: >-
      CI runs pytest with no Earth Engine credentials, which only works because import does not initialise
  papers: []
  status: adopted
  design_notes_section: 'GEE: explicit init, not auto-on-import'
  source: docs/design_notes.md lines 47-51
- id: dn-safe-get-info-wrapper
  title: Every .getInfo() goes through safe_get_info or safe_call, which label the error
  decision: >-
    Any .getInfo() in stage code goes through safe_get_info, or the safe_call decorator, which attach
    a context string to an Earth Engine error.
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: >-
    The note says GEE errors fire when a value is materialised (.getInfo()), not when the operation is
    built. Without a context label the traceback points at the materialisation line, 50 or more lines
    from the operation at fault. The wrapper makes the error say which operation failed.
  evidence:
  - path: docs/design_notes.md
    what: Section '`safe_get_info` wrapper', lines 53-61
  - path: src/fmu/utils/gee.py
    what: >-
      safe_get_info (line 86) and safe_call (line 98): both re-raise ee.EEException with ' [context: ...]'
      appended
  - path: src/fmu/stages/clustering.py
    what: >-
      Example of stage code using the wrapper (15 lines match safe_get_info or safe_call)
  - path: tests/test_gee_utils.py
    what: >-
      test_safe_get_info_appends_context_on_error (line 131), test_safe_call_decorator_adds_context_to_gee_errors
      (line 156) and three related tests
  papers: []
  status: adopted
  design_notes_section: '`safe_get_info` wrapper'
  source: docs/design_notes.md lines 53-61
- id: dn-stage-contract-context-dict
  title: Stages share a context object and declare what they need and what they produce
  decision: >-
    Stages pass data through a shared PipelineContext, not named parameters. Each stage declares required_inputs
    and produces as class attributes, and the orchestrator checks them against the context before running
    the stage.
  alternatives_considered:
  - Named parameters between stages
  - Plain dict-passing (named as what the chosen design borrows flexibility from)
  rationale: >-
    The note says this gets the flexibility of dict-passing (new keys do not break existing signatures)
    with the readability of named parameters (the registry can list what each stage needs without reading
    its body).
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''Stage contract: context-dict + declared inputs/produces'', lines 63-70'
  - path: src/fmu/stages/base.py
    what: >-
      PipelineContext (line 190), Stage.required_inputs / produces as ClassVar sets (lines 290-291), type
      checks in __init_subclass__, Stage.validate raises KeyError on missing inputs (lines 364-383), stage
      registry
  - path: src/fmu/pipeline.py
    what: >-
      Pipeline._run_one checks the returned keys equal the declared produces and raises ValueError if
      not (lines 338-346)
  - path: tests/test_stages_base.py
    what: Tests of the stage contract and registry
  - path: tests/test_pipeline.py
    what: Tests of the orchestrator
  - path: tests/test_stage_graph.py
    what: Tests of the stage graph built from the declarations
  papers: []
  status: adopted
  design_notes_section: 'Stage contract: context-dict + declared inputs/produces'
  source: docs/design_notes.md lines 63-70
- id: dn-stage-failure-exceptions-only
  title: A stage either succeeds or raises; there is no soft failure
  decision: >-
    A stage either succeeds or raises an exception. The warnings field on StageResult is informational
    only.
  alternatives_considered:
  - >-
    Soft-fail (named in the heading, 'no soft-fail'; the text warns against 'silent partial failures')
  rationale: >-
    The note says research pipelines benefit from loud failures; silent partial failures cause subtle
    wrong results that are hard to detect later.
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''Stage failure: exceptions only, no soft-fail'', lines 72-77'
  - path: src/fmu/pipeline.py
    what: >-
      _run_one: 'except Exception' logs 'stage ... FAILED' and re-raises (lines 376-384); stage warnings
      are only logged and copied to the manifest (lines 388, 397)
  - path: src/fmu/stages/base.py
    what: 'StageResult.warnings: list[str] (line 238)'
  - path: tests/test_pipeline.py
    what: Orchestrator tests
  papers: []
  status: adopted
  design_notes_section: 'Stage failure: exceptions only, no soft-fail'
  source: docs/design_notes.md lines 72-77
- id: dn-two-tier-testing
  title: >-
    Two tiers of tests: fast mocked tests by default, live Earth Engine tests on request
  decision: >-
    pytest runs the fast mocked tests by default (no authentication, runs in CI). pytest -m live_gee runs
    the tests that call the real API (needs authentication). Both must pass before a module is locked.
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: >-
    The section gives the properties of each tier and no further reason: fast tests take about 1 second,
    need no auth and run in CI; live tests take about 10-20 seconds, need auth, and are run before locking
    a module.
  evidence:
  - path: docs/design_notes.md
    what: Section 'Two-tier testing', lines 79-83
  - path: pyproject.toml
    what: >-
      pytest addopts = "-v --tb=short -m 'not live_gee'" and the live_gee marker (lines 99-102)
  - path: .github/workflows/ci.yml
    what: CI runs 'pytest --tb=short -v', so only the fast tier
  - path: tests/test_gee_live.py
    what: One of the live-tier files (13 tests/*_live.py files carry the live_gee marker)
  - path: tests/test_pipeline_smoke_live.py
    what: The live smoke test
  - path: MODULES.md
    what: >-
      Defines Locked as: code read, has tests (fast + live where applicable), documented, part of the
      smoke test
  papers: []
  status: adopted
  design_notes_section: Two-tier testing
  source: docs/design_notes.md lines 79-83
