- id: spec-district-step-next-one-30-km-tile
  title: >-
    The next step towards a district is one 30 km by 30 km tile, placed by the rule of the 10 km tile
  decision: >-
    Before any whole district, the pipeline runs on one tile of 30 km by 30 km (90,000 ha), placed by the same rule as
    round 10's 10 km cost pilot in Angul (docs/handoff/2026-10-18-round10.md, Task I, "The rule, written before the
    run"; odisha_script/odisha_tile_0_aoi.py): a square north-up in EPSG:32645, the UTM zone of the Angul boxes,
    centred on the centroid of the union of the four Angul boxes, wherever the rule puts it. It runs in the next
    round; round 11 has no Earth Engine work.
  alternatives_considered:
  - >-
    A whole district (option (b) of question 2 of docs/handoff/2026-10-18-round10.md): not chosen
  - >-
    Neither yet (option (c)): not chosen
  rationale: >-
    Jaskaran's answer (a) to question 2 of docs/handoff/2026-10-18-round10.md, 18 Oct 2026 (the round 11 brief): "next
    step towards a district is one 30 km x 30 km tile by the same rule (next round)." The 10 km tile cost 0.39
    EECU-hours per 1,000 ha (3.89 for its 10,000 ha; Angul's 603 ha of boxes 6.57 per 1,000 ha), so 90,000 ha would
    cost about 35 EECU-hours if the cost grew in proportion to the area. One tile does not show that it does, and a
    bigger ROI may meet Earth Engine's memory limits, which the 10 km tile did not; its Drive exports also took more
    than two hours longer than the run, in the shared queue. A bigger tile tests the scaling and the memory limits
    for a fraction of a district's cost. No paper was searched for this decision.
