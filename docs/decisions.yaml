- id: spec-clustering-flat-cells-have-no-aspect
  title: >-
    A flat cell's aspect sin and cos are both 0 in the clustering and profiling stages, not the pair of a slope facing
    due north
  decision: >-
    The clustering stage's _decompose_cyclic_bands (src/fmu/stages/clustering.py, a Locked module) gives every cell whose
    slope is 0 the aspect pair (0, 0), per pixel and before the unit means, in place of (sin 0, cos 0) = (0, 1), the
    pair of a slope facing due north. Every other cell keeps the sin and cos of its aspect, and the phase pairs are
    unchanged. The slope is read from the same stack (features_static emits elevation, slope and aspect together); a
    stack with aspect and no slope is refused with an error. The profiling stage's copy of the decomposition
    (src/fmu/stages/profiling.py, a Locked module) applies the same rule, so that the profiles describe what was
    clustered. A unit's mean aspect vector then holds the directions of its sloping cells only, shortened by its share
    of flat cells. Clustering's revision is raised to 1 (STEP_REVISION in src/fmu/utils/caching.py), which moves the
    clustering and k_elbow keys of every config and no other key.
  alternatives_considered:
  - >-
    Weight each cell's aspect sin and cos by its slope, the review's second option: not chosen. The brief names the zero
    vector, and a weight would change the pair of every sloping cell too
  - >-
    Leave a flat cell facing north: not chosen, it is the finding
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 2: "A5: compute the terrain on a float DEM; give flat cells no
    aspect direction (zero vector)." This entry is the second half; the float DEM is features_static's. The review
    (docs/reviews/2026-10-19-review.md, A5) found that a cell with no gradient gets aspect 0, which the sin/cos
    decomposition encodes exactly like a slope facing north, (0, 1): all 9 one-pixel stands with slope 0 in the
    committed _r9 and tile layers have aspect 0, and _decompose_cyclic_bands gives (0, 1) for a flat pixel and a due
    north pixel alike. The new test fails on the code before the change with "assert (0.0, 1.0) != (0.0, 1.0)", in both
    stages, and passes after it. With NASADEM's integer elevations the smallest gradients the review lists (0.93, 0.99
    and 1.36 degrees) read 1 in whole degrees, so a slope of 0 is a cell with no gradient, in the whole degrees of the
    runs before round 13 as in the fractional degrees of ee.Terrain.slope (spec-static-terrain-on-a-float-dem). Per
    the review, flat cells barely reach the scored boxes (0 of 345 one-pixel stands) but occur in the 10 km tile (5 of
    235) and Sanjay Van (4 of 109); how many stand types the rule moves needs Earth Engine and was not measured. The
    embedding arm has no aspect band and computes the same as before, though its clustering and k_elbow keys move with
    the step's revision. No paper was searched for this decision.
  evidence:
  - path: src/fmu/stages/clustering.py
    what: _decompose_cyclic_bands, the flat-cell rule and the refusal of aspect without slope
  - path: src/fmu/stages/profiling.py
    what: _decompose_cyclic_bands, the same rule
  - path: src/fmu/utils/caching.py
    what: STEP_REVISION, clustering at 1
  - path: tests/test_flat_cells_have_no_aspect.py
    what: >-
      A flat cell and a due north cell on numpy stand-ins for the images (tests/_ee_arrays.py); fails on the code before
      the change
  - path: tests/data/clustering_off_calls.json
    what: The recorded calls of the two hand-crafted configs, rewritten from the new code
  - path: docs/reviews/2026-10-19-review.md
    what: A5
  - path: docs/handoff/2026-10-20-round13.md
    what: Task 2, A5
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 13 brief)
- id: spec-export-area-and-pixels-from-the-pixel-count
  title: >-
    Each exported polygon's n_pixels is the pixel count reduceToVectors gives it, and its area_ha that count on the
    analysis grid
  decision: >-
    The export stage (src/fmu/stages/export.py, a Locked module), _add_geom_attrs, used by all three vector layers
    (stands_merged, stands_snic, stands_dissolved): n_pixels is the 'count' reduceToVectors puts on every polygon it
    makes (its default reducer, countEvery, over the polygon's pixels at the analysis scale), and area_ha is n_pixels x
    analysis_scale_m² / 10,000, the area on the analysis grid. perim_m and the centroid are still the geometry's
    (found after a check of the fix in round 13: the centroid has the same hole error as area(), the centroid with the
    hole counted as area, 54 of the 7,371 centroids of the committed merged layers of _r9 and round 12 more than 1 m
    off, up to 35 m, and stand_id is numbered by it; perim_m is right; not changed in round 13, question 21 of its
    brief). The three builders compute these before _drop_internal_properties drops 'count', and no reduction in between writes a
    property of that name (the feature means are named after their bands, the vote 'mode'); a test pins that order for
    the three builders. On the legacy cache layout stands_dissolved is vectorised from a type image on a geographic grid,
    whose pixels are smaller than analysis_scale_m² away from the equator, so there its area_ha overstates the area
    (about 7.5% at 21° N); stands_merged and stands_snic lie on a UTM grid in both layouts.
  alternatives_considered:
  - >-
    Keep the geometry's area() for area_ha, and n_pixels derived from it (the export before round 13): not chosen;
    review A6
  - >-
    Subtract the holes from area() (the exterior's area minus the holes'): not chosen. It keeps Earth Engine's
    measure, which in the committed layers is the area on a sphere of radius 6,371,008.8 m, 0.11% (Sanjay Van) to
    0.31% (Odisha) more than the planar area on the run's grid, and n_pixels would still be derived from an area
  - >-
    Sum ee.Image.pixelArea() over each polygon in reduceToVectors: exact on any grid, the legacy layout's geographic
    type grid included, at the cost of a second band and reducer in every vectorisation; not what the brief asks
    (question for Jaskaran in the round 13 record)
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 2: "A6: take n_pixels from reduceToVectors' count, and area_ha
    from it." Review A6 (docs/reviews/2026-10-19-review.md): "For some polygons with a hole that touches the outer ring
    at a vertex, Earth Engine's area() adds the holes instead of subtracting them. So area_ha and n_pixels of those
    stands are too large." Stand 83 of sanjay_van_alphaearth_keptland_r9 is 18.27 ha and 1,827 pixels in its committed
    layer; its planar area with its 5.01 ha hole subtracted is 8.23 ha, and its merge record gives 823 pixels. The new
    test fails on the export before the fix (assert 1827 == 823). Checked offline on the committed layers: every
    polygon's area_ha is its area on a sphere of radius 6,371,008.8 m within 1 part in 10^6, with its holes subtracted
    or, for the polygons A6 describes, added; 52 of the 3,816 polygons of the eight committed _r9 stands_merged layers
    are off by more than 1% (15.97 ha, as the review found), 104 of 10,381 in all 22 committed layers of
    docs/reproducibility/r9_runs, 137 of 9,951 in the 22 of docs/reproducibility/round12_runs and 404 of 31,254 in the
    57 of odisha_script/phase2_vectors. Every vertex of the stands_merged and stands_snic layers there lies on the 10 m
    grid of the run's UTM zone, so their planar area is a whole number of pixels, the count the export now reads; the
    _r9 and round 12 stands_dissolved layers lie on it too. That area is 0.2% to 0.3% below area() at the Odisha sites
    and 0.11% at Sanjay Van for every polygon, so a re-export gives slightly smaller areas throughout, closer to the
    WGS84 ellipsoidal area (within 0.07% of it at the Odisha sites). No scored statistic reads area_ha (review A6);
    the committed descriptive numbers it changes carry dated notes. The export is not cached, so no step key moves.
    No paper was searched for this decision.
