- id: field-meta-canopy-height-disqualified
  title: >-
    Meta/WRI 1 m canopy height is disqualified as a merge criterion; no replacement height source is installed
  decision: >-
    The Meta/WRI 1 m canopy-height product is not used. No other canopy-height source replaces ETH. The
    write-ups record the absence as a decision, not an omission.
  alternatives_considered:
  - >-
    NO DATA: the zeros are masked pixels or missing tiles (closed by direct measurement)
  - >-
    RECOVERABLE: re-sample with a buffered reducer that skips masked pixels (closed: the pixels are present
    and equal to 0)
  - >-
    The zeros are temporal, forest that grew after the imagery (tested in step 11; fails under the documented
    imagery window)
  rationale: >-
    The product reads exactly 0 at 122 of 274 plots. At 12 diagnosed zero plots the 1 m grid is fully
    unmasked and present, and reads 0 over field-measured forest: one plot carries 33.57 m of Lorey's
    height, another has 83% crown cover. Offsets up to 500 m do not find canopy. The product's global
    correction is a multiplier, and a multiplier applied to zero returns zero, so no re-sampling or aggregation
    fixes it. The headline R² of 0.241 is void; 0.142 with zeros excluded describes a biased subset.
  evidence:
  - path: odisha_script/PHASE1_STATUS.md
    what: '''Unresolved'' item 1, lines 123-246; item 6, lines 308-312'
  - path: docs/phase1_supervisor_memo.md
