- id: spec-merge-runs-client-side-uncached
  title: >-
    The merge runs on the client as plain Python, is not cached, and orders ties by centroid
  decision: >-
    The stage downloads the superpixel adjacency graph (a few thousand rows), merges it in pure Python
    with union-find, and sends the result back as a relabel of the SNIC image (remap). The stand image
    is not cached as an asset. Ties are broken by stand centroid, not by SNIC label. Recorded 20 Oct 2026
    (round 13, review C12): one tie in the code is not broken by centroid. In pass 2's shared-edge fallback,
    two neighbours sharing boundaries of the same length go to the lower root index (pass2_partner in
    fmu.utils.region_merge), and the dense index is the rank of the SNIC label (fmu.utils.adjacency numbers
    the sorted labels 0 to n - 1), so that tie follows SNIC label order; order_key also ends on the dense
    index, for two centroids equal to 7 decimals. Whether the code or this entry is to change is a question
    for Jaskaran (round 13); until it is answered, the code is as it was. Round 14 (26 Oct 2026): the code
    changed (round 13 question 24, answer (a)). The fallback's tie is now broken by order_key, centroid first,
    as this entry decides, in both of the fallback's lists (spec-merge-fallback-tie-by-centroid); order_key
    still ends on the dense index, for two centroids equal to 7 decimals.
  alternatives_considered:
  - 'Caching stand_clusters like other stage outputs: named and rejected'
  - 'Ordering by SNIC label: named and rejected'
  rationale: >-
    merge.py: Earth Engine has no native region-adjacency-graph merge; a client-side merge is readable
    and can be unit-tested without a server, and remap needs no export or asset ingestion. The output
    is a cheap remap of a cached image, and the thresholds are the thing being iterated on, so a stale
    cached copy would silently poison exactly that. SNIC labels are not a stable thing to sort by because
    tessellations differ from run to run; a centroid is. The run fails loudly above max_superpixels (50,000)
    rather than send a six-figure remap list.
  evidence:
