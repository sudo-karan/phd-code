- id: spec-merge-comment-states-xiong-eq1-exactly
  title: >-
    The merge settings' comment gives Xiong's merging rule (Eq. 1) exactly, canopy closure among its five conditions
  decision: >-
    The comment on the merge settings, the MergeParams docstring in src/fmu/config.py (a Locked module), no longer calls
    canopy closure Xiong's "third axis". It says: "Xiong's merging rule (Eq. 1) has five conditions: the pair's area
    under the maximum, the same dominant species, canopy closure within 0.2, dominant-species proportion within TP1
    and mean height within SH1; the eliminating rule (Eq. 2) drops closure and relaxes TP and SH. FMU has analogues of
    three: max_area_ha for the area bound, canopy_height for the stand height and ndvi_amplitude_annual for the
    species proportion. It has none for closure or for the same species." docs/configs.md (the merge criteria), the
    decision text of spec-merge-default-criteria, and the name and docstring of the test that pins the default
    criteria say the same; the test is now
    test_default_criteria_are_analogues_of_two_of_xiongs_merge_conditions (tests/test_merge_config.py), and the
    three other entries that named it (dn-snic-canopy-height-std-removed, dn-merge-criteria-identical-across-arms,
    spec-merge-default-criteria) name it so. A comment only: no setting, default or behaviour changed.
  alternatives_considered:
  - >-
    Leave the comment as it is (option (a) of question 2 of docs/handoff/2026-10-18-round11.md): not chosen
  - >-
    Use round 11's brief's wording, that canopy closure is computed per segment but is not a merge rule (option (c)):
    not chosen
  rationale: >-
    Jaskaran's answer (b) to question 2 of docs/handoff/2026-10-18-round11.md, 19 Oct 2026 (the round 12 brief): "Xiong
    comment: (b). Make it exact, keeping closure as a merge condition, with the wording option (b) proposes. Comment
    only: prove it inert (config fingerprints, the gate tests), and bring docs/configs.md, the decision text of
    spec-merge-default-criteria, and the test's name and docstring into line. A register entry for the Locked module,
    as MODULES.md asks." The wording is option (b)'s, with "his" four times replaced by "the", the
    paper having several authors. Round 11 read the version of record (Silva Fennica 58(2), article 23014: the
    publisher's PDF and the images of the equations on its web page) and the authors' code: Eq. 1 (section 2.6.1) is
    five conditions, among them canopy closure within 0.2, and merges a segment with the neighbour "which meets all
    the above conditions"; Eq. 2 (section 2.6.2) has no closure term; the thresholds are SH1 3, TP1 0.2, SH2 5 and TP2
    0.5 (section 4.1). The old comment's core claim agreed with Eq. 1, but "axis" put closure on a par with height and
    species proportion and the comment left out the same-species condition. Proof that the change is inert, against
    the commit before it: the legacy fingerprint, the per-step cache keys and the loaded settings of all 63 configs in
    configs/, and MergeParams()'s defaults, are the same before and after; src/fmu/config.py's syntax tree with its
    docstrings removed is unchanged; and the gate passes. Crossref (https://api.crossref.org/works/10.14214/sf.23014),
    read again on 19 Oct 2026, gives the paper's title and Hao Xiong as its first person author, and lists no
    correction.
  evidence:
  - path: src/fmu/config.py
    what: The MergeParams docstring
  - path: docs/configs.md
    what: The merge section, criteria
  - path: tests/test_merge_config.py
    what: test_default_criteria_are_analogues_of_two_of_xiongs_merge_conditions, its name and docstring
  - path: docs/handoff/2026-10-18-round11.md
    what: Fix 1, the reading of the paper and of the authors' code; question 2, with its three options
  - path: docs/handoff/2026-10-19-round12.md
    what: Jaskaran's answer, as given, and the proof that the change is inert (Task 1)
  - path: MODULES.md
    what: config.py is Locked; a change to a Locked module needs an entry in this register
  papers:
  - doi: 10.14214/sf.23014
    title: Forest stand delineation using airborne LiDAR and hyperspectral data
    first_author: Xiong
    year: 2024
    verified: true
    supports: used
    supports_what: >-
      The merging rule (Eq. 1) and the eliminating rule (Eq. 2) that the comment states. Read in round 11 from the
      version of record: the publisher's PDF (Eq. 1 on page 7, Eq. 2 on page 8, the thresholds in section 4.1) and
      the images of the equations on the publisher's web page; the five conditions of Eq. 1 and the absence of a
      closure term in Eq. 2 were checked there. Crossref's author list starts with an institution deposited as an
      author; the first person listed is Hao Xiong, marked first.
    cited_in: >-
      src/fmu/config.py (MergeParams docstring); docs/configs.md (merge criteria); tests/test_merge_config.py
      (docstring of test_default_criteria_are_analogues_of_two_of_xiongs_merge_conditions)
