- id: dn-nirv-units-reflectance-0-1
  title: NIRv uses real reflectance (0 to 1), so B8 is divided by 10000 first
  decision: >-
    NIRv = NIR reflectance x NDVI, with NIR reflectance on the 0-1 scale. Sentinel-2 stores reflectance
    as integers scaled by 10000, so the stage divides B8 by 10000 before multiplying by NDVI. NDVI is
    unaffected because the scaling cancels in the ratio.
  alternatives_considered:
  - Using the stored integers directly (gives values about 10000 times too large)
  - Leaving the values as they were and adapting the display palette instead
  rationale: >-
    'This isn't optional or stylistic; using the stored integers directly produces values ~10000x too
    large and breaks the literature definition.' It was found when NIRv maps 'rendered fully saturated
    against a 0-1 palette'. Fixing it in the feature stage was preferred because '(a) the values are now
    physically meaningful, (b) the clusterer treats both indices on the same scale before z-scoring, and
    (c) future stages don't need to remember which index is in which range'.
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''NIRv units: NIR_reflectance × NDVI (both 0-1)'''
  - path: src/fmu/stages/features_optical.py
    what: '_add_index: nir_stored.divide(10000) multiplied by ndvi when index is nirv'
  - path: tests/test_features_optical_live.py
    what: 'test_nirv_mean_in_plausible_range: NIRv lies in [0, 1] (needs Earth Engine)'
  - path: configs/sanjay_van_nirv_dual.yaml
    what: 'The config that uses index: nirv'
  papers:
  - doi: 10.1126/sciadv.1602244
    title: Canopy near-infrared reflectance and terrestrial photosynthesis
    first_author: Badgley
    year: 2017
    verified: true
    supports: used
    supports_what: >-
      The paper is the source of NIRv: it introduces it as the product of total scene NIR reflectance
      and NDVI, and applies it to estimate photosynthesis. (The paper also reports NIRv doing better than
      NDVI or fPAR in its own tests, but the repo does not cite it for that, so the weaker 'used / method
      source' is recorded.) In this entry the repo cites it for: the definition of NIRv as NDVI x NIR
      reflectance, with reflectance on the 0-1 scale. Check of that claim: Partly confirmed. NIRv = NDVI
      x NIR reflectance is the paper's definition. Not confirmed: the '0-1 scale' part; the text read
      states no numeric scale for reflectance. One difference: the paper's Methods subtract 0.08 from
      NDVI before multiplying. The repo's wording does not mention this, and whether the code applies
      it was not checked.
    cited_in: >-
      docs/design_notes.md, section 'NIRv units: NIR_reflectance × NDVI (both 0-1)', line 264; also the
      _add_index docstring in src/fmu/stages/features_optical.py and tests/test_features_optical_live.py
      line 143
  status: adopted
  design_notes_section: 'NIRv units: NIR_reflectance × NDVI (both 0-1)'
  source: docs/design_notes.md lines 262-278
- id: dn-radar-percentiles-no-harmonic
  title: Radar is summarised with percentiles, not a fitted seasonal curve
  decision: >-
    No harmonic regression is fitted to Sentinel-1. The six-year series is summarised per pixel with percentiles
    (p10, p50, p90), temporal spread (p90 minus p10) and one derived contrast (VV minus VH in dB).
  alternatives_considered:
  - Fitting harmonics to the radar series, as is done for optical phenology
  rationale: >-
    'SAR backscatter doesn't have a clean seasonal cycle to fit. Returns depend on surface geometry, soil
    moisture, and biomass; not on photosynthesis.'
