- id: spec-clustering-measured-neighbourhood
  title: >-
    Clustering passes the measured widest stand extent to reduceConnectedComponents, not the cap
  decision: >-
    Before averaging features per unit, the stage measures the widest unit extent in pixels in two grids
    (the feature image's and the label image's) and passes min(cap, ceil(widest x 1.2) + 2) as maxSize.
    If the measurement returns nothing while labels exist, the stage raises an error and does not fall
    back to the cap.
  alternatives_considered:
  - >-
    Passing the derived cap (1200 px) directly, as before: ran out of memory on the 64-band AlphaEarth
    stack
  - 'Falling back to the cap when the measurement is empty: named and refused'
  rationale: >-
    maxSize is an extent in pixels and Earth Engine pads every tile by it; tileScale does not shrink the
    pad. At 1200 px each 256 px tile was evaluated over about 2656² pixels per band, so memory grew with
    bands times pad, and 64 embedding bands crossed the limit where 22 hand-crafted bands did not. Every
    unit is still averaged whole, so results agree with the old call up to floating-point summation order.
    Jaskaran decided on 2026-09-14 to fix the stage's memory use and then run the AlphaEarth arm. A second
    reader (entry dn-rcc-neighbourhood-measured) recorded: The argument does not clamp; it masks any component
    larger than it. The hand-set values disagreed, so the embedding arm lost 15 superpixels (43.9 ha,
    3.8% of segmented area) that the baseline kept. Passing the cap itself ran out of memory on wide band
    stacks, because Earth Engine pads every tile by maxSize.
