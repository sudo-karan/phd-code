  - path: tests/test_clustering_units_dropped_by_cause.py
    what: The two causes counted apart, the unweighted histogram of the habitat-masked labels, the "null" key, the summary numbers; fails on the old code
  - path: tests/data/clustering_off_calls.json
    what: The recorded calls of the three configs, one more request each
