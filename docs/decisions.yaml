- id: spec-explained-variance-headline
  title: >-
    Headline partition score: explained variance (R²) at pixel level, with the stand count beside it;
    silhouette demoted
  decision: >-
    The metrics stage reports R² = 1 - SS_within / SS_total for chosen attributes, computed over pixels,
    always with n_stands in the same record. Each attribute is marked used (it helped draw the boundaries)
    or held out, and config loading rejects a 'held out' attribute that segmentation or merge already
    uses. Silhouette stays only as an internal check of the labelling step.
  alternatives_considered:
  - 'Silhouette as the cross-arm headline: demoted'
  - 'Scoring R² at region level (one row per region): named and rejected'
  rationale: >-
    R² is called the field's standard partition-quality measure and it needs no ground truth; six of the
    twenty surveyed papers are said to report it. Silhouette is computed in each arm's own feature space
    (21 against 64 dimensions) and depends strongly on dimensionality, so it was never a valid cross-arm
    number. Region-level scoring makes any partition score 1.000 by construction. R² rises with stand
    count, so two arms at different counts cannot be compared on it. R² on an attribute that drew the
    boundaries is partly circular; it is reported anyway because it is the number the literature quotes.
