      repo cites it for: defining R-squared = 1 - SS_within/SS_total, and reporting 97.35% (tree height)
      and 81.80% (canopy height). Check of that claim: 97.35% (mean tree height) and 81.80% (mean canopy
      height): confirmed by both verifiers. Eq. 4-6 define R2 = 1 - SSwithin/SStotal: confirmed by the
      verifier who read the equation images; the other verifier could not read them. A later review of
