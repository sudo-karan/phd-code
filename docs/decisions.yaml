  design_notes_section: Pydantic v1 vs v2
  source: docs/design_notes.md lines 113-117
- id: dn-masking-indiasat-primary-habitat
  title: Habitat comes from IndiaSAT land cover, classes Trees and Shrubs/Scrubs
  decision: >-
    The habitat mask is built from the IndiaSAT land-cover product (30 m, one map per year, 2017-2022).
    Class 6 (Trees) and class 12 (Shrubs/Scrubs) count as habitat. Every other class is not habitat.
  alternatives_considered:
  - >-
    ESA WorldCover as the primary habitat source (docs/datasets.md: 'Why IndiaSAT as primary over WorldCover';
    WorldCover is kept only as a fallback)
  rationale: >-
    The note says IndiaSAT was 'built specifically for Indian landscapes'. docs/datasets.md adds that
    its class scheme is built for Indian landscapes and its Trees/Shrubs classes give a direct habitat
    definition. The note also says class labels are a categorical land-cover signal, different in kind
    from the continuous phenology features that are clustered later.
  evidence:
  - path: docs/design_notes.md
    what: >-
      Section 'Masking: IndiaSAT-primary, single-phase habitat', first and last paragraphs
  - path: docs/datasets.md
    what: >-
      Section 'CoRE Stack LULC (IndiaSAT)': asset, classes, why IndiaSAT over WorldCover
  - path: src/fmu/stages/masking.py
    what: MaskingStage.run builds habitat from masking.indiasat_habitat_classes
  - path: src/fmu/config.py
    what: >-
      MaskingParams.indiasat_habitat_classes default [6, 12]; DatasetsConfig.indiasat default projects/corestack-trees/assets/LULC_v4
  - path: tests/test_masking_live.py
    what: Live tests of the masking stage on Sanjay Van (need Earth Engine)
  - path: MODULES.md
    what: 'Row 7: masking reworked to single-phase IndiaSAT habitat mask'
  - path: docs/current_flow.md
    what: 'Masking section: ''Why these data sources'''
  papers:
  - doi: 10.1145/3460112.3471953
    title: >-
      IndiaSat: A Pixel-Level Dataset for Land-Cover Classification on Three Satellite Systems - Landsat-7,
      Landsat-8, and Sentinel-2
    first_author: Bansal
    year: 2021
    verified: true
    supports: used
    supports_what: >-
      Source paper of the IndiaSat dataset. The abstract describes 180,414 hand-checked pixels labelled
      into four land-cover classes (greenery, water bodies, barren land, built-up area), and shows the
      dataset can train simple classifiers on Google Earth Engine for Landsat-7, Landsat-8 and Sentinel-2.
      In this entry the repo cites it for: the source of the IndiaSAT land-cover product, a 30 m annual
      raster for 2017-2022 built for Indian landscapes. Check of that claim: Partly confirmed. This is
      the IndiaSat paper and it is an India-specific land-cover resource. Not confirmed from the abstract:
      that it is a land-cover map product with Trees and Shrubs classes. The abstract describes a labelled-pixel
      training dataset with four classes, none of them Trees or Shrubs. The '30 m annual raster for 2017-2022'
      description matches the CoRE Stack LULC product page, not anything read from the 2021 paper. The
      full text was not read.
    cited_in: >-
      docs/design_notes.md, section 'Masking: IndiaSAT-primary, single-phase habitat', line 121; also
