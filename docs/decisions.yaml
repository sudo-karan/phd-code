- id: spec-cache-on-the-analysis-grid-with-per-step-keys
  title: >-
    New runs cache every asset on the UTM analysis grid, under one key per step; configs run before round 9 keep
    the legacy layout
  decision: >-
    Two cache layouts (src/fmu/utils/caching.py). In the per-step layout every cached asset is exported on the
    analysis grid segmentation uses (the ROI's UTM zone at export.analysis_scale_m, with the crs and crsTransform of
    fmu.utils.grid.analysis_grid), so cached and live features are the same pixels, and is named
    <key>__s<step key>, a hash of the settings that step reads (STEP_SETTINGS), the ROI file's content and the keys
    of the steps whose outputs it reads. The legacy layout is the one of every run before 17 Oct 2026: one
    fingerprint over most of the config, exports given the scale alone (a geographic grid for a computed image).
    fmu.pipeline.cache_layout_for gives a config the legacy layout when its cache holds an asset of that layout,
    and the per-step layout otherwise, so the configs run before round 9 still read and write their assets as they
    did, and a copy of one under a new name, changing nothing else, gets the per-step layout. The manifest records
    the layout, why, and each stage's key.
  alternatives_considered:
  - >-
    Make segmentation always read the cache, with the cache left on the geographic grid (option (b) of question 1
    of PR #42): not chosen
  - >-
    Leave the cache as it is and record the route each run took (option (c)): not chosen
  - >-
    Switch every config to the new layout at once: not chosen, because the scripts that read the record of earlier
    runs from their assets (the read-back, the masking maps, the inspectors) would then compute those runs live
    instead of reading what they made
  - >-
    A config setting that chooses the layout: not chosen, because the round-9 copies of the configs change only
    their name
  rationale: >-
    Jaskaran's answer (a) to question 1 of PR #42 ("the cache on the UTM grid", 13 Oct 2026, deferred to the final
    round) and the round 9 brief of 17 Oct 2026 (task B, issue #44 items 1 and 2: "Cached features on the UTM grid
    segmentation uses. Per-step cache keys"). docs/reproducibility.md (section 4 of the Odisha re-runs) showed that
    a config's superpixels depend on whether its features were cached when SNIC ran, through the grid alone: 22% to
    35% of pixels with hand-crafted features. A per-step key over a wrong list of settings would leave a stale asset
    in use for one step; tests/test_cache_layout.py reads each stage's module and fails on a setting it reads that
    its key does not cover. How a config's layout is chosen (by the assets in its cache) and the key's form ("s" and
    ten hex digits) are Claude Code's choices, put to Jaskaran in the round 9 brief file; he kept them (question 2,
    answer (a), 18 Oct 2026). The round 9 cache test (docs/reproducibility/round9_cache_test/) passed under the
    brief's criterion (Jaskaran's ruling, 18 Oct 2026): two from-scratch runs give the same superpixels, stands and
    stand types exactly, and their feature values agree to about 1e-13, a stated property of the pipeline. No paper
    was searched for this decision.
