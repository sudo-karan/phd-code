  - path: configs/odisha_v120_3ha_squares_kendujhar_keptland.yaml
    what: >-
      segmentation.mask_before_snic true; the header says what differs from the box config it copies (the other three
      districts' configs are built the same way)
  - path: tests/test_keptland_configs.py
    what: >-
      Each config differs from its source only in the named keys; mask_before_snic is true and
