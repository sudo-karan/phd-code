    what: The two layouts, STEP_SETTINGS, step_upstream, step_key, cache_key, start_export with crs and crs_transform
  - path: src/fmu/pipeline.py
    what: cache_layout_for, Pipeline(cache_layout=...), the exports on the analysis grid, the manifest's cache_layout
  - path: src/fmu/utils/grid.py
    what: analysis_grid_export_args
  - path: tests/test_cache_layout.py
    what: What each key covers, how keys move, which layout a config gets
  - path: tests/test_pipeline_cache_layout.py
    what: The orchestrator under the two layouts
  - path: docs/reproducibility.md
    what: Section 4 of the Odisha re-runs, the cause found on 13 Oct 2026
