- id: spec-k-elbow-as-a-cached-step
  title: >-
    The k elbow is a cached step of its own, keyed without k; built and tested, not used to set k
  decision: >-
    src/fmu/stages/k_elbow.py: k-means (scikit-learn, seed 42, 25 starts) on the clustering stage's training rows,
    read back from its cached feature_stack, for k from k_elbow.k_min to k_elbow.k_max (default 2 to 12), with the
    elbow by the rule of the earlier elbows (the point farthest from the chord). Its output is a table cached as an
    asset, in the per-step layout only, under a key over the clustering settings but k, the steps upstream of
    clustering and the new k_elbow config block, so a configuration's elbow is computed once and read back by later
    runs whatever its k. It is in no default run and nothing reads it; k stays as each config sets it.
