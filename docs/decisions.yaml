  - path: odisha_script/odisha_phase1_10_results.txt
    what: offset ladder and band histogram
  - path: odisha_script/odisha_phase1_11_results.txt
    what: survey dates and the temporal alternative
  - path: odisha_script/PHASE2_STATUS.md
    what: 'lines 1332-1333: no replacement source installed'
