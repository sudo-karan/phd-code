  - >-
    6 stand types for the 3 ha stands, carried over from the 10 ha configs (PR #40): replaced by 5
  rationale: >-
    Choosing the number by agreement 'would manufacture the result'. The elbow rule is the one the supervisor
    named. For the 3 ha stands the elbow gives 5 in every district and pooled, so by the rule 6 was the
    wrong number. For the 10 ha stands, 6 was already in the Phase 2 configs; the elbow was run ten days
    later (6, 6, 6 and 5 by district, 5 pooled) and 6 was kept.
