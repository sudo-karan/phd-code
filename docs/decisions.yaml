- id: spec-component-cap-derived
  title: >-
    The reduceConnectedComponents size cap is derived from the maximum stand area, not set by hand
  decision: >-
    The cap is computed as ceil(merge.max_area_ha x 10,000 / scale²) x 1.2, which is 1200 pixels at 10
    ha and 10 m. Before each use the stage checks that no unit is larger than the cap and stops with an
    error if one is. The old clustering.superpixel_max_size setting is removed.
  alternatives_considered:
  - >-
    A hand-set superpixel_max_size per config (1024 in the baseline, 256 in the embedding config): retired
  rationale: >-
    config.py and components.py: Earth Engine's maxSize does not clamp, it masks any component larger
    than it, with no error or warning. The two shipped configs disagreed, so the embedding arm silently
    lost 15 superpixels totalling 43.9 ha (3.8% of its segmented area) in a two-arm comparison. A hand-set
    number that deletes data when it is too small should not be hand-set. A derived bound is only as good
    as its premise, so the premise is checked against the actual labels.
