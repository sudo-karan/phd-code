- id: field-meta-canopy-height-disqualified
  title: >-
    Meta/WRI 1 m canopy height is disqualified as a merge criterion; no replacement height source is installed
  decision: >-
    The Meta/WRI 1 m canopy-height product is not used. No other canopy-height source replaces ETH. The
    write-ups record the absence as a decision, not an omission.
  alternatives_considered:
  - >-
    NO DATA: the zeros are masked pixels or missing tiles (closed by direct measurement)
  - >-
    RECOVERABLE: re-sample with a buffered reducer that skips masked pixels (closed: the pixels are present
    and equal to 0)
  - >-
    The zeros are temporal, forest that grew after the imagery (tested in step 11; fails under the documented
    imagery window)
  rationale: >-
    The product reads exactly 0 at 122 of 274 plots. At 12 diagnosed zero plots the 1 m grid is fully
    unmasked and present, and reads 0 over field-measured forest: one plot carries 33.57 m of Lorey's
    height, another has 83% crown cover. Offsets up to 500 m do not find canopy. The product's global
    correction is a multiplier, and a multiplier applied to zero returns zero, so no re-sampling or aggregation
    fixes it. The headline R² of 0.241 is void; 0.142 with zeros excluded describes a biased subset.
  evidence:
  - path: odisha_script/PHASE1_STATUS.md
    what: '''Unresolved'' item 1, lines 123-246; item 6, lines 308-312'
  - path: docs/phase1_supervisor_memo.md
    what: sections 2 and 3, lines 42-90; reference lines 191-193
  - path: odisha_script/odisha_phase1_7_results.txt
    what: zero census; unmasked 1 m grids at 12 zero plots and 5 controls
  - path: odisha_script/odisha_phase1_10_results.txt
    what: offset ladder and band histogram
  - path: odisha_script/odisha_phase1_11_results.txt
    what: survey dates and the temporal alternative
  - path: odisha_script/PHASE2_STATUS.md
    what: 'lines 1332-1333: no replacement source installed'
  papers:
  - doi: 10.1016/j.rse.2023.113888
    title: >-
      Very high resolution canopy height maps from RGB imagery using self-supervised vision transformer
      and convolutional decoder trained on aerial lidar
    first_author: Tolan
    year: 2024
    verified: true
    supports: used
    supports_what: >-
      Source paper of the Meta / WRI 1 m canopy height maps. The authors pre-train a vision transformer
      on Maxar imagery without labels, train a decoder against aerial lidar, and add a correction step
      trained on GEDI. In this entry the repo cites it for: the Meta/WRI 1 m canopy height product: that
      its model is supervised on aerial lidar from NEON sites in the United States only, with non-US data
      used for validation, and that a post-processing network trained on 13 million GEDI measurements
      supplies a scalar multiplier matched to GEDI RH95. Check of that claim: Confirmed from the arXiv
      preprint 2304.07213 (the journal version was not read, so wording may differ slightly): trained
      on NEON aerial lidar only, in the United States; 'The ground truth data consisted of 13 million
      GEDI measurements'; the quoted sentence on the scalar multiplier and GEDI RH95 is present word for
      word. One correction: CA-Brande and Sao Paulo are the validation datasets outside NEON, and CA-Brande
      is in California, so it is not 'non-US data' as docs/phase1_supervisor_memo.md lines 72-74 puts
      it. Only Sao Paulo is outside the US.
    cited_in: >-
      odisha_script/PHASE1_STATUS.md:220-233; docs/phase1_supervisor_memo.md:72-77 and :191-193; odisha_script/odisha_phase1_3_sample_gee_v2.py:8
