- id: spec-keptland-runs-sites-and-ceilings
  title: >-
    The kept-land runs: Sanjay Van at 10 ha with its existing settings, Odisha on the four 3 ha box configs
  decision: >-
    Round 3 has six kept-land configs. For Sanjay Van, the hand-crafted baseline and the AlphaEarth arm, each with its
    existing settings, so at a 10 ha stand ceiling: they copy configs/sanjay_van_baseline.yaml and
    configs/sanjay_van_alphaearth.yaml, which have no merge block, so the merge keeps its defaults (stands of 1 to 10
    ha) but for merge.pass2_skip_at_min_area, which both set to true (the default and the sources' setting is false).
    For Odisha, the four 3 ha box configs of task A0 (configs/odisha_v120_3ha_squares_<district>.yaml), with their
    merge rule (pass2_skip_at_min_area true), so all six skip at the minimum in the merge's second pass
    (spec-merge-pass2-skip-at-minimum). The AlphaEarth arm's metrics.reference_config_name is
    sanjay_van_baseline_keptland, the baseline on kept land, in place of its source's sanjay_van_baseline; the metrics
    block is not in the cache fingerprint, so this moves no asset. There is no
    kept-land config for Sanjay Van at 3 ha, for the Odisha hull areas, for the Odisha 10 ha arm or for AlphaEarth in
    Odisha. Upstream of segmentation nothing the configs change is read, so their masking, data-load and feature
    assets can be copies of those of the runs they copy; for Sanjay Van that is the _repro run of the same content
    (docs/demo/demo_set.json), the only run of it with assets at today's fingerprint: the baseline's assets under
    its own name carry an older fingerprint (docs/reproducibility/sanjay_van_baseline_assets_aug27_vs_repro.json),
    and the AlphaEarth arm has none under its own name (docs/reproducibility.md). No batch run until Jaskaran says
    go.
  alternatives_considered:
  - >-
    A 3 ha stand ceiling for Sanjay Van as well (Prof. Seth's ceiling; part C, item 9 of
    docs/handoff/2026-10-13-round2.md): not chosen; Sanjay Van stays at 10 ha
  - >-
    Kept-land copies of the Odisha hull configs, of the Odisha 10 ha arm or of the Odisha AlphaEarth arm: not made
  - >-
    Keep the Sanjay Van configs at the earlier pass-2 rule (pass2_skip_at_min_area false, their sources' setting):
    built so in round 3, as the brief named the only keys to change, and not kept (Jaskaran, 15 Oct 2026). The Sanjay
    Van stands would then differ from the demo stands, which were re-merged with the rule true, in this rule as well,
    and the Odisha ones would not
  - >-
    Leave the AlphaEarth arm's metrics reference at sanjay_van_baseline: not kept (Jaskaran, 15 Oct 2026). That run has
    no assets at today's fingerprint, so a metrics run of the arm would fail; the batch itself does not run metrics
  rationale: >-
    Jaskaran's decision D4 of 14 Oct 2026: "Sanjay Van stays at 10 ha (its existing settings). Odisha: the four 3 ha
    box configs." Because the brief named the only keys that change, the two Sanjay Van configs first kept the earlier
    pass-2 rule (pass2_skip_at_min_area false) where the box configs keep the rule of spec-merge-pass2-skip-at-minimum.
    Jaskaran's answers of 15 Oct 2026 to questions 6 and 7 of docs/handoff/2026-10-14-round3.md: "(b): set
    merge.pass2_skip_at_min_area: true in both Sanjay Van kept-land configs", and (b) for the reference, point it at
    sanjay_van_baseline_keptland. The register entry spec-merge-pass2-skip-at-minimum keeps false for reproducing
    earlier runs and says configs of the final round set the rule explicitly. No paper was searched for this
    decision.
  evidence:
