- id: spec-cache-on-the-analysis-grid-with-per-step-keys
  title: >-
    New runs cache every asset on the UTM analysis grid, under one key per step; configs run before round 9 keep
    the legacy layout
  decision: >-
    Two cache layouts (src/fmu/utils/caching.py). In the per-step layout every cached asset is exported on the
    analysis grid segmentation uses (the ROI's UTM zone at export.analysis_scale_m, with the crs and crsTransform of
    fmu.utils.grid.analysis_grid), so cached and live features are the same pixels, and is named
    <key>__s<step key>, a hash of the settings that step reads (STEP_SETTINGS), the ROI file's content and the keys
    of the steps whose outputs it reads. The legacy layout is the one of every run before 17 Oct 2026: one
    fingerprint over most of the config, exports given the scale alone (a geographic grid for a computed image).
    fmu.pipeline.cache_layout_for gives a config the legacy layout when its cache holds an asset of that layout,
    and the per-step layout otherwise, so the configs run before round 9 still read and write their assets as they
    did, and a copy of one under a new name, changing nothing else, gets the per-step layout. The manifest records
    the layout, why, and each stage's key.
  alternatives_considered:
  - >-
    Make segmentation always read the cache, with the cache left on the geographic grid (option (b) of question 1
    of PR #42): not chosen
  - >-
    Leave the cache as it is and record the route each run took (option (c)): not chosen
  - >-
    Switch every config to the new layout at once: not chosen, because the scripts that read the record of earlier
    runs from their assets (the read-back, the masking maps, the inspectors) would then compute those runs live
    instead of reading what they made
  - >-
    A config setting that chooses the layout: not chosen, because the round-9 copies of the configs change only
    their name
  rationale: >-
    Jaskaran's answer (a) to question 1 of PR #42 ("the cache on the UTM grid", 13 Oct 2026, deferred to the final
    round) and the round 9 brief of 17 Oct 2026 (task B, issue #44 items 1 and 2: "Cached features on the UTM grid
    segmentation uses. Per-step cache keys"). docs/reproducibility.md (section 4 of the Odisha re-runs) showed that
    a config's superpixels depend on whether its features were cached when SNIC ran, through the grid alone: 22% to
    35% of pixels with hand-crafted features. A per-step key over a wrong list of settings would leave a stale asset
    in use for one step; tests/test_cache_layout.py reads each stage's module and fails on a setting it reads that
    its key does not cover. How a config's layout is chosen (by the assets in its cache) and the key's form ("s" and
    ten hex digits) are Claude Code's choices, put to Jaskaran in the round 9 brief file; he kept them (question 2,
    answer (a), 18 Oct 2026). The round 9 cache test (docs/reproducibility/round9_cache_test/) passed under the
    brief's criterion (Jaskaran's ruling, 18 Oct 2026): two from-scratch runs give the same superpixels, stands and
    stand types exactly, and their feature values agree to about 1e-13, a stated property of the pipeline. No paper
    was searched for this decision. Review C40 (19 Oct 2026; added here 20 Oct 2026, round 13): the ROI file's
    content is read from the path as the config gives it, relative to the working directory, and a file that
    cannot be read hashes as None, with no warning. From a directory where the path does not resolve, every
    per-step key changes while the legacy fingerprint, which hashes the path, does not (the 10 km tile config run
    from docs/: masking key s4a47c8b2cc against s354522a974 from the repo root, fingerprint 5772fb6133 both). Every
    entry point then fails safe, with a misleading reason: the ROI loader raises, or the pass runner reports every
    upstream asset missing (exit 3). No run of record is affected: the keys of record are pinned
    (tests/test_step_keys_of_record.py). The docs say so since round 13; whether to resolve the path against the
    repo root is put to Jaskaran. Round 14 (26 Oct 2026): it is resolved now, against the root of the checkout the
    fmu package was imported from, and a file that cannot be read raises (round 13 question 41, Claude Code's
    recommendation (a); register entry spec-per-step-keys-resolve-the-roi-file-from-the-checkout-root). No
    fingerprint and no step key of a config run from the repo root moves.
  evidence:
  - path: src/fmu/utils/caching.py
    what: The two layouts, STEP_SETTINGS, step_upstream, step_key, cache_key, start_export with crs and crs_transform
  - path: src/fmu/pipeline.py
    what: cache_layout_for, Pipeline(cache_layout=...), the exports on the analysis grid, the manifest's cache_layout
  - path: src/fmu/utils/grid.py
    what: analysis_grid_export_args
  - path: tests/test_cache_layout.py
    what: What each key covers, how keys move, which layout a config gets
  - path: tests/test_pipeline_cache_layout.py
    what: The orchestrator under the two layouts
  - path: docs/reproducibility.md
    what: Section 4 of the Odisha re-runs, the cause found on 13 Oct 2026
  - path: docs/reviews/2026-10-19-review.md
    what: C40, the ROI file read from the working directory
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, PR #42 question 1 (13 Oct 2026) and the round 9 brief (17 Oct 2026)
- id: spec-every-feature-stage-cached-before-the-first-pass-that-reads-one
  title: >-
    A batch run caches every feature stage in a pass of its own before the first pass that reads any of them
  decision: >-
    odisha_script/odisha_phase2_2_run_pipeline.py runs four passes: features (masking, the S2 composite and every
    feature stage the config needs, fmu.pipeline.feature_stage_names: segmentation's, the merge criteria's and
    clustering's alike), segmentation, clustering and export. Each pass after the first refuses to start (exit 3)
    while any cacheable output of the features pass, or of an earlier pass, is missing, so no pass computes a feature
    image live that another pass reads from the cache. odisha_script/run_config_passes.sh calls the four in order and
    odisha_script/run_passes_safely.py reads the features pass's exit code too.
  alternatives_considered:
  - >-
    Keep the three passes, with the feature stages segmentation does not read computed in the clustering pass: the
    way of every run before round 9, not chosen
  rationale: >-
    The round 9 brief (17 Oct 2026, task B, issue #44 item 2: "every feature stage cached before the first pass that
    needs any of them"), and question 2 of PR #43: in 13 of the 14 runs of 13 Oct 2026 the pass that fitted the stand
    types computed a feature stage live that the export pass read from the cache (static features in the hand-crafted
    runs, the merge criteria in the AlphaEarth runs), and the saved types agree with a second fit in 3 of 14 runs. No
    paper was searched for this decision.
  evidence:
  - path: odisha_script/odisha_phase2_2_run_pipeline.py
    what: PASSES, stage_names, prerequisites, missing_cache in the config's layout
  - path: src/fmu/pipeline.py
    what: feature_stage_names
  - path: odisha_script/run_config_passes.sh
