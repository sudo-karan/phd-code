- id: spec-clustering-one-mean-per-unit-label
  title: >-
    The clustering stage takes one mean per unit label over all of its pixels, not one per connected piece, and no
    longer calls reduceConnectedComponents
  decision: >-
    The clustering stage's _compute_superpixel_means (src/fmu/stages/clustering.py, a Locked module) takes one mean per
    unit label (a stand, or a superpixel when the merge is off) over every pixel the label has in the ROI, whether the
    unit is in one piece or in several: one grouped reduction of the decomposed stack by the label image
    (ee.Reducer.sum().unweighted().forEachBand(...).group(...), in the label image's grid at the analysis scale,
    maxPixels 1e9, no bestEffort), then each band painted back on the label image with remap, server-side, so that no
    mean is read back. A band's mean is over the unit's pixels where that band has data, and every pixel of the unit
    holds it: each band goes into the reduction unmasked, 0 where it has no data, beside a band of 1 where it has
    data, and the mean is the one sum over the other, since Earth Engine's grouped unweighted reducers add a band's
    masked pixels into the sum they give a group. Both bands that go in are unmasked everywhere
    (unmask(0, False)): unmask(0) alone leaves a band masked outside its footprint, and a unit that footprint cuts
    then took in those pixels (read on Earth Engine on synthetic images: 2,664 over 32 pixels where 1,320 over 16 is
    right). A unit with no data in a band is masked in that band and so has no
    k-means row (reduceConnectedComponents gave it 0 there, read on Earth Engine on synthetic images). The stage no
    longer calls reduceConnectedComponents, which averaged each 8-connected piece of a label on its own, and what
    existed only for its maxSize is removed: the measured neighbourhood (_component_neighbourhood_px,
    _neighbourhood_from_groups and their three constants), the stage's check of the labels against the cap
    (assert_components_fit, which stays in src/fmu/utils/components.py for the merge and metrics stages), and the five
    stage-metadata keys that described them (n_components, largest_component_px, max_component_px_cap,
    rcc_neighbourhood_px, widest_unit_extent_px). clustering_metadata is unchanged. Comments and docstrings that the
    change made untrue are corrected in src/fmu/config.py (max_component_pixels), src/fmu/utils/caching.py (why
    clustering's key still lists merge.max_area_ha, merge.min_area_ha and merge.pass2_soft_ceiling: taking them out
    would change every recorded key), src/fmu/stages/merge.py (which stage checks the output stands against the cap)
    and src/fmu/stages/export.py (_stand_row_types), all Locked; none of them changes a computation. Clustering's
    revision is raised to 3 (STEP_REVISION), which moves the clustering and k_elbow keys of every config and no other
    key.
  alternatives_considered:
  - >-
    Relabel each piece as a unit of its own before clustering, the review's other suggestion: not chosen. The brief
    asks for one mean per stand, and the merge, the export and the fit's rows all treat a label as one stand
  - >-
    Keep reduceConnectedComponents: not chosen, since it averages per connected piece by definition
  - >-
    ee.Reducer.mean().repeat(n), with each band's means taken out of the list by position: not chosen. A unit with
    no data in a band would leave a gap in that list, and how Earth Engine leaves it was not checked; forEachBand
    names each sum by its band, so the units without data in a band are filtered out by name
  - >-
    A grouped unweighted mean of the masked bands (ee.Reducer.mean().unweighted().forEachBand(...).group(...)), the
    change as first written in round 13: not chosen. Its live test, run read-only on 20 Oct 2026, failed: Earth
    Engine's grouped unweighted reducers add a band's masked pixels into the group's sum, though their count leaves
    them out, so a band with data on 16 of a unit's 32 pixels came out 83.25 where the mean of its data is 82.5 (its
    sum 2,664 against 1,320), and a unit with no data in a band got a mean of 0
  - >-
    A grouped weighted mean (no unweighted): masks each band rightly (82.5, and no mean for a unit with no data, read
    on Earth Engine), but at the ROI's edge it takes in every pixel the ROI touches, weighted by the share of it
    inside, where the merge's counts take the pixels whose centre is inside, each once (review B17): not chosen
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 4: "B14 (one mean per stand, not per piece)". The review
    (docs/reviews/2026-10-19-review.md, B14) found that reduceConnectedComponents aggregates per 8-connected piece, not
    per label, so a stand in several pieces had one mean per piece, its k-means row came from one random piece, and it
    could get two types, while the docstrings said every pixel holds the mean of its unit. The new test fails on the
    code before the change with "assert {1.0, 6.0} == {2.0}" (a stand in two pieces held two means) and passes after
    it; for each stand in one piece it gives the means reduceConnectedComponents gives on the same numpy stand-in
    stack. The reduction is unweighted, so that each pixel whose centre is in the ROI counts once, as in
    reduceConnectedComponents, not by the share of it the ROI covers, and it is taken in the label image's own grid,
    so that the pixels averaged are the unit's own (every cached image of a per-step run is on the analysis grid).
    tests/test_clustering_unit_means_live.py checks the calls on Earth Engine, read-only, on synthetic images. Run on
    20 Oct 2026 against the change as first written (a grouped unweighted mean of the masked bands) it failed, and the
    read-only checks recorded in docs/handoff/2026-10-20-round13.md found why: a grouped unweighted sum of a band with
    data on 16 of a unit's 32 pixels came out 2,664 where its 16 values sum to 1,320, while a weighted one, an
    ungrouped unweighted one and a grouped unweighted sum of an unmasked band came out right (an edge that cuts pixels
    gave the sum of the 12 pixels whose centre is inside, 138). With the bands summed unmasked beside their bands of
    data the live test passes: one mean over unit 1's two pieces (54.5); the mean of unit 3's pixels with data in band
    b (82.5) on all of its pixels; unit 4 masked in b; the means of reduceConnectedComponents for every unit in one
    piece where both give one; double precision. On the same images reduceConnectedComponents gave unit 4, which has
    no data in b, the value 0 in b on all of its pixels, unmasked: before round 13 such a unit had a k-means row with a
    0 it never measured, where now it has none, as the stage's warning about units without a row describes. Whether a
    unit of the runs of record had no data in a band was not checked; their manifests count 1 to 10 units per run
    dropped for a null band, so some came through masked. The offline stand-ins (tests/_ee_arrays.py) now refuse a
    band masked on part of a group in an unweighted grouped reduction, so the first version fails offline too. In the
    committed runs 0 to 5 stands per 3 ha _r9 run and 0 to 7 per 10 ha round 12 run are in several
    pieces, two at most each (n_stands_split_into_pieces in their export manifests): their means change, and through
    the fit the types of other stands may move; this needs Earth Engine and was not measured. A label that SNIC
    reuses in two places (review B3) is now one unit in the clustering, as it already was in the merge. At district
    scale (out of scope this round: B1 to B3) the grouped reduction holds one dictionary of means per unit and each
    remap a list as long as the units, which may meet Earth Engine's memory limits; not measured. No paper was
    searched for this decision.
  evidence:
  - path: src/fmu/stages/clustering.py
    what: _compute_superpixel_means; step 3 of ClusteringStage.run; the stage metadata
  - path: src/fmu/utils/caching.py
    what: STEP_REVISION, clustering at 3; the comment on clustering's settings
  - path: tests/test_clustering_one_mean_per_unit.py
    what: >-
      A stand in two pieces has one mean, and a stand in one piece the means reduceConnectedComponents gave, on numpy
      stand-ins (tests/_ee_arrays.py); fails on the code before the change
  - path: tests/test_clustering_unit_means_live.py
    what: >-
      The same on Earth Engine, on synthetic images, read-only (live tier); passes on the sums, failed on the grouped
      unweighted mean of the masked bands
  - path: tests/data/clustering_off_calls.json
    what: The recorded calls of the three configs, and their stage metadata without the five keys
  - path: docs/outputs.md
    what: Clustering stage metadata, the five keys recorded until round 13
  - path: docs/reviews/2026-10-19-review.md
    what: B14
  - path: docs/handoff/2026-10-20-round13.md
    what: Task 4, B14
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 13 brief)
- id: spec-clustering-exact-quartiles-for-the-robust-scaling
  title: >-
    The robust scaling's median and IQR are exact quartiles of the one-row-per-unit sample, for the constant-band test
    and the scaling alike
  decision: >-
    In the clustering stage (src/fmu/stages/clustering.py, a Locked module), _apply_scaling with method robust reads
    each band's column of the one-row-per-unit sample back (aggregate_array, one request per band) and takes its 25th,
    50th and 75th percentiles exactly (_exact_quartiles): linear interpolation between order statistics, numpy's
    default, that is v[j] + (h - j)(v[j+1] - v[j]) with h = q(n - 1) and j = floor(h), the n values sorted. The centre
    is that median and the spread that IQR, and the drop test (a spread of at most 1e-9 is a constant band) and the
    scaling, (x - centre) / spread, use the same two numbers. The method is unchanged: median and IQR, as DEC-003
    declares (dn-median-iqr-scaling-dec-003); until round 13 the centre and spread were those of Earth Engine's
    percentile reducer, which falls back to histogram buckets. The zscore method is unchanged. Clustering's revision is
    raised to 4 (STEP_REVISION in src/fmu/utils/caching.py), which moves the clustering and k_elbow keys of every
    config and no other key.
  alternatives_considered:
  - >-
    ee.Reducer.percentile with maxRaw above the row count, the review's other suggestion: not chosen. The quartiles
    would still be Earth Engine's, whose interpolation could not be stated or tested offline
  - >-
    Exact quartiles for the drop test only, histogram quartiles for the scaling: not chosen. A band kept by the exact
    test could then be divided by a histogram spread of 0
  - >-
    The quartiles computed on Earth Engine from the sorted column: not chosen, since the arithmetic could then be tested
    on Earth Engine only
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 4: "B16 (exact quartiles for the constant-band test)". The review
    (docs/reviews/2026-10-19-review.md, B16) found that the recorded centre and spread are histogram-bucket values,
    0.57 to 1.52 times the exact IQR in the _r9 runs, and that where p25 and p75 share a bucket the spread is exactly 0
    and a band with spread is dropped as constant, as distance_to_water was in round 7's two Koraput runs. The new test
    fails on the code before the change with "assert 'distance_to_water' not in ['distance_to_water']" (a band whose
    exact IQR is 0.1 and whose histogram quartiles coincide) and passes after it. Under review A2 wekaKMeans
    min-max-normalises every band over the fit rows, which cancels a per-band (x - centre) / spread with a positive
    spread, so the exact values change the fitted types only through the drop decision, up to floating-point rounding.
    In the runs of record the bands dropped as constant are exactly constant over the stands (distance_to_water at
    10,000 m in the Angul hand-crafted _r9 and round 12 runs, at the fill value 463,409.5 m in Sanjay Van's _r9 run),
    and no other raw band has an exact IQR of 0 over the typed stands of the committed _r9 and round 12 stands_merged
    layers, so this changes no drop decision of record that could be checked offline (the check is over stands rather
    than the stage's units, and leaves out the sin and cos pairs; the Koraput 3 ha _r9 and 10 km tile layers are off
    git and were not checked); the recorded centres and spreads do change. In round 7's Koraput run
    (docs/reproducibility/keptland_runs) distance_to_water spreads over about 510 m across the stands and would have
    been kept. The k elbow step (src/fmu/stages/k_elbow.py) reads the scaled rows into scikit-learn with no min-max, so
    its inertia, and possibly its elbow, move. Reading a column back costs one request per band of a few hundred to a
    few thousand numbers per run; at district scale (out of scope this round) a column is as long as the units. No
    paper was searched for this decision.
  evidence:
  - path: src/fmu/stages/clustering.py
    what: _apply_scaling and _exact_quartiles
  - path: src/fmu/utils/caching.py
    what: STEP_REVISION, clustering at 4
  - path: tests/test_clustering_exact_quartiles.py
    what: >-
      A band whose exact IQR is 0.1 and whose histogram quartiles coincide is kept, and scaled by that IQR; the
      quartiles' definition; fails on the code before the change
  - path: tests/data/clustering_off_calls.json
    what: The recorded calls of the three configs, a column read per band in place of a percentile reducer
  - path: docs/reviews/2026-10-19-review.md
    what: B16, and A2
  - path: docs/handoff/2026-10-20-round13.md
    what: Task 4, B16
  papers: []
