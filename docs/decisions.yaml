- id: field-rotation-null-only-null
  title: Chance level is measured by the rotation null, and it is the only null used
  decision: >-
    Decision (Jaskaran, 2026-09-14): the rotation null is the primary and only null. It rigidly rotates
    and shifts each village's plots against the real stand map, keeps the field values with the plots,
    and recomputes the statistic, 1,999 times in the reported runs. The noise-SNIC null is reported as
    a documented failure and is used for no percentile.
  alternatives_considered:
  - >-
    Noise-SNIC null (the planned primary): SNIC and the real merge run on random-noise bands; failed its
    size check
  - 'Smoothing the noise until superpixel sizes match: declined'
  - 'Naive within-band label permutation p: computed, then labelled INVALID'
  - 'Plot-level permutation or bootstrap: deliberately not reported (Phase 3)'
  rationale: >-
    Before any statistic existed, SNIC on independent noise fragmented: the median superpixel was 4 pixels
    and 51.5-53.1% were 4 pixels or fewer, against an observed median of 82-94 pixels. Smoothing the noise
    to restore the match would have added a free parameter to the primary null. The rotation null is size-matched
    by construction (the same polygons, moved) and keeps the label map's own spatial structure. Plot-level
    tests are not valid here because plots within a village are not independent.
  evidence:
  - path: odisha_script/PHASE2_PREDICTIONS.md
    what: '''Null models, fixed before the statistics'', lines 183-233'
  - path: odisha_script/PHASE2_STATUS.md
    what: line 100; lines 1216-1234
