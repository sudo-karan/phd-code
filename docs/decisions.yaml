- id: field-phase3-primary-analysis-and-checks
  title: >-
    Phase 3: one primary analysis, three declared checks, ten tests corrected together, villages as the
    unit
  decision: >-
    The primary analysis scores drawing and labelling with the adjusted Rand index against the five trees-only
    field types, at both stand sizes, and places each score among 1,999 rotation-null draws. Ten headline
    tests (five per stand size) are corrected together with Holm's method. Three checks were declared
    in advance: S1 without the no-tree type, S2 four field types, S3 the PR #40 field types.
  alternatives_considered:
  - 'Plot-level permutation or bootstrap tests: deliberately not reported'
  rationale: >-
    An adjusted Rand index of zero is not the chance level here, because plots in one village are alike
    and also sit in neighbouring stands, so chance is measured. Many tests are run, so one small p is
    expected by luck. The 20 village forests are the independent units, not the 267 plots. The checks
    exist because five field types is a judgement under a pre-set rule: S1 asks whether any agreement
    rests on trees against no trees, S2 is the stable neighbour of five, and S3 shows that nothing else
    moved.
  evidence:
  - path: odisha_script/PHASE3_PREDECLARED.md
    what: primary analysis lines 22-30; checks lines 32-49; expectation lines 51-57
  - path: odisha_script/PHASE3_STATUS.md
