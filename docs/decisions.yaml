- id: spec-merge-two-pass-hard-gate
  title: >-
    Merge in two passes: a strict all-criteria gate, then a relaxed pass that removes undersized stands
  decision: >-
    Pass 1 joins neighbouring patches only if every shared criterion is within its tolerance (a hard gate,
    not a weighted score) and repeats until nothing more joins. Pass 2 takes regions still below the minimum
    area, smallest first, and joins each to a neighbour using tolerances multiplied by relax_factor (1.75).
    If no neighbour passes even then, the region joins the neighbour with the longest shared boundary.
  alternatives_considered:
  - >-
    A weighted sum of differences instead of a hard gate (named and rejected in region_merge.py)
  - >-
    Counting diagonal contacts (8-connectivity) as shared boundary (named and rejected)
  rationale: >-
    The code says it follows Xiong et al. 2024 section 2.6. A hard gate keeps each threshold readable
    in physical units. The relaxed second tier means undersized fragments always find a home, and the
    shared-edge fallback is what prevents orphans. Shared edge is counted with 4-connectivity although
    SNIC uses 8, because a diagonal contact has zero shared boundary length. relax_factor 1.75 is set
    beside Xiong's ratios (SH2/SH1 = 5/3 = 1.67; TP2/TP1 = 0.5/0.2 = 2.5).
