    1 of a config that needs a pass 2, and a commit made during the only pass, end with exit 0 where 95 is expected,
    and the passes of a batch on an unchanged tree record no git_before. On an unchanged tree a batch runs as before
    (tests/test_run_passes_safely.py passes unchanged). No batch was run (no Earth Engine). No paper was searched for
    this decision.
