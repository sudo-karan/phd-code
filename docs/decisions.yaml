- id: dn-matched-stand-count-mechanism
  title: >-
    How to make held-out R-squared comparable when the arms have different stand counts
  decision: >-
    Recommended, not implemented: report R-squared as a curve against n_stands (option B), with per-arm
    tuning of segmentation.size (option A) as a fallback if a single number is needed. Never equalise
    the count by lowering min_defined_criteria, widening merge tolerances or moving the area bounds.
  alternatives_considered:
  - 'A: tune segmentation.size per arm until the stand counts match'
  - 'B: report R-squared as a curve against n_stands, not a scalar'
  - >-
    C: subsample stands to the smaller count before computing R-squared (recorded as wrong)
  rationale: >-
    R-squared rises with region count; with one region per pixel it is 1.0 for any image. So an arm with
    more stands scores higher for free. A is honest but expensive and confounded, because changing size
    changes what a stand is. B costs the same compute as A, yields more, and privileges no count, but
    is harder to state. C is cheap and wrong: dropping stands does not undo the finer partition. A second
    reader (entry spec-matched-stand-count) recorded: R² is 1 - SS_within/SS_total; with one region per
    pixel it is 1.0 for any image, so an arm that makes more stands scores higher for free. The arms segment
    different feature spaces and no longer share SNIC, so their counts are free to differ. The curve is
    the honest object, and the sweep it needs is the same sweep option A needs.
  evidence:
  - path: docs/design_notes.md
    what: >-
      Section 'segmentation: config-driven stack, independent per arm', lines 433-434: 'held-out predictive
      power at matched stand count'
  - path: docs/matched_stand_count.md
    what: >-
      The whole note: the gap, three mechanisms, the recommendation, what must not happen; second reader:
      the whole note: the gap, three mechanisms, the recommendation, what must not happen
  - path: src/fmu/stages/metrics.py
    what: >-
      _explained_variance puts n_stands in the same dict as every R-squared value; nothing equalises it.
  - path: src/fmu/config.py
    what: >-
      MetricsParams comment (lines 741-746): two arms at different stand counts cannot be compared on
      R-squared at all; second reader: lines 741-746: R² rises with stand count
  - path: src/fmu/utils/region_merge.py
    what: >-
      calibrate_thresholds() docstring, line 611: choose thresholds on held-out R² at matched stand count
  - path: scripts/gate_effect.py
    what: 'lines 35-40: why that experiment reports stand count, not R²'
