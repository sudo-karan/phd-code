- id: field-percentile-tolerance-not-built
  title: Merge tolerance as a percentile instead of metres
  decision: >-
    Recommended by Phase 1 for ETH height, put to the supervisor, and deliberately not built during Phases
    2 and 3. calibrate_thresholds() can report the percentile a tolerance reaches but cannot accept one.
  alternatives_considered:
  - >-
    Tolerance in absolute metres: the current code (see spec-merge-tolerances-physical-units)
  - Tolerance as a percentile of the observed neighbour-difference distribution
  rationale: >-
    For: Spearman beats Pearson on every product tested (ETH 0.484 against 0.455), so the products rank
    neighbours better than they calibrate, and ranking is what a neighbour gate needs; a percentile would
    mean the same thing in every area and on every product, and names a method rather than an Odisha value.
    Against (memo): it turns a calibrated claim into a ranking claim, and a percentile of local differences
    is not a statement a forest manager can act on. Not built because changing the merge rule mid-experiment
    would mean the supervisor's test ran against a method he did not ask for.
