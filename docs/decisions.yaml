- id: field-phase2-departures-after-first-run
  title: >-
    Changes made to the Phase 2 analysis after its first run, each recorded as a departure
  decision: >-
    After the first run and an adversarial review, the corrected run used 1,999 rotations instead of the
    pre-registered 999, gave no percentile to cells with 3 or fewer pairs on either side, and labelled
    the naive within-band permutation p INVALID. It also restricted the type-agreement test (6.3) to rotations
    that keep every typed plot on a typed polygon, and computed the arms prediction as a differenced null.
    None changes an observed value. Round 13 (20 Oct 2026, review A8) made one more change, which changes no
    observed value either: the rotation null of 6.1 and of its null structure is scored on the plots the observed
    statistic is computed on, the observed-assigned ones, as Phase 3 scores its null. Until then a realisation
    that put a plot the observed map leaves unassigned on a stand scored it there. On the full set this moves the
    null of v120 stands_snic only (265 of 267 plots assigned; n_species percentile 2.8 to 2.9) and no conclusion;
    the pilot assigns every plot and does not change. The statistics script writes _r13 files since, and the
    files from before the change keep their names.
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: >-
    PHASE2_STATUS.md: each was introduced in the corrected run, after the first run's statistics existed,
    and is listed for that reason. Reasons given for individual changes: the naive permutation p pools
    sites and its pairs are not independent; thin cells are uninformative. The reason for 1,999 rather
    than 999 is not recorded in the source. The round 13 change: an observed value and its null must be computed
