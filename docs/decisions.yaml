- id: dn-optical-harmonic-regression-derived-bands
  title: Per-pixel harmonic regression, reported as named derived bands
  decision: >-
    The regression is fitted per pixel with ee.Reducer.linearRegression. The stage pulls out each coefficient
    by name, derives amplitude and phase for each harmonic pair, squares the RMS residual into residual_variance
    (a diagnostic band, left out of clustering), and returns one multi-band image whose band names carry
    the index name (ndvi_mean or nirv_mean).
    Round 14 (26 Oct 2026): with features_optical.mean_over_window on (off by default), <index>_mean is the fitted curve's mean over the dates window instead of the intercept, computed analytically and the same whatever time_reference is (spec-optical-mean-over-the-window).
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: >-
    Band names encode the config so that downstream stages 'can read either via the optical_features context
    key without knowing which index was used'.
