- id: spec-analysis-grid-utm-from-roi
  title: 'All raster measurements use one grid: the UTM zone of the region of interest'
  decision: >-
    SNIC's outputs are pinned to a pixel grid in the UTM zone of the region of interest (ROI) midpoint,
    at the analysis scale. The grid is built from the ROI, not inherited from whichever input image comes
    first. Every later stage inherits it.
  alternatives_considered:
  - 'Inherit the grid from the first input band: named and rejected'
  rationale: >-
    grid.py: every area, perimeter and adjacency figure is a pixel count times an assumed pixel size,
    which is true only if pixels really are square at the analysis scale. Earth Engine gives an unbaked
    computed image a WGS84 1-degree default projection; at 10 m that grid has pixels 10 m tall and 8.8
    m wide at Sanjay Van, which overstates areas by about 14% and lands on the merge's hectare gates and
    the shape score. An inherited grid is not stable (it depends on whether an input is cached) and not
    shared between arms that segment different stacks.
