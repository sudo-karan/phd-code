- id: field-forest-types-from-structure
  title: Field forest types are built from structure, not species
  decision: >-
    Each plot's field type comes from k-means on four structural measurements: tree height, crown cover,
    trunk area and number of trees, scaled by median and interquartile range. This gives five types.
  alternatives_considered:
  - >-
    Species composition: average-linkage clustering on Bray-Curtis dissimilarity of relative species basal
    area, cut at 6 groups (the Phase 2 pre-registered typology): collapsed into one group
  - >-
    A rule set such as 'Sal-dominant if sal_ba_frac > 0.5': rejected in Phase 2 as invented rules; the
    two-class Sal rule was reported only as a secondary
  rationale: >-
    Grouping by species puts 259 of 274 plots in one group, which leaves nothing to test against: Sal
    averages only 12% of basal area and mango and jamun are nearly everywhere. Structure does vary (height
    0.16-45.52 m, crown cover 0-98%), and structure is what the pipeline measures, so a structural grouping
    is the like-for-like truth for stand labels. Scaling matches the pipeline's own so that neither side
    is treated more kindly.
  evidence:
  - path: odisha_script/odisha_phase3_0_field_structure_types.py
    what: docstring lines 1-12; robust_scale() lines 121-127
  - path: odisha_script/explain_field_types.py
