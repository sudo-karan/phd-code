- id: spec-harmonic-time-reference-configurable
  title: The harmonic regression's reference date is a config value with a fixed default
  decision: >-
    features_optical.time_reference is the date used as t = 0 in the harmonic regression. It is a config
    field with the default 2017-01-01. It is not derived from the phenology date window. Before v1.1.0
    it was a constant in the module.
    Round 14 (26 Oct 2026): with features_optical.mean_over_window on (off by default), <index>_mean is the fitted curve's mean over the dates window instead of the intercept, computed analytically and the same whatever time_reference is (spec-optical-mean-over-the-window).
  alternatives_considered:
  - 'A module-level constant (MODULES.md row 9: ''was a module-level constant'')'
  - 'Deriving it from dates.phenology.start (config.py: ''do NOT auto-derive this'')'
  rationale: >-
    config.py: the reference date changes the numerical value of phase_annual but not amplitude, trend
    or clustering outcomes. The default is the start of the full Sentinel-2 constellation (S2A and S2B),
    so phase values are comparable across configs by default. If two configs have different phenology
    windows, a shared anchor keeps their phase values comparable, which the metrics stage relies on. Why
    the value was made configurable in v1.1.0 is not recorded in the source; the docs point to a decision
    id written only as 'DEC-???'. Review C9 (19 Oct 2026; added here 20 Oct 2026, round 13) found
    the claim about clustering outcomes false. With include_trend on (every config) the stage stores the
    intercept a as <index>_mean, and a is the de-seasonalised trend line's value on time_reference, not the
    mean over the window: moving the reference by D years changes <index>_mean by trend x D, a different
    amount for each pixel, while amplitude and trend do not move and the phase moves by the same angle
    everywhere. <index>_mean is a clustering band, and each sin and cos of the phase is scaled by its own
    spread (reviews A2 and B13), so the reference date can change the stand types. In Kendujhar's 3 ha box
    layer of record 3 x ndvi_trend, about how far ndvi_mean sits from the window's mean of the fitted
    curve, runs from -0.054 to +0.083 (5th to 95th percentile) against an interquartile range of 0.142 for
    ndvi_mean. Every config and manifest of record uses 2017-01-01, so the committed results agree with each
    other. In round 13 the comments of config.py and features_optical.py, the docs and the comments of seven
    configs were corrected, with no setting and no computation changed; whether the band changes (its name,
    or t centred on the window) is a method decision, with A2, put to Jaskaran.
  evidence:
  - path: src/fmu/config.py
    what: FeaturesOpticalParams.time_reference and the comment above it (corrected in round 13, review C9)
  - path: MODULES.md
    what: row 9 and the v1.1.0 paragraph
  - path: docs/configs.md
    what: features_optical.time_reference (corrected in round 13, review C9)
  - path: src/fmu/stages/features_optical.py
    what: >-
      module docstring: 'configurable per DEC-???', and since round 13 what moving the reference changes
      (review C9)
  - path: docs/reviews/2026-10-19-review.md
    what: C9
  papers: []
  status: adopted
  design_notes_section: null
  source: src/fmu/config.py lines 117-130; MODULES.md row 9 and the v1.1.0 paragraph
