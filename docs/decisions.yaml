- id: dn-cache-path-carries-config-fingerprint
  title: Cache paths include a hash of the config contents
  decision: >-
    A cached asset lives at {asset_root}/{config_name}/{stage_name}/{key}__{fingerprint}. The fingerprint
    is one coarse hash over most of the config. What is left out is listed explicitly (name, description,
    metrics, and the output-plumbing half of export).
  alternatives_considered:
  - >-
    Name-only paths (the original design), accepting that an asset is overwritten when thresholds change
  - >-
    A per-stage dependency map (a narrow fingerprint), so that editing merge would not invalidate masking
  rationale: >-
    Name-only paths meant 'Editing a threshold and re-running the same config silently reused the old
    asset -- a correctness bug, not a performance one'. It matters more under the merge design because
    'the segmentation IS the primary output now, threshold tuning is the main activity', and the committed
    run shows two arms with different tessellations (1249 vs 1312 superpixels, 0.2% of centroids matching).
    The coarse hash was chosen over a narrow map because 'a *wrong* narrow map silently reintroduces the
    bug for one stage'; 'Over-invalidation costs compute; under-invalidation costs a result.'
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''Asset caching: cross-cutting, opt-in'', design point 2'
  - path: src/fmu/utils/caching.py
    what: >-
