- id: field-number-of-types-by-elbow
  title: The number of types is chosen by the elbow rule, each side from its own data
  decision: >-
    The number of field types is chosen from the field data alone and the number of stand types from the
    satellite features alone, by the elbow of the k-means fit curve over 2 to 12 groups (seed 42). It
    is never chosen by which value agrees best. Result: 5 field types, 5 stand types for the 3 ha stands,
    and the 10 ha stands keep 6.
  alternatives_considered:
  - 'Picking the number that gives the best agreement: named and ruled out'
  - >-
    Silhouette and Davies-Bouldin (prefer 2) and Calinski-Harabasz (prefers 4): reported, not used
  - >-
    6 stand types for the 3 ha stands, carried over from the 10 ha configs (PR #40): replaced by 5
  rationale: >-
    Choosing the number by agreement 'would manufacture the result'. The elbow rule is the one the supervisor
    named. For the 3 ha stands the elbow gives 5 in every district and pooled, so by the rule 6 was the
    wrong number. For the 10 ha stands, 6 was already in the Phase 2 configs; the elbow was run ten days
    later (6, 6, 6 and 5 by district, 5 pooled) and 6 was kept. Review A7 (19 Oct 2026; added here 20 Oct
    2026, round 13) found that both elbows come from the elbow script's own preprocessing. That
    preprocessing departs from the clustering stage's in five ways: it keeps annual_rainfall and
    ndvi_residual_variance; it logs only non-negative bands, by log1p; it keeps bands with no spread; it
    fits every polygon; and it takes sin and cos of mean angles. Neither elbow is in the geometry
    wekaKMeans fits in (A2). Recomputed in the stage's space, with both geometries side by side and
    neither named as the one of record, and rebuilt from the same stand files: the 3 ha elbows by
    district are 6, 6, 6 and 5 (5 pooled) with (x - median)/IQR, and 5, 6, 6 and 6 (5 pooled)
    min-max; the 10 ha ones are 5, 6, 7 and 5 and 6, 6, 5 and 5 (5 pooled in both). On the stage's
    own rows of the _repro stands, by district: at 3 ha, 5, 6, 6 and 5 as the stage scaled them,
    and 5, 6, 6 and 5 min-max; at 10 ha, 6, 5, 6 and 5, and 5, 6, 6 and 5. So "the elbow gives 5 in
    every district" at 3 ha holds only in the script's own space. The rebuild from the stand files
    is approximate: they hold mean angles (review C10), and on the _repro stands it gives the stage's
    own elbow in 9 of 16 cases. The order of the rows alone moves 4 of the 60 elbows given in both
    orders. k is unchanged, 5 and 6 as PHASE3_PREDECLARED.md declared them, and no score changes;
    which geometry is of record waits on A2.
  evidence:
  - path: odisha_script/PHASE3_STATUS.md
    what: lines 111-116, 171-190, 225-242 and 407-442; the note of 20 Oct 2026 at the end
  - path: odisha_script/PHASE3_PREDECLARED.md
    what: lines 18-26 and 34-39; the note of 20 Oct 2026 at the end
  - path: odisha_script/odisha_phase3_2_stand_k_elbow.py
    what: 'docstring lines 1-20: the integrity rule'
  - path: odisha_script/odisha_phase3_2_k_elbow_odisha_v120_3ha.txt
    what: elbow for the 3 ha stands, in the script's own space (dated note of 20 Oct 2026 at the end)
  - path: odisha_script/odisha_phase3_2_k_elbow_odisha_v120_handcrafted.txt
