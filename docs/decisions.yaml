- id: night-repro-copies-and-safe-passes
  title: A from-scratch re-run uses a _repro copy of the config and one pass at a time
  decision: >-
    A re-run is made under configs/<name>_repro.yaml: the original file with `name` changed to <name>_repro
    and a header note, nothing else. The copy has the same fingerprint in a fresh asset namespace, so
    every stage is recomputed. odisha_script/run_passes_safely.py runs run_config_passes.sh one pass at
    a time and, before every pass, waits until Earth Engine has no queued or running task of the configs
    it is about to run. It runs from a run tree whose tracked files are unmodified ('Use a clean clone
    pinned to one commit'), never re-runs a finished config and does not retry a config whose export stage
    failed.
  alternatives_considered:
  - >-
    Re-running the same config: reads the old assets back, so it is not a reproducibility test (commit
    df45350)
  - >-
    Starting run_config_passes.sh as it is: it sleeps 60 s between passes, so on a slow queue the next
    pass submits a second copy of each export (commit 06852f3)
