- id: dn-date-windows-one-shared-window
  title: >-
    Phenology, radar and the optical composite share one 2017-2022 window; climate uses a 30-year normal
  decision: >-
    Phenology (Sentinel-2), radar (Sentinel-1) and the optical composite all use one shared 6-year window,
    2017-01-01 to 2022-12-31. Climate is the only exception: a 30-year normal, 1991-2020. Radar is summarised
    with percentile statistics over the window, not fitted to a seasonal cycle. The optical composite
    is one cloud-free median over the window, for SNIC to draw boundaries on.
  alternatives_considered:
  - Separate per-sensor windows (the note says sharing drops that bookkeeping)
  rationale: >-
    The note says sharing one window keeps the sensors temporally comparable and drops the bookkeeping
    of separate per-sensor windows. Six years because harmonic regression needs many cycles for stable
    amplitude and phase, and six years lets year-to-year anomalies average out.
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''Date windows: one shared time-series window'', lines 96-111'
  - path: configs/sanjay_van_baseline.yaml
    what: >-
      dates block: phenology, radar, optical_composite all 2017-01-01 to 2022-12-31; climate 1991-01-01
      to 2020-12-31; comment gives the reason for the long climate baseline
  - path: src/fmu/config.py
    what: >-
      DatesConfig (lines 41-51): three separate DateRange fields plus climate, whose default is 1991-2020
  - path: src/fmu/stages/features_radar.py
    what: Radar percentiles + IQR over the window, no harmonics (per MODULES.md row 10)
  - path: src/fmu/stages/data_load.py
    what: >-
      Builds the static S2 composite (s2_composite_reducer: median in the baseline config)
  - path: src/fmu/stages/features_optical.py
    what: Harmonic regression on the phenology window
  papers: []
  status: adopted
  design_notes_section: 'Date windows: one shared time-series window'
  source: docs/design_notes.md lines 96-111
