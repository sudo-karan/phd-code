    what: >-
      test_embedding_arm_runs_hand_crafted_stages_only_for_the_merge_gate; second reader: test_embedding_arm_runs_hand_crafted_stages_only_for_the_merge_gate
  - path: docs/features_snic_vs_kmeans.md
    what: Section 6.
  - path: configs/sanjay_van_alphaearth.yaml
    what: 'header comments: the shared merge rule is deliberate'
  - path: configs/odisha_alphaearth.yaml
