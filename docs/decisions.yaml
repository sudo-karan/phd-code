- id: dn-snic-distance-scale-normalisation
  title: >-
    Second normalisation: divide the SNIC stack by the RMS distance between adjacent pixels
  decision: >-
    After z-scoring, divide the whole stack by the empirical RMS feature distance between 4-adjacent pixels
    over the ROI (segmentation.normalize_distance_scale). Record the value used in the manifest as distance_scale.
  alternatives_considered:
  - z-scoring only (no second step)
  - divide by sqrt(n_bands)
  rationale: >-
    Z-scoring equalises bands against each other but not stacks against each other. SNIC trades summed
    squared colour distance against a spatial-compactness term, and that sum grows with the number of
    effective axes, so compactness 0.5 buys a far weaker spatial term at 64 bands than at 6. Dividing
    by sqrt(n_bands) assumes independent bands; for an embedding they are not, and it over-corrects. The
    empirical RMS distance handles band count and correlation together. The value goes into the manifest
    because it changes the segmentation and should be auditable.
  evidence:
  - path: docs/design_notes.md
    what: Lines 454-468.
  - path: src/fmu/stages/segmentation.py
    what: >-
      _rms_adjacent_distance; the division in run(); 'distance_scale' in the stage metadata; falls back
      to 1.0 with a warning if the stack is constant.
  - path: src/fmu/config.py
    what: SegmentationParams.normalize_distance_scale defaults to True (lines 309-316).
  - path: tests/test_segmentation_inputs.py
    what: test_normalize_distance_scale_defaults_on.
  - path: tests/test_embedding_arm.py
    what: test_both_arms_normalize_the_snic_distance_scale.
  - path: docs/features_snic_vs_kmeans.md
    what: Section 2, normalisation step 2.
