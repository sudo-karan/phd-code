  rationale: >-
    Jaskaran's answer (b) to question 4 of docs/handoff/2026-10-15-round6.md, 15 Oct 2026: "Q4 (b): DESCENDING
    orbit for the four Odisha districts." The radar stage takes percentiles over the window's images and counts on
