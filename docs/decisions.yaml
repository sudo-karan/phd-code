- id: spec-export-stand-whose-pieces-differ-takes-its-commonest-type
  title: >-
    A stand whose pieces carry different types takes, on every piece, the commonest type over its typed pixels
  decision: >-
    In stands_merged, a stand in several pieces whose pieces carry different types takes on every piece the commonest
    type over the stand's own typed pixels (src/fmu/stages/export.py, _stand_row_types), as round 12 coded it. Nothing
    changes. In the eleven _r9 runs this is one stand, in the 10 km tile (344 pixels of type 4 and one pixel of type
    3, the one-pixel piece taking type 4).
  alternatives_considered:
  - >-
    Each piece keeps the type of its own pixels (option (b) of question 3 of docs/handoff/2026-10-19-round12.md): not
    chosen
  - >-
    Draw the stand's row again with the fit's seed and take the type at that pixel (option (c)): not chosen
  rationale: >-
    Jaskaran's answer (a) to question 3 of docs/handoff/2026-10-19-round12.md, 19 Oct 2026 (the round 13 brief):
    "Jaskaran's answers: 1 (b), 2 (b), 3 (a), 5 (a)." One type per stand, as for every other stand; it is the row's
    type whenever the row fell on a piece of that type; deterministic and cheap. The case arises because the
    clustering stage averages each connected piece of a stand apart (review B14), which round 13's Task 4 is to change
    to one mean per stand; after that change every piece of a stand carries one type, and this rule picks it. No
    paper was searched for this decision.
