- id: spec-snic-reduced-stack-kmeans-full-stack
  title: >-
    SNIC sees a small band set; k-means sees the full stack minus three diagnostic bands
  decision: >-
    In the hand-crafted arm SNIC draws boundaries on five bands, while k-means labels stands on the full
    feature stack (22 bands in the baseline after sin/cos expansion). Three bands are computed but never
    clustered: observation count, harmonic residual variance and annual rainfall.
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: >-
    docs/features_snic_vs_kmeans.md: SNIC and k-means do different jobs. SNIC gets a reduced, high signal-to-noise
    set for three reasons: redundancy (correlated bands let the sensor with the most columns dominate
    the distance), noise (phase, trend, residual-variance and spread bands would make SNIC carve superpixels
    around fitting artefacts) and dimensionality (more bands swamp SNIC's spatial term unless the distance
    scale is normalised). The full stack belongs where a type label is attached. Of the excluded bands:
    observation count is metadata; residual variance is a fit-quality check, and clustering on it would
    split identical phenology by noise; annual rainfall is near-constant inside a small area.
  evidence:
