- id: dn-merge-criteria-identical-across-arms
  title: Merge criteria are the same in both arms
  decision: >-
    Hold the merge criteria identical across arms. An embedding run still computes canopy_height and ndvi_amplitude_annual
    and merges on them, with the same tolerances.
  alternatives_considered:
  - >-
    merge the embedding arm on embedding dimensions (named in src/fmu/config.py lines 497-500 and the
    merge.py docstring)
  rationale: >-
    The code says what makes two adjacent patches one stand is a fact about forestry, not about the sensor
    pipeline. Holding the merge rule constant leaves delineation as the only thing differing between arms,
    which is the thesis question. If each arm merged on its own features, differences in stand geometry
    would confound different boundaries with different merge rules, and the thresholds would lose their
    physical units. A second reader (entry spec-merge-rule-same-in-both-arms) recorded: merge.py and config.py:
    what makes two adjacent patches one stand is a fact about forestry, not about the sensor pipeline.
    Holding the rule fixed leaves delineation (where the boundaries fall) as the only thing that differs
    between arms, which is the thesis question. If each arm merged on its own features, a difference in
    stand geometry could come from different boundaries or from different merge rules, and the thresholds
    would lose their physical units.
