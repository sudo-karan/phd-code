- id: spec-batch-wrapper-resumes-a-label-and-holds-one-lock-per-machine
  title: >-
    The batch wrapper resumes a label without re-running what it finished, holds one lock per machine that its
    children hold too, passes signals on to them, knows a config by its name and puts a deadline on its queue poll
  decision: >-
    odisha_script/run_passes_safely.py, the one way to start an Earth Engine batch run (CLAUDE.md;
    night-repro-copies-and-safe-passes), gets four guards against a second copy of a task, and one against a hang
    (review B4 to B9). (1) A batch started again under the same label reads <label>.state.json first and skips, with
    a log line, every config an earlier batch of the label finished or put under needs attention; the state file
    keeps every key it had, and adds the earlier batches' records (earlier_batches) and the configs skipped
    (skipped); the exit lines of a pass cut short are read all the same. (2) One lock per machine,
    ~/.fmu/run_passes_safely.lock: an fcntl.flock taken before git, `import ee` and ee.Initialize, and held to the
    end; a start is refused (exit 90) while another batch holds it, whatever its run tree or log folder. (3) The
    shell script and the runner run in a process group of their own and are given the lock's descriptor:
    SIGTERM, SIGHUP and SIGINT are passed on to them, and the wrapper waits for them to end, records the pass and
    stops (exit 128 plus the signal's number); a signal ignored when the batch started stays ignored; if the
    wrapper is killed outright they keep the lock until they end. (4) Each config is read with the run tree's
    fmu.config and known by its name:, after which the pipeline names its tasks; a config whose name: differs from
    its file stem, a path that does not end in .yaml, or a name listed twice is refused (exit 93). (5) Each
    request of the wrapper's queue polls has a deadline of 120 s (ee.data.setDeadline, set right after
    ee.Initialize), as the runner's polls have; the client retries a request that times out up to 5 times, with
    backoff, so a poll on a dead network ends after about 13 minutes, and the wrapper then retries the poll. Within a batch, as night-repro-copies-and-safe-passes
    records, a finished config is never re-run and a config whose export stage failed is not retried; that entry is
    not changed. A batch under another label still does not know what an earlier one finished. Corrected in round
    13 after a check of the fix (a review of the round's own changes): a config whose export stage started and has
    no exit line, because a signal or an error cut the pass short while it ran, is put under needs attention, as one
    whose export stage failed is, since its Drive exports may have been sent; the state file is written beside
    itself, flushed and moved over the old one (os.replace), so a save cut short leaves the earlier record whole;
    and the signal handler only records the signal and passes it on (it set a threading.Event, whose lock it waited
    for forever if the signal came while the main thread held it), the waits between polls sleeping in steps of at
    most a second.
  alternatives_considered:
  - >-
    A lock file holding a pid, checked for a live pid and kept in the log folder (the wrapper before round 13): two
    starts seconds apart both passed the check, a batch with another log folder did not see it, and the children of
    a killed wrapper ran on while the lock read as stale (review B5 to B7)
  - >-
    Refuse a batch whose label's state file lists a finished config, rather than skip the config: not chosen; the
    brief asks for a resume, and with it the same command finishes a batch that was cut short
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 3: "B4 to B9, as the review suggests: resume from the state file
    and skip finished configs; a held lock at one fixed path, taken first; signals forwarded to the children; configs
    keyed by name:, refusing a name that differs from the file stem, a non-.yaml file or a repeat; a request deadline
    on the queue poll. Test each with a fake Earth Engine, as the review did." The review
    (docs/reviews/2026-10-19-review.md, B4 to B9) found these ways for the wrapper to submit a second copy of a task,
    and for its poll to hang, in a harness that ran the real wrapper and shell script against a modelled Earth
    Engine. tests/test_run_passes_safely.py is such a harness (tests/_wrapper_harness.py), and each of its tests of a
    finding fails on the wrapper before that finding's fix: the state file of a batch cut short read "done": [], and
    the same command again sent every Drive export twice (B4); two starts 0.3 s apart, or with two log folders, both
    ran (B6, B7); after SIGTERM, SIGHUP or SIGINT the runner was still running, and a new start was not refused (B5);
    a .yml path, a name: unlike the file stem or a config listed twice ran (B8); no deadline was set before the first
    poll (B9). All 74 configs under configs/ have a name: equal to their file stem, so none is refused. The check's
    three tests fail on the wrapper as first fixed: after a signal during the export stage the config read as not
    finished and the same command sent its nine Drive exports again; a save that stopped halfway left the state file
    unreadable; a signal during a wait whose lock was held hung the wrapper. No paper was searched for this
    decision.
  evidence:
  - path: odisha_script/run_passes_safely.py
    what: The wrapper; its docstring lists the guards and the exit codes
  - path: tests/test_run_passes_safely.py
    what: The real wrapper and shell script against a modelled Earth Engine, a test or more per finding
  - path: tests/_wrapper_harness.py
    what: The run tree, the stand-in ee package and the stand-in runner
  - path: docs/running.md
    what: The wrapper's paragraph
  - path: docs/reviews/2026-10-19-review.md
    what: B4 to B9
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 13 brief)
- id: spec-clustering-phase-pair-not-logged
  title: >-
    The sin and cos of a harmonic phase band are kept out of the clustering stage's skew test and log transform
  decision: >-
    In the clustering stage (src/fmu/stages/clustering.py, a Locked module) the sin and cos bands that
    _decompose_cyclic_bands makes of a harmonic phase band (a band with "_phase_" in its name, such as
    ndvi_phase_annual) are never candidates for the skew test (_identify_skewed_bands), and so are never logged
    (_apply_log_transform); they go to the scaling as the decomposition gives them (_phase_components). Every other
    band is tested exactly as before: the same |skew| > skewness_threshold rule (review A3, unchanged) and the same
    offset (review B12, unchanged). Aspect's sin and cos are tested as before. The scaling of the pair, each component
    by its own median and IQR, is unchanged (review A2). Clustering's revision is raised to 2 (STEP_REVISION in
    src/fmu/utils/caching.py), which moves the clustering and k_elbow keys of every config and no other key.
    Round 14 (26 Oct 2026): with clustering.log_rule right_skew, a setting off by default that needs clustering.fit_outside_earth_engine, the rule of spec-clustering-log-rule-right-skewed-bands applies instead (only right-skewed bands logged, as log1p((x - min) / IQR); no angle component tested; each angle pair scaled with one shared spread). The default is unchanged.
  alternatives_considered:
  - >-
    Keep aspect's sin and cos out of the skew test and the log too: not chosen, since the brief names the phase only.
    Put to Jaskaran under Questions; no committed run logged an aspect component
  - >-
    Scale each pair with one shared spread, or not at all, as the review also suggests: not chosen; that is the
    scaling, a method decision left out of this round (review A2)
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 4: "B13 (the phase's sin and cos kept out of the skew test and
    the log)". The review (docs/reviews/2026-10-19-review.md, B13) found that the decomposition runs before the skew
    test, so ndvi_phase_annual_cos is logged in every hand-crafted _r9 run and Angul also logs _sin, and that a log
    taken of one coordinate of the circle makes the distance between two stands depend on where on the circle their
    phases sit, which moves with the harmonic's reference date. The committed run records agree: every hand-crafted
    run in docs/reproducibility (keptland_runs, r9_runs, round12_runs, round9_cache_test) logged
    ndvi_phase_annual_cos, and the Angul runs ndvi_phase_annual_sin too; none logged an aspect component. The new test
    fails on the code before the change with "assert 'ndvi_phase_annual_sin' not in ['vh_iqr', 'canopy_height_max',
    'slope', 'ndvi_phase_annual_sin', 'ndvi_phase_annual_cos', 'aspect_cos']" and passes after it. The review's
    suggested test, that moving time_reference leaves the pairwise distances unchanged, is not added: it cannot pass
    while each component is scaled by its own spread (A2) and while ndvi_mean is the trend line's value on the
    reference date (review C9). The clustering therefore still depends on the reference date through those two
    routes. The records that said it does not (spec-harmonic-time-reference-configurable, src/fmu/config.py,
    src/fmu/stages/features_optical.py, and the docs and config comments that repeated them) were corrected in
    round 13, in their text only (review C9); the two routes stay until A2 and C9 are settled. No paper was
    searched for this decision.
  evidence:
  - path: src/fmu/stages/clustering.py
    what: _phase_components; step 5 of ClusteringStage.run
  - path: src/fmu/utils/caching.py
    what: STEP_REVISION, clustering at 2
  - path: tests/test_phase_pair_not_logged.py
    what: >-
