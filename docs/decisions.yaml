    3 fixed one primary analysis and three sensitivity checks before any score was recomputed. This is
    now a standing rule, with PHASE3_PREDECLARED.md as the pattern.
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: >-
    PHASE2_PREDICTIONS.md: 'A null result that was predicted is a finding. A null result that was not
    is a failed experiment.' The git history of the predictions file against the statistics script and
