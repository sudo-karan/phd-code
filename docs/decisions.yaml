- id: dn-cyclic-sin-cos
  title: Replace cyclic bands (phase, aspect) with sin and cos pairs
  decision: >-
    Before clustering, replace each phase band and the aspect band with a sin/cos pair.
  alternatives_considered:
  - no decomposition (the raw angle as a linear feature)
  rationale: >-
    A phase of 0 and 2*pi are the same angle but maximally distant in linear feature space, and k-means
    uses Euclidean distance. Without decomposition, two stands peaking on 1 January and 31 December would
    look maximally different although phenologically identical. sin/cos pairs are continuous across the
    discontinuity.
