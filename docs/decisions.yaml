- id: field-structural-criterion-unresolved
  title: What the merge's structural (height) criterion should be
  decision: >-
    Not resolved. Phase 1 concludes that no free product measures stand height well enough here to gate
    on in absolute units. Its stated position is to keep ETH as a relative ordering only and to say in
    the methods that the structural axis is unvalidated in this forest type; the memo puts three options
    to the supervisor.
  alternatives_considered:
  - >-
    Adopt Sentinel-1 vh_iqr (radar texture) as the structural axis, with its caveats stated
  - >-
    Keep ETH as a relative ordering only and declare the structural axis unvalidated in this forest type
  - Drop the structural axis and delineate on composition and optical bands alone
  - 'Meta/WRI 1 m height: disqualified'
  - 'GEDI rh98: R² 0.088 at true coverage of 89 of 274 plots; out'
  - 'GLAD height: R² 0.041, and the sign flips when Meta-zero plots are excluded; out'
  rationale: >-
    ETH fails on dynamic range (R² 0.207, slope 0.30, a span of 8 m where the field spans 35). Meta fails
    on validity. GEDI at honest coverage shows the same compression as ETH. vh_iqr is the best-validated
    free signal at plot scale (R² 0.227), but it is a radar texture proxy and not a height, no surveyed
    paper uses radar for delineation, and it gets worse when aggregated, the opposite of what a stand-scale
    criterion needs. Round 9's Task E (17 Oct 2026; added here 19 Oct 2026, round 11) found the radar result
    resting on one district: Test 5's vh_iqr R² of 0.210 against Lorey's height, on the ascending orbit over 274
    plots, rested on the 146 Koraput plots whose ascending spread is exactly zero (one image each); without them
    it is 0.028 (128 plots), and on the descending orbit, where no plot has zero spread, 0.018 (274 plots, r
    -0.133). The 0.227 above, on the 152 plots without Meta's zeros, still counts 67 of those Koraput plots and
    was not recomputed without them.
