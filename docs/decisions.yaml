  - path: docs/demo/remerge/README.md
    what: Section 4, the note of round 13 on what a re-export of the legacy-layout runs would give
  - path: docs/reproducibility/r9_runs/stand_types_from_fit_rows.json
    what: Round 12's count on the analysis grid, the stands left out of the fit counted apart
  - path: docs/handoff/2026-10-19-round12.md
