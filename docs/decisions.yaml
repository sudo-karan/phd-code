- id: spec-merge-tolerances-physical-units
  title: Merge tolerances are in physical units and are never tuned to a pass rate
  decision: >-
    Each tolerance is written in the band's own units (metres for canopy height). Percentiles of the neighbour-difference
    distribution are reported only as a calibration aid, by calibrate_thresholds(). A low share of pairs
    passing is not a reason to loosen a threshold.
  alternatives_considered:
  - >-
    Tolerance as a percentile of neighbour differences, for example 'merge below the 60th percentile':
    named and rejected in config.py; later recommended by Phase 1 and not built (see field-percentile-tolerance-not-built)
  - 'Tuning thresholds to hit a target admit rate: named and rejected'
  rationale: >-
    config.py: a percentile rule merges the same fraction of pairs whether the forest is uniform or very
    mixed, and a forester wants 'stands differ by less than 2 m in mean canopy height', not a quantile;
    Xiong reports SH1 = 3 m for the same reason. 'pass rate is a diagnostic, not an objective', and tuning
    to it is called the unprincipled-parameter trap the design exists to escape. Thresholds are to be
    chosen on held-out R² at matched stand count. The gate needs all criteria at once, so per-band shares
    do not describe it: three criteria at about 54%, 76% and 79% admitted 38.7% of pairs jointly.
