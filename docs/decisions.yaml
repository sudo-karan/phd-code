- id: spec-merge-runs-client-side-uncached
  title: >-
    The merge runs on the client as plain Python, is not cached, and orders ties by centroid
  decision: >-
    The stage downloads the superpixel adjacency graph (a few thousand rows), merges it in pure Python
    with union-find, and sends the result back as a relabel of the SNIC image (remap). The stand image
    is not cached as an asset. Ties are broken by stand centroid, not by SNIC label.
  alternatives_considered:
  - 'Caching stand_clusters like other stage outputs: named and rejected'
  - 'Ordering by SNIC label: named and rejected'
  rationale: >-
    merge.py: Earth Engine has no native region-adjacency-graph merge; a client-side merge is readable
    and can be unit-tested without a server, and remap needs no export or asset ingestion. The output
    is a cheap remap of a cached image, and the thresholds are the thing being iterated on, so a stale
    cached copy would silently poison exactly that. SNIC labels are not a stable thing to sort by because
