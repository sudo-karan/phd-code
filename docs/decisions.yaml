- id: spec-merge-default-criteria
  title: 'Default merge criteria: canopy height (2.00 m) and annual NDVI amplitude (0.030)'
  decision: >-
    By default two neighbouring patches may merge only if their mean ETH canopy height differs by at most
    2.00 m and their mean annual NDVI amplitude (seasonal swing) by at most 0.030. Xiong's merging rule (Eq. 1)
    has five conditions: the pair's area under the maximum, the same dominant species, canopy closure within
    0.2, dominant-species proportion within TP1 and mean height within SH1; the eliminating rule (Eq. 2) drops
    closure and relaxes TP and SH. The two criteria stand in for mean height and dominant-species proportion,
    and max_area_ha for the area bound. The pipeline has no analogue of closure or of the same species.
  alternatives_considered:
  - >-
    canopy_height_std as a third criterion for canopy closure: was a default, removed after the Odisha
    field check (see field-canopy-height-std-removed)
  - 'elevation: left out on purpose although it is the rank-3 separator (0.52)'
  - >-
    vv_minus_vh_median (radar): supported as an optional fourth criterion, off by default
  rationale: >-
    config.py: these are the closest analogues the pipeline has without airborne laser scanning or a species
    map. Canopy height at 2.00 m is meant to be the binding criterion because it is the rank-1 separator
    (0.56) and the field's most-used variable. Elevation is excluded because Sanjay Van has about 20 m
    of relief and a within-cluster elevation spread of 10-12 m, so two structurally identical patches
    would refuse to merge over 10 m of altitude; terrain is a site variable, not a forest-condition variable.
    Radar is off because no paper in the 20-paper survey uses radar for stand delineation, so it would
    be a novelty claim; the comment says to add it and report the ablation. The decision text was restated on
    19 Oct 2026 (round 12) to give Xiong's merging rule (Eq. 1) exactly, in place of "two of Xiong's three
    axes"; the defaults did not change (spec-merge-comment-states-xiong-eq1-exactly).
