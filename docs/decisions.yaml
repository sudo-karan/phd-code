- id: spec-export-stand-type-from-its-fit-row
  title: >-
    In the exported stand layer a stand with a row in the k-means fit takes that row's type, not a vote of its
    polygon's pixels
  decision: >-
    The export stage (src/fmu/stages/export.py, a Locked module) gives each stand of stands_merged whose row the
    k-means fit was trained on the type the fit gives that row, read as the type most of the stand's own typed pixels
    carry: the type image (cluster_labels) grouped by the stand label image, with the commonest type per stand
    (_stand_row_types). Every piece of a stand in several pieces takes that one type (which type for a stand whose
    pieces carry different types is question 3 of docs/handoff/2026-10-19-round12.md). Every other stand keeps the
    type it had: the commonest type among the typed pixels its polygon touches, each weighted by its share inside the
    polygon. They are the stands with no row at all (no pixel in the habitat mask, or a feature band with no data
    over the stand) and, with clustering.fit_excludes_stands_below_min_area on, the stands left out of the fit;
    whether either should change is questions 1 and 2 of docs/handoff/2026-10-19-round12.md. stands_snic and
    stands_dissolved are typed as before. (Superseded in part in round 13: a stand with no row gets a null type in
    every cache layout, and a stand left out of the fit takes its own row's type, with no vote;
    spec-export-stand-type-from-its-own-row-or-null.)
  alternatives_considered:
  - >-
    Keep the vote for every stand (the export before round 12): not chosen, as the brief asks
  - >-
    Draw each stand's row again (the same stratified sample, with the fit's seed, as the k elbow step does) and read
    the type at that pixel: not chosen for now. The clustering stage does not record which pixel it drew, so a repeat
    of the draw could not be checked; for a stand in one piece both give the same type. Open with the stands whose
    pieces carry different types (question 3 of docs/handoff/2026-10-19-round12.md)
  - >-
    Make a stand with no row null in every layout, and let the stands left out of the fit take their rows' types:
    open, questions 1 and 2 of docs/handoff/2026-10-19-round12.md
  rationale: >-
    The round 12 brief, Task 2 (roadmap 3.2, issue #44 item 12; Jaskaran, 19 Oct 2026): "The export types a stand from
    the typed pixels its polygon touches, so some stands take a neighbour's type (3 to 33 per run). Change it so that a
    stand with a row in the fit takes that row's type." The clustering stage averages the features over each connected
    piece of a stand, trains k-means on one row per stand drawn at one of its typed pixels, and types every pixel, so a
    stand in one piece carries its row's type at each of its typed pixels and the grouped commonest type is exactly the
    row's type, on the analysis grid; a stand in several pieces can carry different types on different pieces, and for
    it the commonest type over its typed pixels is the row's type unless the row was drawn on a piece of another type.
    On the legacy cache layout a stand's pixels on the type grid are those whose centres it holds there, so a stand
    with a row may hold none (one stand in the demo set's re-merge, which keeps the vote) and a stand with no row may
    hold some. The vote went wrong where
    the polygons and the type image lay on different grids (the legacy cache layout): a polygon took in slivers of its
    neighbours' pixels. The "3 to 33 per run" are stands with no row at all, which took a neighbour's type that way
    in the demo set's re-merge of the 13 Oct runs (docs/demo/remerge/README.md, section 4; 3 to 32 under the old merge
    rule); the change as worded leaves them as they are. In the _r9 runs the stands with no row are fragments of one
    superpixel with no pixel, or one or two, inside the ROI, and have no polygon. Among
    stands with a row, the demo set's re-merge found the vote and the row's type differing in 0 to 4 stands per run.
    On the analysis grid (every run since round 9) a polygon covers whole pixels of its own stand only: in the eleven
    _r9 runs every vertex of the stand, superpixel and type layers lies on the 10 m grid, and the change alters no
    stand of the ten box and Sanjay Van runs and one piece of one stand in the 10 km tile (a one-pixel piece of type 3
    in a stand whose other 344 pixels are type 4), counted offline (scripts/stand_types_from_fit_rows.py). The five
    _r9 runs were not exported again, as the brief says. On Earth Engine, a grouped reduction gives a stand whose
    pixels are all untyped a group without a "mode" (seen live on 19 Oct 2026); it is dropped. The lookup inside
    ee.Algorithms.If has a default, since Earth Engine may compute both of its cases. No paper was searched for this
    decision.
  evidence:
  - path: src/fmu/stages/export.py
    what: _build_merged_feature_collection, step 3; _stand_row_types, _fit_row_types, _take_the_fit_rows_types
  - path: tests/test_export_stand_type_from_fit_row.py
    what: >-
      The rule on a fake raster; test_a_stand_with_a_row_in_the_fit_takes_its_rows_type_not_the_vote fails on the
      export before round 12
  - path: tests/test_export_stand_type_from_fit_row_live.py
    what: The Earth Engine calls on synthetic images (live tier)
  - path: tests/test_export_merged_layer.py
    what: The builder's calls, with the request for the fit's row types
  - path: scripts/stand_types_from_fit_rows.py
    what: The offline count per run
  - path: docs/reproducibility/r9_runs/stand_types_from_fit_rows.json
    what: The count for the eleven _r9 runs
  - path: docs/demo/remerge/README.md
    what: Section 4, the stands with no row that took a neighbour's type on the legacy layout
  - path: docs/handoff/2026-10-19-round12.md
    what: Task 2, what a stand with no row gets, written before the change, and the record
  papers: []
  status: superseded
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 12 brief)
- id: spec-per-step-keys-leave-out-a-new-field-at-its-default
  title: >-
    A field added to a block a per-step key hashes is left out of the key while it holds its default, and the step
    keys the runs recorded are pinned
  decision: >-
    fmu.utils.caching (a Locked module) gets _STEP_OMITTED_AT_DEFAULT, the per-step layout's counterpart of
    _OMITTED_AT_DEFAULT: a field listed there, keyed (block, field) with its default, is left out of every step key
    that hashes it while it holds that default, and hashed otherwise. The block may be a sub-block (dates.phenology),
    and a field that a step's STEP_SETTINGS names on its own (merge.x) is left out the same way. The table is empty,
    so no key moves. A field added later to a block that both layouts hash goes in both tables.
    tests/test_step_keys_of_record.py pins the step keys of every per-step run of record, the 21 _run.json records (11
    in docs/reproducibility/r9_runs, 8 in round12_runs, 2 in round9_cache_test) and each stage's key in their 87
    manifests, and checks block by block that a listed field at its default moves no key and, switched on, moves the
    steps that hash it and those downstream.
  alternatives_considered:
  - >-
    Leave the per-step keys hashing every field as dumped and rely on the legacy table: not chosen. That table protects
    the legacy fingerprint only; in the per-step layout, which every config run since round 9 uses, a field listed in
    it still moved six step keys of every kept-land config (review B11)
  - >-
    Raise STEP_KEY_VERSION whenever a field is added: not chosen, since it would move every key of every config at once
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 3: "B11: an omit-at-default table for the per-step keys (empty
    today, so no key moves), and a test that pins the step keys recorded in docs/reproducibility/r9_runs/*_run.json."
    The review (docs/reviews/2026-10-19-review.md, B11) added a field at its default to the masking block and listed it
    in _OMITTED_AT_DEFAULT: every legacy fingerprint kept its value, but the masking, features_static, segmentation,
    merge, clustering and k_elbow keys of every kept-land record moved, and no test noticed. The new test shows the
    same on the code before the change (36 of its 148 cases fail there; for the Angul hand-crafted _r9 config, those
    six keys move) and passes after it. The test of the keys of record also pins the graph of steps (step_upstream),
    which no test pinned (review C52); round 12's records and the cache test's are pinned beside those of
    docs/reproducibility/r9_runs because a later run will meet the assets of all three. The legacy table lists
    top-level blocks only, so a new field of a sub-block still moves the legacy fingerprint; the configs that use the
    legacy layout are the runs made before round 9. No paper was searched for this decision.
  evidence:
  - path: src/fmu/utils/caching.py
    what: _STEP_OMITTED_AT_DEFAULT and _omit_step_defaults, read by _step_key
  - path: tests/test_step_keys_of_record.py
    what: The step keys of record pinned; a field added at its default and listed moves no key
  - path: docs/reviews/2026-10-19-review.md
    what: B11, and C52
  - path: docs/handoff/2026-10-20-round13.md
    what: Task 3, B11
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 13 brief)
- id: spec-per-step-key-revision-of-a-step
  title: >-
    A step whose computation a fix changes gets a revision, which moves its per-step key and those downstream of it
  decision: >-
    fmu.utils.caching (a Locked module) gets STEP_REVISION, a step's revision number, put in that step's per-step key
    payload when it is 1 or more and left out at 0, so a step not listed keeps the key it had. A fix that changes what
    a step computes for configs whose settings do not change raises that step's revision in the same commit, with a
    register entry; its key then moves, and through step_upstream the key of every step downstream of it, and no
    other. The k_elbow step also takes clustering's revision (_REVISION_ALSO_FROM): it reads clustering's cached
    scaled feature stack, but its key leaves k out and so cannot hash clustering's key; added the same evening, after
    the table, with a test that fails without it (a revision of clustering moved clustering only). The table is empty
    when added, so no key moves. tests/test_step_keys_of_record.py checks that the configs of the 21 per-step runs of
    record give their recorded keys exactly for the steps no revision reaches, a new key for each step one reaches,
    and every recorded key again with the table emptied. The legacy fingerprint has no revision: a config whose cache
    holds legacy assets (the runs before round 9) still reads the assets it made.
  alternatives_considered:
  - >-
    Raise STEP_KEY_VERSION: not chosen; it moves every key of every step and config at once, so assets no fix touched
    (the masks, the canopy height, the embedding) would be computed again
  - >-
    Add a setting for each fix, off by default and left out of the keys at its default: not chosen; the configs of
    record would then keep the old behaviour unless edited, while the brief asks for the fix itself ("make the date
    windows' end inclusive in data_load")
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), "How to fix each finding", rule 4: "If the fix changes what a step
    computes, it must change that step's cache key, so cached assets are not reused (A4 notes that its fix would
    not)." A per-step key hashes the settings and the upstream keys only, so a change of code with no change of
    setting moves no key (review A4: making data_load's end inclusive leaves the data_load and features_radar keys as
    they are). The new test fails on the code before the change (a revision moved no key) and passes after it. No
    paper was searched for this decision.
  evidence:
  - path: src/fmu/utils/caching.py
    what: STEP_REVISION and _REVISION_ALSO_FROM, read by _step_key
  - path: tests/test_step_keys_of_record.py
    what: >-
      test_a_revision_moves_its_step_and_every_step_downstream_and_no_other; the records' keys checked against the
      revisions
  - path: docs/reviews/2026-10-19-review.md
    what: A4, its note on the step keys
  - path: docs/handoff/2026-10-20-round13.md
    what: Task 2, the per-step revision
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 13 brief)
- id: spec-export-stand-type-from-its-own-row-or-null
  title: >-
    In the exported stand layer a stand left out of the k-means fit takes its own row's type, and a stand with no row
    gets a null type in every cache layout
  decision: >-
    The export stage (src/fmu/stages/export.py, a Locked module) types each stand of stands_merged from its own row
    only. Every stand with a typed pixel of its own takes the type most of its own typed pixels carry (_stand_row_types,
    as since round 12), the stands left out of the k-means fit with clustering.fit_excludes_stands_below_min_area on
    among them, whose rows the fitted clusters type too; every other stand gets a null cluster_id, whatever typed
    pixels its polygon touches (_take_the_fit_rows_types). The vote over a polygon's pixels (reduceRegions with
    ee.Reducer.mode()) is no longer made for stands_merged, and the stage no longer reads the setting or
    stand_provenance to type a stand (_fit_row_types, and its warning when the setting is on without provenance, are
    gone). "Has a row" is read as round 12 reads it: the stand has a typed pixel of its own. On the legacy cache layout
    these are the type-grid pixels whose centres it holds, so a stand with a row in the fit that holds none gets a null
    type too, and a stand with no row in the fit that holds some takes their type. A stand whose pieces carry different
    types takes the commonest type over its typed pixels, as coded (question 3, answered (a): no change).
    stands_snic and stands_dissolved are typed as before.
  alternatives_considered:
  - >-
    Keep the vote for the stands with no row and for the stands left out of the fit (round 12's export): not chosen;
    Jaskaran answered (b) to questions 1 and 2 of docs/handoff/2026-10-19-round12.md
  - >-
    Keep the vote and set it to null afterwards for the stands with no row: not chosen, since the vote would then be
    computed over every polygon for nothing
  - >-
    On the legacy layout, keep the vote for a stand with a row in the fit that holds no typed pixel centre on the type
    grid: not chosen. The export cannot tell such a stand from one with no row (the clustering stage keeps neither the
    clusterer nor which pixel each row was drawn at), and the vote is what question 1's answer drops
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 1: "Jaskaran's answers: 1 (b), 2 (b), 3 (a), 5 (a). ... Implement
    1 and 2 in the export, with tests: a stand with no row in the fit gets a null type in every layout, and a stand
    left out of the fit takes its own row's type. Add the register entry the Locked module needs." Question 1's (b) in
    docs/handoff/2026-10-19-round12.md: "Make them null in every layout, as docs/outputs.md ("Null cluster_id is
    meaningful") and the export's comment say is intended." Question 2's (b): "Yes: they take their row's type too.
    For: it is the type the fit gives them, which is what the kept-land declaration says they get ("the type of the
    nearest fitted cluster")." On round 12's export the new tests fail: a stand with no typed pixel whose polygon
    touches a sliver of a neighbour's type 2 got 2 (assert 2 is None), and a stand left out of the fit whose vote was
    3 and whose row is 0 got 3 (assert 3 == 0). On the analysis grid (every _r9 and round 12 run) nothing changes: in
    the eleven _r9 runs and the eight round 12 runs every stand of the layer has a typed superpixel of its own (the
    stands with no row have no polygon) and no stand left out of the fit carries a type other than its own (round 12's
    count, docs/reproducibility/r9_runs/stand_types_from_fit_rows.json, and the same script run again on the round 12
    runs' layers in round 13, offline, not kept). On the legacy layout, counted offline from the demo set's re-merge
    (its per-stand files, off git, built at 5c8dcad), a re-export would give a null type to every one of the 3 to 33
    stands per run that took a neighbour's type through the vote (docs/demo/remerge/README.md, section 4) but one stand
    of odisha_v120_handcrafted_koraput_repro, which holds typed pixel centres of its own; and to two stands with a row
    in the fit that hold no typed pixel centre on the type grid, one each in odisha_v120_3ha_dhenkanal_repro and
    odisha_v120_handcrafted_dhenkanal_repro, whose vote was their row's type. The export is not cached, so no step key
    moves (the fingerprint and the eleven step keys of all 74 configs under configs/ are the same before and after).
    No paper was searched for this decision.
  evidence:
  - path: src/fmu/stages/export.py
    what: _build_merged_feature_collection, step 3; _take_the_fit_rows_types
  - path: tests/test_export_stand_type_from_fit_row.py
    what: >-
      The rule on a fake raster; test_a_stand_with_no_row_gets_a_null_type_whatever_its_polygon_touches and
      test_a_stand_left_out_of_the_fit_takes_its_own_rows_type fail on round 12's export
  - path: tests/test_export_stand_type_from_fit_row_live.py
    what: The Earth Engine calls on synthetic images, with the null type of a stand without a row (live tier)
  - path: tests/test_export_merged_layer.py
    what: The builder's calls, with no vote
