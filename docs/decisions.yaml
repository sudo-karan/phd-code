- id: spec-data-load-windows-include-their-end-date
  title: >-
    data_load's three date windows include their end date, as features_embedding's does, and data_load's step revision
    is raised to 1
  decision: >-
    src/fmu/stages/data_load.py (a Locked module) gives filterDate the day after each window's end date
    (ee.Date(end).advance(1, "day"), the helper _day_after), for the Sentinel-2 phenology collection, the Sentinel-1
    collection and the Sentinel-2 composite (_composite_window, which input_collections reads too, so the record of
    the composite's images names the images used). filterDate's end is exclusive, so each window now holds every day
    the config gives, 2017-01-01 to 2022-12-31 in all 74 configs, and the window strings the stage records are the
    days it used. fmu.utils.caching (Locked) raises data_load's step revision to 1 (STEP_REVISION): the data_load key
    moves, and with it the features_optical, features_radar, merge, clustering and k_elbow keys of all 74 configs under
    configs/, and the segmentation key of the 52 whose superpixels are drawn on the hand-crafted stack (the 22
    embedding configs segment on the embedding). The legacy fingerprints do not move. The only other filterDate in
    src/fmu, the CHIRPS climatology window of features_static, is unchanged: the review found it sound (pentads are
    dated by their first day, the 1st, 6th, 11th, 16th, 21st or 26th of a month, so an exclusive end of 31 December
    leaves none out); not checked against Earth Engine here.
  alternatives_considered:
  - >-
    Keep the shorter window and write 2017-01-01 to 2022-12-30 in the register, the docs and the manifests (the
    review's second option): not chosen; the brief asks for the end to be made inclusive
  - >-
