- id: spec-batch-wrapper-starts-no-pass-on-a-changed-run-tree
  title: >-
    The batch wrapper reads the run tree before and after each pass, records it, and starts no pass on a tree that has
    changed since the batch started
  decision: >-
    odisha_script/run_passes_safely.py reads the run tree's commit and modified tracked files at the start (a tree with
    modified tracked files is refused, exit 92, as before), and again before and after each pass. The state file's git
    block is the tree as the batch started, with its real dirty flag and the files behind it; each pass adds
    git_before and git_after. If before a pass the tree is not the one the batch started from (its commit moved, or a
    tracked file is modified), that pass does not start, the configs left are not finished, run_tree_changed records
    the pass and the tree, and the batch ends NOT ALL COMPLETE with exit 95. A change seen after the last pass ends the
    batch so too (after_pass). Untracked files are left out, as at the start: finished runs leave untracked outputs.
    Round 14 (26 Oct 2026): untracked code under src/, scripts/, odisha_script/ and configs/ is counted, at the start
    (exit 92) and before and after each pass, by the run tree's own fmu.utils.provenance.untracked_code, and the git
    blocks add untracked_code; other untracked files are still left out (spec-dirty-flag-counts-untracked-code).
  alternatives_considered:
  - >-
    Read the tree once, at the start, and write dirty false (the wrapper before round 13): not kept; a commit or an edit
    made between passes was not seen, the next pass ran other code than the passes before it, and the state file named
    the start commit as clean (review C32)
  - >-
    Record the change and carry on with the next pass: not chosen; a batch is run from a run tree pinned to one commit
    (CLAUDE.md), and exit 92 already refuses a modified tree at the start. Put to Jaskaran
    (docs/handoff/2026-10-20-round13.md, Questions)
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 6: "The C list: fix what is a documentation or record error." The
    review (docs/reviews/2026-10-19-review.md, C32): in the wrapper, read the git state before each pass, and refuse (or
    record) when it changes; with a stand-in ee, a commit or an uncommitted edit between passes left state.json at the
    start commit, dirty False. tests/test_run_passes_safely_run_tree.py runs the real wrapper and shell script against
