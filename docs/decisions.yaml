- id: field-plot-within-30-m-of-a-stand
  title: >-
    For the field check of the kept-land runs, the mask stays, and a plot within 30 m of a stand counts as on that stand
  decision: >-
    For the FES field check of the kept-land runs, to be declared before any score: the land-cover mask stays as it
    is, so a plot on land the mask removes is still in no stand's polygon; but in the field check a plot within 30 m
    of a stand counts as on that stand. This is option (b) of the question of the plots on removed land (14 of the
    267 Odisha plots lie on it inside the boxes). Recorded now for the declaration; nothing is scored in round 6.
    What the declaration settles: the distance (30 m, to the stand's polygon), and which stand counts when more than
    one lies within 30 m.
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: >-
    With SNIC and the merge on kept land only (spec-segmentation-mask-before-snic), a plot on land the mask removes
    lies in no stand, and a comparison that takes plots by the stand they fall in would lose them. Jaskaran, 15 Oct
    2026: "Field plots on removed land: option (b): the mask stays; in the field check a plot within 30 m of a stand
    counts as on that stand. Record it now as a decision for the FES declaration; no scoring this round." The other
    options of the question are not in the repo. No paper was searched for this decision.
