- id: spec-every-feature-stage-cached-before-the-first-pass-that-reads-one
  title: >-
    A batch run caches every feature stage in a pass of its own before the first pass that reads any of them
  decision: >-
    odisha_script/odisha_phase2_2_run_pipeline.py runs four passes: features (masking, the S2 composite and every
    feature stage the config needs, fmu.pipeline.feature_stage_names: segmentation's, the merge criteria's and
    clustering's alike), segmentation, clustering and export. Each pass after the first refuses to start (exit 3)
    while any cacheable output of the features pass, or of an earlier pass, is missing, so no pass computes a feature
    image live that another pass reads from the cache. odisha_script/run_config_passes.sh calls the four in order and
    odisha_script/run_passes_safely.py reads the features pass's exit code too.
  alternatives_considered:
  - >-
    Keep the three passes, with the feature stages segmentation does not read computed in the clustering pass: the
    way of every run before round 9, not chosen
  rationale: >-
    The round 9 brief (17 Oct 2026, task B, issue #44 item 2: "every feature stage cached before the first pass that
    needs any of them"), and question 2 of PR #43: in 13 of the 14 runs of 13 Oct 2026 the pass that fitted the stand
    types computed a feature stage live that the export pass read from the cache (static features in the hand-crafted
    runs, the merge criteria in the AlphaEarth runs), and the saved types agree with a second fit in 3 of 14 runs. No
    paper was searched for this decision.
