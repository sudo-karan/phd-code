- id: spec-manifests-record-the-environment-and-the-input-images
  title: >-
    Run manifests record the Python environment and, per input collection, the images the run used
  decision: >-
    Every pipeline manifest, export manifest and Odisha run record gets an environment block
    (fmu.utils.provenance.environment_state): the Python version, the earthengine-api version, and the SHA-256 of
    the sorted lines of pip freeze, without comments and without this package's own line, with the number of lines.
    A stage that reads image collections names them (Stage.input_collections: masking the annual LULC images and
    WorldCover, data_load the composite's Sentinel-2 images, features_optical the phenology collection,
    features_radar the Sentinel-1 collection, features_static CHIRPS, features_embedding the annual embeddings).
    When it runs live the manifest records, per collection, the count and SHA-256 of the sorted image ids, and the
    ids themselves when there are at most 100; every id goes to the run folder's input_images.json; in the per-step
    layout the count and SHA-256 also go on each asset it exports (property fmu_input_images), and a later run that
    reads the asset from the cache records them from there.
  alternatives_considered:
  - >-
    Record the ids only as the stage logs a count of images: the state before round 9, not chosen
  rationale: >-
    The round 9 brief (17 Oct 2026, task B: "Manifests also record: Python package versions (earthengine-api and pip
    freeze hash) and, per input collection, the list of image IDs the run used (or a hash of the sorted list plus the
    count, if the list is too long)"). Between 27 Aug and 13 Oct 2026 the same Sentinel-2 filter gave 192 and then
    195 images at Sanjay Van, and the Kendujhar composite changed with its count unchanged (docs/reproducibility.md).
    This package's own pip freeze line names the commit, which the git block records, and would make two checkouts
    of one commit differ. The limit of 100 listed ids is Claude Code's choice. No paper was searched for this
    decision.
