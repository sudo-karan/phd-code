- id: dn-radar-no-speckle-filter
  title: No speckle filter on the radar images
  decision: >-
    No per-image speckle filter (Lee or similar) is applied in the baseline. If single-scene speckle becomes
    a concern, it is to be a variant config, not a baseline addition.
  alternatives_considered:
  - A per-image Lee filter or similar spatial filter (3x3 or 5x5)
  rationale: >-
    Three reasons are given. (1) 100+ Sentinel-1 images per pixel are aggregated by median, and that variance
    reduction (about the square root of N) 'is much stronger than any 3x3 or 5x5 spatial filter could
    provide'. (2) 'Spatial filters blur edges', and SNIC segmentation relies on visible edges. (3) Filter
    settings (window size, damping) add 'knobs we'd need to defend'; the note cites ENG-006's 'stop going
    in circles' concern.
  evidence:
  - path: docs/design_notes.md
