    features_embedding does
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 2: "A4: make the date windows' end inclusive in data_load, as
    features_embedding does." Review A4 (docs/reviews/2026-10-19-review.md): the configs' end, 2022-12-31, went to
    filterDate as an exclusive end, so the S2 phenology collection, the S2 composite and the S1 collection stopped on
