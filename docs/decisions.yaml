- id: spec-odisha-keptland-s1-orbit-descending
  title: >-
    The four Odisha box kept-land runs are made again on the descending Sentinel-1 orbit
    (configs/odisha_v120_3ha_squares_<district>_keptland_s1desc.yaml), and these are the scored runs
  decision: >-
    data_load.s1_orbit is DESCENDING in four configs, copies of the round-6 kept-land configs that differ from
    them only in it and in their names and Drive folder. Over the boxes, in the radar window (2017-01-01 to
    2022-12-31, IW, VV and VH), the ascending orbit has 1 image in Koraput, 2 in Kendujhar, 3 in Angul and 174 in
    Dhenkanal; the descending one 204, 188, 188 and 188. The radar statistics of the round-6 runs therefore rest
    on one to three dates in three of the districts; in Koraput vv_iqr and vh_iqr are 0 on every stand. The orbit
    was chosen by image count, not by any score: no kept-land score existed. These runs compute their radar
    features and everything after them; masking, the S2 composite and the optical, structure and static features
    are copied from the round-6 runs (scripts/reuse_upstream_assets.py, RECOMPUTE_VIA_CONTEXT). They are the runs
    the field check of odisha_script/PHASE_KEPTLAND_PREDECLARED.md scores. The other Odisha configs keep
    ASCENDING, as does Sanjay Van, with 178 ascending images; their runs are not made again this round. (Since 18 Oct
    2026 the field check's scores of record are those on these configs' _r9 copies, run again from empty caches with
    the same orbit, field-keptland-scores-of-record-are-the-r9-re-runs; the scores on these runs stay as history.)
