- id: dn-masking-majority-vote-recent-year-tie-break
  title: >-
    Habitat is decided by a yes/no majority vote over usable years; ties go to the most recent usable
    year
  decision: >-
    For each pixel, each usable (non-cloud) year votes yes or no on 'was this Trees/Shrubs?'. The pixel
    is habitat if more usable years say yes than no. An exact tie is broken by the most recent usable
    year, moving to the next-latest year where the newest has no data.
  alternatives_considered:
  - >-
    Taking the most common class over the years (multi-class mode), which breaks a habitat versus non-habitat
    tie by the smallest class code
  rationale: >-
    A vote over years means 'a one-off annual misclassification can't flip a pixel in or out of the mask'.
    The multi-class mode was rejected because its tie rule is 'an arbitrary, ecology-free rule that quietly
    biases ties against habitat (since Trees=6 and Shrubs=12 carry high codes)'. The recent-year rule
    is 'an explicit, defensible "what was it most recently" rule'.
  evidence:
  - path: docs/design_notes.md
    what: 'Section ''Masking: IndiaSAT-primary, single-phase habitat'', paragraphs 1 and 2'
  - path: src/fmu/stages/masking.py
    what: >-
      MaskingStage.run: hab_votes, the tie image, and the most-recent-usable-year fallback; metadata 'habitat_collapse:
      majority_vote; ties -> most recent usable year'
  - path: docs/datasets.md
    what: >-
      'CoRE Stack LULC (IndiaSAT)': vote and tie-break, and how years are stamped from the asset id
  - path: tests/test_masking_live.py
    what: >-
      Live tests that the mask is binary and has coverage (need Earth Engine). No test targets the tie
      rule by name.
  papers: []
  status: adopted
  design_notes_section: 'Masking: IndiaSAT-primary, single-phase habitat'
  source: docs/design_notes.md lines 123-135
- id: dn-masking-single-phase-no-separate-subtraction
  title: >-
    One-step mask: water, cropland and built-up drop out because their classes are not habitat
  decision: >-
    The mask is 'single-phase'. Water, cropland and built-up are excluded only because their classes are
    not in the habitat set. There is no separate water-mask subtraction and no built-up mask.
  alternatives_considered:
  - A separate water-mask subtraction (named in the note as absent)
  - >-
    A separate built-up mask (the note says 'There is no built-up mask any more'; MODULES.md records that
    the use_viirs / use_open_buildings toggles were removed in this rework)
  rationale: >-
    'With a purpose-built LULC that already distinguishes trees/shrubs from water, crops, and built-up,
    a habitat definition is just "which classes count as habitat," and everything else falls out for free.'
    With no built-up mask, the old worry about deriving that layer from a source independent of the Sentinel-2
    features is 'moot'.
