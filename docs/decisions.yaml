- id: dn-log-transform-skewed-dec-004
  title: Log-transform right-skewed bands before scaling (DEC-004)
  decision: >-
    Log-transform a band before scaling when its skewness exceeds a threshold.
    Round 14 (26 Oct 2026): with clustering.log_rule right_skew, a setting off by default that needs clustering.fit_outside_earth_engine, the rule of spec-clustering-log-rule-right-skewed-bands applies instead (only right-skewed bands logged, as log1p((x - min) / IQR); no angle component tested; each angle pair scaled with one shared spread). The default is unchanged.
  alternatives_considered:
  - median/IQR scaling alone, without a log transform
  rationale: >-
    Some feature distributions are right-skewed. Median/IQR scaling can handle skew, but k-means still
    treats outliers as maximally distant points that pull centroids around. The log compresses the long
    tail; median/IQR scaling then puts the de-skewed band on a comparable scale to the others.
