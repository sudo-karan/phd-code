- id: dn-baseline-is-reference-new-ideas-new-configs
  title: >-
    The baseline is the fixed reference; a new idea is a new config that has to beat it
  decision: >-
    The baseline is the reference, not the best version. New ideas become new config files and have to
    beat the baseline.
  alternatives_considered: []
  alternatives_note: not recorded in the source
  rationale: The note says this is the mechanism for stopping the 'going-in-circles' pattern.
