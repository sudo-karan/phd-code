- id: spec-harmonic-time-reference-configurable
  title: The harmonic regression's reference date is a config value with a fixed default
  decision: >-
    features_optical.time_reference is the date used as t = 0 in the harmonic regression. It is a config
    field with the default 2017-01-01. It is not derived from the phenology date window. Before v1.1.0
