- id: spec-merge-pixel-counts-on-one-inclusion-rule
  title: >-
    The merge's pixel counts, boundary counts and valid counts are all taken by one rule: whole pixels whose centre is
    in the ROI
  decision: >-
    fmu.utils.adjacency (Locked, part of the merge stage) hands Earth Engine an unweighted reducer in each of the
    merge's four reductions: the label histogram (each superpixel's pixel count), the two pair histograms (the shared
    boundary counts) and a grouped reduction per criterion band (the valid counts and the means). Each then counts the
    whole pixels whose centre is in the ROI. The histogram counts are rounded to the nearest whole number, not
    truncated, and a valid count above its superpixel's pixel count raises ValueError, so frac_valid is at most 1. Two
    things Earth Engine's unweighted reducers do that its guide does not say, read on Earth Engine in round 13 on
    synthetic images, shape the code: a frequencyHistogram counts the region's masked pixels under the key "null",
    which the graph leaves out of both histograms; and a grouped reducer adds a band's masked pixels into the sum (and
    so the mean) it gives a group, though its count leaves them out, so each criterion band goes in unmasked (0 where
    it has no data) beside a band of 1 where it has data, both summed per superpixel, and a mean is the one sum over
    the other. Both are unmasked everywhere (unmask(0, False)), outside the band's footprint
    too, since unmask(0) alone leaves it masked there and the sums then take those pixels in (read on Earth Engine).
    Inside the ROI the counts are as before. At its edge a superpixel's pixel count is now its pixels whose centre is
    inside, the means are over the pixels counted, and a superpixel with no pixel whose centre is inside is no longer
    in the graph, so its pixels, all outside the ROI by that rule, get no stand (remap masks a label it is not given).
    The merge's revision (fmu.utils.caching.STEP_REVISION) is raised to 1, which moves the merge, clustering and k_elbow
    keys of every config with the merge on: all 74 under configs/.
  alternatives_considered:
  - >-
    Make the valid counts weighted instead, sums of weights like the histogram: not chosen. The counts would be
    fractions, so the merge's pixel counts and area bounds would no longer be whole pixels
  - >-
    Make only the three histograms unweighted and leave the grouped mean weighted: not chosen. Earth Engine does not
    document how it admits pixels to a reducer that combines a weighted mean with count(), so the valid counts could
    still take pixels the histogram leaves out; with the whole reducer unweighted, both follow one documented rule
  - >-
    The change as first written in round 13: the three histograms read with every key, and a grouped unweighted mean
    and count of each criterion band as it is. Not chosen: run read-only on synthetic images on 20 Oct 2026, the graph
    stopped on the histogram's "null" key, and the grouped reducer gave a band with data on 16 of a superpixel's 32
    pixels a mean of 83.25 where its 16 values average 82.5
  - >-
    Check frac_valid <= 1 in merge_superpixels instead: not chosen. The merge is a pure function that its tests feed
    valid counts above the pixel count on purpose (98 of the 200 golden graphs of tests/test_region_merge_provenance.py
    do), and the check belongs where the two Earth Engine counts meet
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 4: "B17 (one inclusion rule for pixel counts)". The review
    (docs/reviews/2026-10-19-review.md, B17) found the label histogram coverage-weighted and truncated with int(), while
    the valid counts count whole pixels: at the ROI edge frac_valid, documented as a fraction, is above 1 in every
    committed run record (up to 5.0 on the tile), 21 of 23 records have stands of zero pixels, and six edge stands of
    the _r9 runs were counted at 1 ha or more by the merge while holding 97 to 99 whole pixels. Earth Engine's guide
    ("Pixels in the region", developers.google.com/earth-engine/guides/reducers_reduce_region) takes a pixel into an
    unweighted reduction when its centre is in the region, with weight 1, and into a weighted one when about 1/256 of
    it is, weighted by the smaller of its mask and the fraction inside; the algorithm reference bundled with
    earthengine-api describes frequencyHistogram as "a (weighted) frequency table" and Reducer.unweighted as giving
    "the same inputs and outputs as the given Reducer, but with no weighted inputs". tests/test_adjacency_edge_pixels.py
    follows those rules on a scene the ROI's edge cuts. On the code before, it gives two superpixels 3 and 0 pixels
    where 4 and 1 have their centre inside, counts boundaries at the edge as 0, and finds valid counts above the pixel
    count; with the real client, offline, it checks that each reduction is handed Reducer.unweighted itself. Earth
    Engine itself departs from the guide's rule in two ways, found when the change as first written was run read-only
    on synthetic images (the round 13 record, read-only calls 7, 11 and 12): an unweighted frequencyHistogram of a
    label image masked on 104 of a region's 200 pixels gave the four labels' counts and "null": 104 (a weighted one
    gave no "null"), and at an edge that cuts pixels the unweighted counts were those of the pixels whose centre is
    inside (12, where the weighted histogram gave 11.70); a grouped unweighted sum of a band with data on 16 of a
    superpixel's 32 pixels gave 2,664 where its values sum to 1,320, while its count gave 16. The test file models the
    "null" key, and a new test checks that no masked band goes into the grouped reduction; on the change as first
    written both fail. tests/test_adjacency_attributes_live.py runs extract_superpixel_graph and
    extract_superpixel_attributes on Earth Engine on synthetic images (read-only): on the change as first written it
    stopped on the "null" key; on this one the pixel counts, the valid counts and the means over the pixels with data
    are as worked out by hand, a band with no data read as None. No paper was searched for this decision.
  evidence:
  - path: src/fmu/utils/adjacency.py
    what: extract_superpixel_graph and extract_superpixel_attributes, the four unweighted reductions and the check
  - path: src/fmu/utils/caching.py
    what: STEP_REVISION, the merge at revision 1
  - path: tests/test_adjacency_edge_pixels.py
    what: >-
      The counts at the ROI edge on a fake Earth Engine that follows the documented rules and the "null" key; no masked
      band into the grouped reduction; fails on the code before and on the change as first written
  - path: tests/test_adjacency_attributes_live.py
    what: The counts and means on Earth Engine, on synthetic images, read-only (live tier)
  - path: tests/test_step_keys_of_record.py
    what: The recorded keys downstream of the merge move, and no other
  - path: docs/reviews/2026-10-19-review.md
    what: B17
  - path: docs/handoff/2026-10-20-round13.md
    what: Task 4, B17
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 13 brief)
- id: spec-merge-area-bounds-in-whole-pixels
  title: >-
    The merge holds each merge to its ceilings in whole pixels: the two regions' pixels added, against the ceiling in
    pixels worked out exactly
  decision: >-
    fmu.utils.region_merge (Locked, part of the merge stage) judges a merge against max_area_ha, and with
    merge.pass2_soft_ceiling on against max_area_ha + min_area_ha, by adding the two regions' pixel counts and comparing
    the sum with the most whole pixels within the ceiling, worked out exactly from the ceiling as written
    (_whole_pixels_within: the shortest decimal each bound prints as, in fractions). It does so at every such
    comparison: pass 1's candidates and their re-check, pass 2's neighbours under and over max_area_ha, and the cause
    filed for a stand left below the minimum. The minimum is compared as before, a region's area (its pixels times
    hectares per pixel) against min_area_ha. The merge's revision (STEP_REVISION in fmu.utils.caching) is raised to 2,
    which moves the merge, clustering and k_elbow keys of all 74 configs under configs/. Three of the 200 golden graphs
    of tests/test_region_merge_provenance.py (seeds 3, 53 and 98) and five of the 516 graphs of
    tests/test_region_merge_soft_ceiling.py (random 3, 53 and 98; tight 53 and 98) give new digests, pinned in those
    tests; the two fixture files keep what the merge gave at their commits.
  alternatives_considered:
  - >-
    Compare (n_a + n_b) * px_to_ha with the bound, adding the pixels first: not chosen. It is exact at the configs'
    bounds (3, 4, 10 and 11 ha at 10 m) and gives the same merges on every test graph, but the product is itself a
    float, and 35 * 0.01 is a hair over 0.35: at 13,929 of the two-decimal bounds from 0.01 to 1000 ha at 10 m (3,477
    at 20 m, none at 30 m) it would judge every merge ending exactly on the bound as over it
  - >-
    Turn the bound into pixels by float division: not chosen; 0.29 / 0.01 is 28.999999999999996, so a 29 px stand would
    be over a 0.29 ha bound
  - >-
    Compare the minimum in whole pixels too: not done. The review lists the sums only, and its fix for B19 has
    Config.kept_patch_min_pixels() follow the merge's own arithmetic for the minimum; left as a question for Jaskaran
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 4: "B18 (area bounds compared in whole pixels)", and "Regenerate
    golden files only where the fix requires it, and say how many cases changed." The review
    (docs/reviews/2026-10-19-review.md, B18): "area(a) + area(b) <= max_area_ha, with area = n_pixels × 0.01, misjudges
    some exact splits as over the bound. At 3 ha that is 10 of 299 splits, at 10 ha 32 of 999, and at 1 or 4 ha none.
    Pass 1 then refuses the merge, and pass 2 demotes it." The new tests of tests/test_region_merge.py fail on the code
    before with those counts (pass 1 refused splits 20, 22, 45, 47, 70, 230, 253, 255, 278 and 280 of 300 px, 32 splits
    of 1000 px, and 8 of the 34 splits of 35 px at a 0.35 ha bound), and at each comparison of pass 2: a region filling
    10 ha exactly was left area-blocked, a join landing exactly on the 11 ha soft ceiling was refused, and a stand left
    by the iteration cap beside a neighbour it fits exactly was filed as area-blocked. When the change was made, the
    merge gave on all 200 golden graphs what the merge at 1da0614 gives with only this comparison changed, and with the
    soft ceiling off on all 516 graphs what the merge at 363ea6d gives with it changed, so the provenance and the soft
    ceiling still change nothing else. The review found that summing pixel counts first changes no stand on rebuilt
    graphs of the tile pilot, the Angul box and the Sanjay Van baseline; that was not checked here. No paper was
    searched for this decision.
  evidence:
  - path: src/fmu/utils/region_merge.py
    what: _whole_pixels_within, and max_px, soft_ceiling_px and joined_px in merge_superpixels
  - path: src/fmu/utils/caching.py
    what: STEP_REVISION, the merge at revision 2
  - path: tests/test_region_merge.py
    what: The area bounds in whole pixels; these tests fail on the code before
  - path: tests/test_region_merge_provenance.py
    what: DIGESTS_SINCE_B18, and the check of below_why in whole pixels
  - path: tests/test_region_merge_soft_ceiling.py
    what: OFF_DIGESTS_SINCE_B18
  - path: docs/outputs.md
    what: merge.pass2_relaxed_merges_over_max_area, decided in whole pixels
  - path: docs/reviews/2026-10-19-review.md
    what: B18
  - path: docs/handoff/2026-10-20-round13.md
    what: Task 4, B18
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 13 brief)
- id: spec-kept-patch-minimum-by-the-merges-arithmetic
  title: >-
    The smallest kept patch SNIC sees is the fewest pixels the merge does not count as below merge.min_area_ha, by the
    merge's own arithmetic
  decision: >-
    Config.kept_patch_min_pixels() (src/fmu/config.py, a Locked module) returns, with
    segmentation.drop_kept_patches_below_min_area on, the smallest n for which n * (scale^2 / 10_000), in floats as
    fmu.utils.region_merge computes a region's area, is not below merge.min_area_ha, instead of rounding up
    min_area_ha * 10_000 / scale^2. With the setting off it still returns 0. No config under configs/ has the setting
    on, and every one has min_area_ha 1.0 at 10 m, which gives 100 px either way, so the value of no config changes, no
    step computes differently and no revision is raised.
  alternatives_considered:
  - >-
    Round up a decimal-exact quotient: not chosen. It disagrees with the merge at 30 m, where 5 * 0.09 is
    0.44999999999999996, so the merge counts 5 px as below a 0.45 ha minimum that the exact quotient puts at 5 px (54 of
    the two-decimal minima from 0.01 to 20.00 ha at 30 m)
  - >-
    Make the merge's own minimum exact in whole pixels, so that both follow the decimal: not done; a question for
    Jaskaran (spec-merge-area-bounds-in-whole-pixels compares the ceilings so, not the minimum)
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 4: "B19 (the kept-patch minimum)". The review
    (docs/reviews/2026-10-19-review.md, B19): "1.11 ha at 10 m gives 111.00000000000001 px, which rounds up to 112. With
    drop_kept_patches_below_min_area on, an isolated patch of exactly the minimum (111 px) is removed before SNIC,
    although the merge counts it as a legal stand", against the method's docstring and
    spec-segmentation-mask-before-snic; at 10 m 116 of the 2,000 two-decimal minima from 0.01 to 20.00 ha came out one
    pixel high, and the tests pinned exact values only. The new test in tests/test_mask_before_snic.py fails on the code
    before with assert (112, 57, 5) == (111, 56, 6) (1.11 and 0.56 ha at 10 m, 0.45 ha at 30 m, where the rule before
    was one pixel low), and checks against merge_superpixels itself that the value is the smallest the merge counts as
    a stand for every two-decimal minimum from 0.01 to 5.00 ha at 10, 20 and 30 m (the rule before differed on 51 of
    those 1,500). Latent, as the review says: no committed or planned run has the setting on. No paper was searched
    for this decision.
  evidence:
  - path: src/fmu/config.py
    what: Config.kept_patch_min_pixels
  - path: tests/test_mask_before_snic.py
    what: test_the_smallest_patch_is_the_smallest_the_merge_counts_as_a_stand; fails on the code before
  - path: src/fmu/utils/region_merge.py
    what: The merge's arithmetic, a region's area against min_area_ha
  - path: docs/reviews/2026-10-19-review.md
    what: B19
  - path: docs/handoff/2026-10-20-round13.md
    what: Task 4, B19
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 13 brief)
- id: spec-merge-pair-code-cast-before-it-is-computed
  title: >-
    The merge's boundary pair code is computed in int64: both dense indices are cast before the code is made
  decision: >-
    fmu.utils.adjacency (Locked, part of the merge stage) makes the code of each boundary pixel pair as
    dense.toInt64().multiply(n).add(neighbour.toInt64()), the cast first, where it made dense.multiply(n).add(neighbour)
    and cast the result. The code a * n + b reaches n^2 - 1, past 2^31 once n is over 46,340. For n up to 46,340 the
    codes are the same numbers, and every run of record had fewer superpixels (the largest, the 10 km tile, 21,263), so
    no step computes differently for any config and no revision is raised. The bandTypes() call the review suggests
    belongs with raising merge.max_superpixels (review B1, out of round 13) and was not made.
  alternatives_considered:
  - >-
    Leave it, since no run comes near: not chosen; the brief lists B34, and merge.max_superpixels (50,000) allows n past
    46,340
  - >-
    Confirm the pixel type Earth Engine gives with one bandTypes() call: not done this round; it belongs with B1
    (raising the guard), out of round 13
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 5, which lists B34. The review (docs/reviews/2026-10-19-review.md,
    B34, low confidence): "Codes reach n² − 1, which is above 2³¹ once n > 46,340. A correct graph then depends on Earth
    Engine widening integer multiply/add. If it wraps, the result is a loud KeyError; if it saturates, edges are
    silently wrong", with the fix "Cast first". The algorithm reference bundled with earthengine-api says of
    Image.multiply and Image.add: "The type of the output pixels is the union of the input types." The new test in
    tests/test_adjacency.py records the calls with a stand-in for Earth Engine (tests/_ee_recorder.py) and fails on the
    code before, where the multiply was made on the dense image itself and the cast came last. What Earth Engine
    computes was not checked: no Earth Engine call was made. No paper was searched for this decision.
  evidence:
  - path: src/fmu/utils/adjacency.py
    what: extract_superpixel_graph, the pair code
  - path: tests/test_adjacency.py
    what: test_the_pair_code_is_computed_in_int64; fails on the code before
  - path: docs/reviews/2026-10-19-review.md
    what: B34
  - path: docs/handoff/2026-10-20-round13.md
    what: Task 5, B34
  papers: []
  status: adopted
  design_notes_section: null
  source: Jaskaran, 19 Oct 2026 (round 13 brief)
- id: spec-multi-feature-roi-shells-counter-clockwise
  title: >-
    A ROI file of several features is sent to Earth Engine with every shell counter-clockwise and every hole clockwise
  decision: >-
    fmu.utils.gee.load_roi_geometry (a Locked module) builds a ROI file of more than one feature as before, one
    MultiPolygon under the left-inside rule (evenOdd=False), but first orients each polygon with
    shapely.geometry.polygon.orient (sign 1.0: shell counter-clockwise, holes clockwise), and takes each part of a
    MultiPolygon feature as one polygon of the ROI. A feature that is not a Polygon or MultiPolygon is refused. A ROI
    file of one feature, as every committed AOI is, takes the path it took before, unchanged: its geometry dict goes to
    ee.Geometry as the file holds it.
  alternatives_considered:
  - >-
    Refuse a ROI file of more than one feature: not chosen; aois/README.md gives an ogr2ogr recipe that can write
    one, and the fix keeps that file usable instead of sending the person to dissolve it by hand
  - >-
    Dissolve the features locally (shapely union) and send one geometry: not chosen; it changes the vertices sent,
    and orienting is the smallest change that makes the left-inside rule read each shell as its inside
  - >-
    Build the several features with evenOdd=True: not chosen; where two features overlap the even-odd rule makes the
    overlap a hole
  rationale: >-
    The round 13 brief (Jaskaran, 19 Oct 2026), Task 5, names B33 among the tools to fix; the review
    (docs/reviews/2026-10-19-review.md, B33): "Under the left-inside rule a clockwise shell (GEOS buffers, and GDAL's
    shapefile conversion) means the rest of the globe. Every committed AOI has one feature, so the path is unused",
    with the suggested fix "Orient shells counter-clockwise (shapely.geometry.polygon.orient), dissolve locally, or
    refuse more than one feature." Orienting was chosen because it changes nothing for a one-feature ROI (that code
    path is not touched) and keeps a multi-feature file usable. The new test fails on the code before the fix (a
    clockwise second shell reached ee.Geometry.MultiPolygon with signed area -1.0) and passes after it; a test over
    all 12 committed AOIs (aois/*.geojson, one feature each) checks that each is sent as ee.Geometry of its one
    geometry dict, unchanged, and never as a MultiPolygon. No cached step computes anything different for any config,
    so no step revision is raised and no cache key moves. No paper was searched for this decision.
  evidence:
  - path: src/fmu/utils/gee.py
    what: load_roi_geometry, the multi-feature branch
  - path: tests/test_gee_utils.py
    what: >-
      test_a_multi_feature_roi_is_sent_with_counter_clockwise_shells, and
      test_every_committed_aoi_is_sent_as_its_one_feature_unchanged over aois/*.geojson
  - path: docs/reviews/2026-10-19-review.md
    what: B33
  - path: aois/README.md
    what: The ogr2ogr recipe that can write a ROI file of several features
  papers: []
  status: adopted
