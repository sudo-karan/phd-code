- id: spec-merge-stage-makes-the-stand
  title: SNIC plus a merge stage draws the stand; k-means only names its type
  decision: >-
    A merge stage sits between segmentation and clustering and joins SNIC superpixels (small patches)
    into stands. SNIC plus merge decides what a stand is; k-means only gives each finished stand a type
    label. Later stages take their unit from one function, Config.unit_label_key(): stands when merge
    runs, superpixels when it is off.
  alternatives_considered:
  - >-
    Dissolve-by-cluster-id: join every touching patch that k-means gave the same type. This is the layer
    the merge replaces; it is still exported as stands_dissolved.
  rationale: >-
    merge.py: every merging-family paper in the survey treats a fine segmentation as a primitive, not
    a stand, and Xiong states that over-segmented pieces are too small for forest management and must
    be joined into stands of suitable size. The repo's own numbers agree: dissolve-by-cluster-id gave
    505 units, 66% under 0.5 ha holding 5.4% of the area, while 6% held 68%.
  evidence:
  - path: src/fmu/stages/merge.py
    what: 'module docstring, lines 1-38: why the stage exists and how it runs'
  - path: MODULES.md
    what: row 14b (line 28) and the v1.2.0 paragraph (lines 36-43)
  - path: src/fmu/config.py
    what: 'Config.unit_label_key(), lines 798-806: one definition of the unit'
  - path: src/fmu/stages/clustering.py
    what: 'docstring lines 4-8: clustering only attaches a type label'
  - path: tests/test_merge_stage.py
    what: >-
      test_merge_sits_between_segmentation_and_clustering, test_clustering_labels_stands_not_superpixels,
      test_metrics_uses_the_same_unit_key
  - path: tests/test_stage_graph.py
    what: test_the_run_produces_the_stand_layer
  papers:
  - doi: 10.1007/978-3-642-38886-6_10
    title: >-
      Forest Stand Delineation Using a Hybrid Segmentation Approach Based on Airborne Laser Scanning Data
    first_author: Wu
    year: 2013
    verified: true
    supports: used
    supports_what: >-
      Method paper. The authors delineate stands from airborne lidar in two steps: the mean shift algorithm
      makes raw stands, and spectral clustering refines them. In this entry the repo cites it for: seeded
      region growing over SLIC superpixels, as work that treats a fine segmentation as a primitive, not
      a stand (the repo writes 'Wu et al. 2013/2014', which is two papers). Check of that claim: Not confirmed
      for this 2013 paper: the abstract names mean shift and spectral clustering, and does not mention
      SLIC or seeded region growing. That description fits the 2014 paper. The general point (a first
      segmentation is refined before it is called a stand) is consistent with the abstract. The full text
      was not read.
    cited_in: src/fmu/stages/merge.py:9-10
  - doi: 10.1109/cisp.2014.7003840
    title: >-
      ALS data based forest stand delineation with a coarse-to-fine segmentation approach
    first_author: Wu
    year: 2014
    verified: true
    supports: used
    supports_what: >-
      Method paper. The authors make coarse stands from a lidar feature image with mean shift, then refine
      each coarse stand with seeded region growing over SLIC superpixels (SLIC-SRG). The abstract claims
      better accuracy than earlier methods on their test data. In this entry the repo cites it for: seeded
      region growing over SLIC superpixels, as work that treats a fine segmentation as a primitive, not
      a stand (the repo writes 'Wu et al. 2013/2014', which is two papers). Check of that claim: Seeded
      region growing over SLIC superpixels: confirmed from the abstract ('Simple Linear Iterative Clustering
      superpixels based Seeded Region Growing (SLIC-SRG)'). One caution: in this paper SLIC superpixels
      are the fine units inside a coarse mean-shift stand, so the order is coarse to fine, not fine segments
      merged upward. The full text was not read.
    cited_in: src/fmu/stages/merge.py:9-10
  - doi: 10.1080/2150704x.2014.900203
    title: >-
      Forest stand delineation from lidar point-clouds using local maxima of the crown height model and
      region merging of the corresponding Voronoi cells
    first_author: Olofsson
    year: 2014
    verified: true
    supports: used
    supports_what: >-
      Method paper. The authors segment forest stands from airborne lidar by taking local maxima of the
      crown height model, building Voronoi cells around them and merging the cells into regions. The abstract
      says the automatic result is comparable to manual delineation. In this entry the repo cites it for:
      region merging over Voronoi cells, as work that treats a fine segmentation as a primitive, not a
      stand. Check of that claim: Region merging over Voronoi cells: confirmed from the title. That the
      paper treats the fine segmentation as a building block and not as a stand follows from the title
      (cells are merged to make stands), but the paper's own wording on this was not read.
    cited_in: src/fmu/stages/merge.py:10
  - doi: 10.14214/sf.23014
    title: Forest stand delineation using airborne LiDAR and hyperspectral data
    first_author: Xiong
    year: 2024
    verified: true
    supports: used
    supports_what: >-
      Source of the merge design. The authors over-segment a lidar canopy height model, compute attributes
      per segment, then apply two rules: merge homogeneous segments, and eliminate undersized ones. They
      score the result with explained variance and IoU. The abstract also reports their method beating
      manual delineation and 'multi-scale segmentation' on explained variance of mean canopy height; the
      repo cites the paper as the design it follows, so 'used' is the claim recorded. In this entry the
      repo cites it for: two explicit rules over multiresolution segments, and the statement that over-segmented
      segments are too small for forest management and must be aggregated into continuous stands of suitable
      size. Check of that claim: Two rules (merge, then eliminate): confirmed. The statement: confirmed,
      near word for word ('too small for the forest management implementation ... further aggregated to
      obtain continuous forest stands of suitable sizes'). The verifiers describe the first step as over-segmenting
