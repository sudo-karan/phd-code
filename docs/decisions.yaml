    Jaskaran's answer (a) to question 3 of docs/handoff/2026-10-18-round10.md, 18 Oct 2026 (the round 11 brief): "leave
    per-part cached rasters as they are (option a)." Round 10 found the S2 composite of a box ROI charged by the extent
