- id: sup-stand-size-3ha
  title: Stands of at most 3 hectares, as the supervisor asked
  decision: >-
    Phase 3 adds a second stand map with merge.max_area_ha = 3.0 (configs odisha_v120_3ha_<district>).
    To make that reachable, SNIC seed spacing drops from 10 to 6 pixels (about 100 m to 60 m), and the
    stand types use k = 5. The 10 ha map is kept for comparison.
  alternatives_considered:
  - 'A 2 ha ceiling: named and not taken'
  - >-
    The 10 ha ceiling of the reported Phase 2 run: its median stand was 3.09 ha and more than half its
    stands exceeded what was asked
  - 'Keeping seed spacing at 10 pixels: the first attempt failed'
  rationale: >-
    The supervisor asked for stands merged to at most 2-3 ha. 3 rather than 2 because the field data is
    sparse: the smaller the ceiling, the fewer plots share a stand and the weaker the within-stand test.
    Merge can join superpixels but never split one; at spacing 10 single superpixels reach 6.74 ha (Dhenkanal),
    so the first run stopped with a ComponentSizeError. The spacing change was forced by the data and
    decided on 2026-09-24; the write-up notes it is a change the supervisor did not name.
