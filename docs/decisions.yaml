  - path: src/fmu/stages/features_optical.py
    what: The ndvi_amplitude_annual layer
  - path: src/fmu/stages/features_radar.py
    what: The vv_minus_vh_median layer
  - path: src/fmu/stages/features_structure.py
    what: The canopy_height and canopy_height_std layers
  - path: src/fmu/stages/features_static.py
    what: The elevation layer
  - path: src/fmu/stages/features_embedding.py
    what: The A00, A01, A02 composite
  - path: src/fmu/stages/segmentation.py
    what: The superpixel outline layer
  - path: src/fmu/stages/clustering.py
    what: The stand-type layer and legend, the five summary numbers and summarise()
  - path: tests/test_transparency_contract.py
    what: >-
      ENFORCED and PENDING; what each stage declares; that declared bands are bands the stage writes; the two
      configs the declarations do not fit
  - path: tests/test_stages_base.py
    what: The bands tests of DisplayLayer, including that a single-band layer's record has no "bands" key
  - path: tests/test_repro_fingerprints.py
    what: The 14 _repro fingerprints are unchanged
  - path: docs/outputs.md
    what: 'Section "The transparency record": the table of layers, the exceptions, and the note on the counts'
