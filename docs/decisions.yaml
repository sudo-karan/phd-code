- id: dn-merge-criteria-identical-across-arms
  title: Merge criteria are the same in both arms
  decision: >-
    Hold the merge criteria identical across arms. An embedding run still computes canopy_height and ndvi_amplitude_annual
    and merges on them, with the same tolerances.
  alternatives_considered:
  - >-
    merge the embedding arm on embedding dimensions (named in src/fmu/config.py lines 497-500 and the
    merge.py docstring)
  rationale: >-
    The code says what makes two adjacent patches one stand is a fact about forestry, not about the sensor
    pipeline. Holding the merge rule constant leaves delineation as the only thing differing between arms,
    which is the thesis question. If each arm merged on its own features, differences in stand geometry
    would confound different boundaries with different merge rules, and the thresholds would lose their
    physical units. A second reader (entry spec-merge-rule-same-in-both-arms) recorded: merge.py and config.py:
    what makes two adjacent patches one stand is a fact about forestry, not about the sensor pipeline.
    Holding the rule fixed leaves delineation (where the boundaries fall) as the only thing that differs
    between arms, which is the thesis question. If each arm merged on its own features, a difference in
    stand geometry could come from different boundaries or from different merge rules, and the thresholds
    would lose their physical units.
  evidence:
  - path: docs/design_notes.md
    what: >-
      Lines 550-553: 'the merge criteria are held identical across arms and read canopy_height and ndvi_amplitude_annual'.
  - path: src/fmu/config.py
    what: >-
      _DEFAULT_MERGE_CRITERIA (lines 424-429) and the MergeParams comment at lines 492-500; second reader:
      comment lines 492-500
  - path: src/fmu/stages/merge.py
    what: >-
      Module docstring, paragraph beginning 'The merge rule is held identical across arms'; second reader:
      docstring lines 31-38
  - path: tests/test_merge_config.py
    what: >-
      test_shipped_configs_share_the_merge_rules, test_default_criteria_are_analogues_of_two_of_xiongs_merge_conditions;
      second reader: test_shipped_configs_share_the_merge_rules (covers configs/sanjay_van_*.yaml)
  - path: tests/test_embedding_arm.py
    what: >-
      test_embedding_arm_runs_hand_crafted_stages_only_for_the_merge_gate; second reader: test_embedding_arm_runs_hand_crafted_stages_only_for_the_merge_gate
  - path: docs/features_snic_vs_kmeans.md
    what: Section 6.
  - path: configs/sanjay_van_alphaearth.yaml
    what: 'header comments: the shared merge rule is deliberate'
  - path: configs/odisha_alphaearth.yaml
    what: 'lines 1-10: merge criteria held identical to the v120 arm'
  papers:
  - doi: 10.14214/sf.23014
    title: Forest stand delineation using airborne LiDAR and hyperspectral data
    first_author: Xiong
    year: 2024
    verified: true
    supports: used
    supports_what: >-
      Source of the merge design. The authors over-segment a lidar canopy height model, compute attributes
      per segment, then apply two rules: merge homogeneous segments, and eliminate undersized ones. They
      score the result with explained variance and IoU. The abstract also reports their method beating
      manual delineation and 'multi-scale segmentation' on explained variance of mean canopy height; the
      repo cites the paper as the design it follows, so 'used' is the claim recorded. In this entry the
      repo cites it for: the merge design (section 2.6: two passes, hard area bounds, two-tier thresholds)
      and three merge axes, of which the two default criteria are the closest analogues of two (until 19 Oct
      2026; since round 12 the MergeParams docstring and the test cite Eq. 1's five conditions instead,
      spec-merge-comment-states-xiong-eq1-exactly). The repo
      does not cite it for holding the rule identical across arms. Check of that claim: Two passes (2.6.1
      merge, 2.6.2 eliminate), hard area bounds and two-tier thresholds: confirmed by both verifiers.
      Three merge axes (stand height, dominant-species proportion, canopy closure): confirmed for the
      merge rule by the verifier who read the equation images (Eq. 1 also requires the same dominant species;
      canopy closure uses a fixed 0.2 and is absent from the eliminate rule). The other verifier could
      not read the equations and left this unsettled. A later review of this register read the images
      of Eq. 1, Eq. 2 and Eq. 4 on the publisher page again and found the same: Eq. 1 is a list of five
      conditions (summed area under the maximum, same tree species, canopy closure difference under 0.2,
      tree proportion difference under TP1, stand height difference under SH1); Eq. 2 has no canopy closure
      term and ends with 'Max(LenghtofCommonSide)'; Eq. 4 is R2 = 1 - SSwithin/SStotal.
    cited_in: >-
      src/fmu/config.py lines 435-445 (MergeParams docstring); MODULES.md row 14b; README.md line 39.
      Not cited in the design_notes section itself.
  status: adopted
  design_notes_section: 'Embedding arm: cluster a pretrained embedding instead of the hand stack'
  source: >-
