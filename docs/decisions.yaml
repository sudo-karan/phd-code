- id: spec-segmentation-mask-before-snic
  title: >-
    SNIC can be run on kept land only, so that superpixels and stands lie on trees or scrub, and the merge joins
    only superpixels that touch there
  decision: >-
    Two segmentation settings, both off by default. segmentation.mask_before_snic selects where SNIC draws
    superpixels. Off, the default and the behaviour of every run made before it existed: SNIC and the merge cover
    the whole ROI and the land-cover mask (habitat_mask: trees or scrub) is applied at clustering only, so a stand
    can hold cropland or built-up land and its type is fitted on means over all of it. On: kept land is habitat_mask
    1 on the analysis grid, clipped to the ROI with the same reproject(grid).clip(roi) the stage gives its two
    outputs (fmu.utils.kept_land.kept_land_in_roi), before anything else is made from it, so that SNIC cannot grow a
    superpixel past the ROI edge and the clip of its outputs takes nothing away; the per-band z-score and the
    distance normaliser are measured over that land only (the normaliser over pairs of adjacent kept pixels with
    every band defined); SNIC runs on the input stack with every other pixel masked; its seeds are the square
    grid on kept land plus every pixel of each kept patch that no grid point falls in, so that no patch is left
    without a superpixel because of where the grid falls (fmu.utils.kept_land.seeds_on_kept_land); and both SNIC
    outputs are masked to kept land. segmentation.drop_kept_patches_below_min_area, which needs the first, also
    leaves out before SNIC each patch of kept land smaller than merge.min_area_ha that touches no other kept land
    (connectedPixelCount at merge.min_area_ha in pixels, Config.kept_patch_min_pixels), the standard minimum
    mapping unit tied to the stand minimum rather than to a number of its own. The merge itself is unchanged: its
    adjacency graph then holds only superpixels that touch on kept land, so it joins only those, and a patch with
    no kept-land neighbour stays a stand of its own, below merge.min_area_ha if it is small, reported as isolated.
    This is how "merge only where possible" is read; no merge rule is added or dropped. The merge stage measures,
    on the superpixel image it reads, the kept land left without a superpixel, the superpixel area off kept land and
    the area left out as small patches, puts them in merge_diagnostics under kept_land, and warns when either
    shortfall is above zero. config_fingerprint leaves both keys out of the hashed segmentation block while they
    are false, so no existing fingerprint moves, the 14 _repro configs among them, and a config that sets either
    to true gets a new one. Off, the segmentation stage makes the same Earth Engine calls, with the same arguments
    and in the same order, as before the change (tests/test_segmentation_off_golden.py holds them as recorded from
    the stage at commit 983dbe7, for three shipped configs); its metadata gains the key mask_before_snic. Guards:
    with the setting on, segmentation.size must be at least 2 (touching seed pixels are one seed to SNIC), and an
    ROI with no kept land fails with a plain message. The masked path has not run in batch. Its requests are
    checked offline against the algorithm signatures earthengine-api ships (tests/test_mask_before_snic_ee_graph.py);
    what Earth Engine does with them is what scripts/check_snic_on_kept_land.py measures, read-only on a cached
    run, before any batch run with the setting on: whether SNIC leaves masked pixels unlabelled and grows no superpixel across them, whether the seeds reach
    every kept pixel, whether touching seed pixels make one superpixel, whether seedGrid is SNIC's own grid,
    whether SNIC still uses size once given seeds, and what connectedComponents and connectedPixelCount count
    against maxSize. Its first run (14 Oct 2026, Kendujhar's box, before the clip to the ROI;
    docs/reproducibility/snic_on_kept_land_kendujhar.json) found superpixels in more than one piece: 2,758 pieces
    for 2,755 superpixels, each count one too high for a histogram key "null". scripts/check_split_superpixels.py
    then found 3 of 2,754 superpixels each in two pieces, all cut by the ROI edge
    (docs/reproducibility/snic_split_superpixels_kendujhar.json): kept land was not clipped to the ROI, the cached
    mask's pixels reach past the ROI edge, so SNIC grew each into a strip of kept land one pixel wide just outside
    it, and the clip of its output removed the strip that joined the two parts. The clip of kept land to the ROI
    is the fix (Jaskaran, 15 Oct 2026). It applies with the setting on only and adds no setting: no segmentation
    asset with the setting on existed, so no cached asset describes the path without the clip. With the clip, the
    two checks ran again read-only on 15 Oct 2026, for the segmentation of odisha_v120_3ha_squares_kendujhar_keptland
    and of sanjay_van_baseline_keptland, every line as expected: no superpixel in more than one piece (2,744 and
    1,200 superpixels), none of SNIC's labels outside the ROI (where SNIC on the unmasked stack labels 1,762 and
    1,686 pixels), every kept pixel labelled, and the largest superpixel 153 and 389 px against the merge's
    component caps of 480 and 1,320 px (docs/reproducibility/snic_on_kept_land_*_keptland.json,
    snic_split_superpixels_*_keptland.json). For the field comparison the setting changes two things, declared
    separately before any run with it on: a plot on land the mask removes is in no stand (14 of the 267 Odisha plots inside the boxes), and
    the rotation null as coded requires every plot that has a stand to land on a stand after the move, which
    stands on kept land only make far rarer.
  alternatives_considered:
  - >-
    Keep SNIC and the merge on the whole area, and type each stand on means over its kept pixels only, with a
    minimum share of kept land before a stand is typed (Claude (chat)'s recommendation of 14 Oct 2026): not chosen
  - >-
    Clip the stands to kept land after the merge: not chosen. The superpixels would still be drawn across the edge
    between kept and removed land, so stand boundaries inside the forest would follow lines drawn partly on
    removed land
  - >-
    Mask the stack and keep SNIC's own seed grid: not done. A patch of kept land that no grid point falls in and
    that touches no other kept land would get no superpixel, and which patches that hits would depend on where the
    grid falls, not on the land
  - >-
    Keep every kept patch, however small, as a stand of its own: available (drop_kept_patches_below_min_area
    false). In the four Odisha box areas, kept land read from the explorer data (the land-cover shapes of the box
    runs' masking output, 8-connected, on the cached EPSG:4326 grid, so approximate) forms 709 patches, 651 of
    them under 1 ha, 432 under 0.1 ha; together they hold 50 ha of 5,394 ha of kept land, and none of the 253 plots
    on kept land. Each would be a stand of its own and a row of its own in the k-means fit, which takes one row
    per stand however small
  - >-
    Keep the small patches as stands but leave them out of the k-means fit, and label them afterwards: not
    built. It needs a change to the clustering stage and still puts some 650 fragments on the stand map
  - >-
    After the clip of SNIC's outputs to the ROI, number each connected piece of a superpixel as a superpixel of its
    own: not chosen (Jaskaran, 15 Oct 2026). It removes the pieces, not their cause: SNIC would still draw
    superpixels partly on land outside the ROI
  - >-
    Accept the pieces (on Kendujhar's box, 3 of 2,754 superpixels, each piece cut off 1 or 2 pixels): not chosen
    (Jaskaran, 15 Oct 2026)
  - >-
    Clip SNIC's input to the ROI with the setting off as well: not done (Jaskaran, 15 Oct 2026: only when
    segmentation.mask_before_snic is on). It would change the superpixels of every whole-area run under an
    unchanged fingerprint. Whether SNIC cuts superpixels at the ROI edge with the setting off has not been checked
  - >-
    Change segmentation in place, with no setting: not done. Every existing config's superpixels would change
    under an unchanged cache fingerprint, and the cached assets would no longer be what the config describes
  - >-
    Add the settings as ordinary segmentation fields: not done. config_fingerprint hashes the whole
    segmentation block, defaults included, so all 14 _repro fingerprints would change at once and their saved
    assets could no longer be found by name
  rationale: >-
    Jaskaran asked whether the pipeline masks non-forest pixels before SNIC, as he understood it to. It did not:
    src/fmu/stages/segmentation.py read no mask in any of its commits, and habitat_mask was used only by clustering
    and metrics (dn-optical-features-over-whole-roi-mask-at-clustering, DEC-014). His decision, 14 Oct 2026: "we
    need to change this we need to mask before snic and merge only where possible". The settings keep the earlier
    behaviour reproducible; the explicit seeds and the measured coverage are there because a stand map that
    silently leaves out kept land, by an accident of the seed grid, is the kind of silent loss this pipeline
    reports rather than hides (spec-component-cap-derived). Whether the box configs leave out small patches is
    Jaskaran's to decide, with the counts above, before they run. The clip to the ROI is his answer of 15 Oct 2026
    to question 1 of docs/handoff/2026-10-14-round3.md: "clip kept land (and so SNIC's input and seeds) to the ROI
    before SNIC, only when segmentation.mask_before_snic is on. Use the same clip as the output clip, so both treat
    edge pixels the same way. No new setting: no kept-land segmentation asset exists yet." Review C17 (19 Oct
    2026; added here 20 Oct 2026, round 13): the checks of 15 Oct 2026 count pieces on the label raster, which
    still holds the ROI's edge pixels the clip keeps, those the ROI only partly covers. The exported vector
    layers keep only the pixels whose centre is inside the ROI (reduceToVectors), so a superpixel or stand drawn
    through such pixels can still come out in more than one polygon. In the layers of the per-step runs of
    record (docs/reproducibility/r9_runs and round12_runs, committed or off git with their SHA-256 checked) 0 to
    14 superpixels and 0 to 7 stands per run are in more than one polygon (two, but for one superpixel in three
    in each of the 10 ha hand-crafted runs of Dhenkanal and Kendujhar); the smaller pieces lie within 5.2 m of the
    ROI's edge, but for a few stray pieces of 1 to 41 pixels against a line a multiple of 256 pixels from the ROI's
    south-west pixel corner (4 superpixels and 2 stands in the 10 km tile, and 1 superpixel in each of three
    AlphaEarth layers), which the review reads as a line between Earth Engine's computation tiles. The joins key
    on stand_lbl, so no score changes; whether to change anything is put to Jaskaran.
  evidence:
  - path: src/fmu/stages/segmentation.py
    what: >-
      run(): kept land from habitat_mask when the setting is on, and the plain failure when there is none;
      _zscore_per_band and _rms_adjacent_distance take `within`; SNIC on the masked stack with explicit seeds;
      both outputs masked to kept land; validate() asks for habitat_mask only with the setting on; metadata keys
      mask_before_snic and kept_patch_min_pixels
  - path: src/fmu/utils/kept_land.py
    what: >-
      kept_land(), kept_land_in_roi() (the clip to the ROI), seeds_on_kept_land(), kept_land_coverage(), the
      reasons for each, and what the check script found
  - path: src/fmu/stages/merge.py
    what: 'kept_land_coverage on the image the merge reads; merge_diagnostics["kept_land"]; _kept_land_warnings'
  - path: src/fmu/config.py
    what: >-
      SegmentationParams.mask_before_snic and drop_kept_patches_below_min_area, default false, their validator,
      and Config.kept_patch_min_pixels()
  - path: src/fmu/utils/caching.py
    what: _OMITTED_AT_DEFAULT holds both keys at false
  - path: tests/test_mask_before_snic.py
    what: >-
      Fingerprints off and on; the guards; the mask is made before segmentation; with the setting off nothing reads
      the mask and nothing is masked; with it on, which image each statistic is taken over, what SNIC is given,
      that small patches are counted as SNIC joins pixels, and that the outputs are masked; that kept land is
      clipped to the ROI with the outputs' own clip, and that the stage makes one analysis grid; the coverage is
      counted on the label image's own pixels, on kept land clipped to the ROI; the merge on two patches that do not touch makes no merge and reports the
      small one as isolated; the coverage warnings
  - path: tests/test_segmentation_off_golden.py
    what: The default path's calls, against those recorded from the stage at commit 983dbe7
  - path: tests/test_mask_before_snic_ee_graph.py
    what: The masked path and the coverage check built with the real Earth Engine client, offline
  - path: scripts/check_snic_on_kept_land.py
    what: The read-only check on Earth Engine to run before any batch run with the setting on
  - path: docs/reproducibility/snic_on_kept_land_kendujhar.json
    what: The read-only check of 14 Oct 2026 on Kendujhar's box run, before the clip
  - path: docs/reproducibility/snic_split_superpixels_kendujhar.json
    what: >-
      The read-only follow-up of 14 Oct 2026 (scripts/check_split_superpixels.py): the three superpixels in two
      pieces, and the ROI edge cutting each
  - path: docs/reproducibility/snic_on_kept_land_kendujhar_keptland.json
    what: >-
      The two checks on the fixed code, 15 Oct 2026, read-only, for Kendujhar's kept-land config; with
      snic_split_superpixels_kendujhar_keptland.json and the two *_sanjay_van_baseline_keptland.json files for
      Sanjay Van's
  - path: tests/test_check_snic_on_kept_land.py
