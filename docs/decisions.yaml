- id: field-regroup-reused-upstream-cache
  title: >-
    Phase 3: the regroup reused stored upstream results, and every departure from plan is listed
  decision: >-
    When the 3 ha stands went from 6 to 5 types, the earlier stages' cached assets were copied to the
    new cache key with copy_upstream_cache.py instead of being recomputed. The script refuses to run unless
    the two configs differ in nothing but clustering.k. PHASE3_STATUS.md lists this with seven other corrections
    and departures from plan.
  alternatives_considered:
  - >-
    Recomputing every stage from scratch under the new cache key (what the cache does by default)
  rationale: >-
