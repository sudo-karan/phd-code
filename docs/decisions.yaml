- id: dn-snic-nirv-not-ndvi-derived-in-stage
  title: Optical SNIC signal is NIRv, not NDVI, derived inside the segmentation stage
  decision: >-
    Use composite_nirv = (B8/10000) x NDVI as the optical signal for SNIC, and compute it inside the segmentation
    stage from B4/B8 of the Sentinel-2 composite (2017-2022).
  alternatives_considered:
  - NDVI as the SNIC optical signal (the note calls it 'a default-to-NDVI choice')
  - >-
    nirv_mean from features_optical (named as a different quantity: a harmonic-regression intercept over
    6 years)
  - >-
    re-export or per-config code branches (named as what the in-stage derivation avoids)
  rationale: >-
    NDVI saturates in dense canopy, so a forest interior such as Sanjay Van would map to one NDVI value
    and hide the within-forest structure SNIC needs. NIRv keeps responding because NIR alone is unbounded.
    Deriving it in the stage makes it available identically to the baseline and nirv_dual configs, and
    it gives a spatial signal from a single median composite, which the note says is good for boundaries.
  evidence:
  - path: docs/design_notes.md
    what: Lines 382-395.
  - path: src/fmu/stages/segmentation.py
    what: >-
