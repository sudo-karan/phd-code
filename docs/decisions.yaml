- id: spec-merge-missing-data-rules
  title: >-
    How the merge handles missing data: valid-pixel weights, a two-criterion floor, nulls below half coverage
  decision: >-
    Stand means are weighted by the number of valid pixels for each criterion, not by total pixels. A
    merge needs at least min_defined_criteria (2) criteria defined on both sides, in pass 1 and under pass 2's
    relaxed tolerances alike, so a pair that falls short never merges on its attributes: in pass 2 a region below
    min_area_ha whose neighbours all fall short, or fail the relaxed tolerances, can join one only by the
    shared-edge fallback, which ignores attributes, and two regions both at or above the minimum do not merge. A
    stand with a band valid on under min_frac_valid (0.5) of its pixels reports null for that band. Reworded 20 Oct
    2026 (round 13, review C13): this said that pairs that fall short "go to pass 2", and the rationale that
    refusing them outright would leave them to the blinder shared-edge rule, as if pass 2 could still match them
    on their attributes; compare() applies the floor under the relaxed tolerances too (at the review's commit
    5caae3f and now), so the shared-edge fallback is the only way such a pair merges. Nothing in the code changed.
  alternatives_considered:
  - 'Weighting by total pixels: named and rejected'
  - >-
    Refusing to merge pairs with too few defined criteria at all: named and rejected. The code refuses them in the
    attribute tests of both passes, and the shared-edge fallback still takes them
  - >-
    Lowering min_defined_criteria to fit a shorter criteria list: ruled out in PHASE1_STATUS.md
  rationale: >-
    region_merge.py: weighting by total pixels would let a region with no canopy height inherit one from
    its neighbour for land that was never measured, so the merge would invent data; 14 of the 1249 superpixels
    in the committed baseline run have no canopy height at all (ETH no-data). One criterion is too weak
    a test to justify a merge on attributes, in either pass; the shared-edge fallback still lets a region below the
    minimum join such a neighbour.
