[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmu"
version = "0.1.0"
description = "Forest Management Units: multi-sensor pipeline for delineating ecologically coherent forest stands from open satellite data."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Jaskaran Singh"},
]
keywords = ["remote-sensing", "earth-engine", "forestry", "phenology", "segmentation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    # GEE
    "earthengine-api>=1.0.0",
    "geemap>=0.32.0",
    # Config
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
    # Geospatial helpers
    "rasterio>=1.3.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    # General
    "numpy>=1.26",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    # CLI
    "click>=8.1",
    # Logging
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1.9",
    "mypy>=1.7",
    "ipykernel>=6.27",
    "jupyter>=1.0",
]

[project.scripts]
fmu = "fmu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# Default: skip live GEE tests. Run them explicitly with `pytest -m live_gee`.
addopts = "-v --tb=short -m 'not live_gee'"
markers = [
    "live_gee: tests that make real Earth Engine API calls (slow; require auth)",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
