# Sanjay Van variant: NIRv + dual harmonic phenology features.
# Compared against the baseline (NDVI + single annual harmonic) by the
# metrics module. See DEC-013 in decisions.md.
#
# Everything else identical to sanjay_van_baseline.yaml. Only the
# `features_optical` section and `name` differ.

name: sanjay_van_nirv_dual
description: NIRv + dual harmonic variant of the Sanjay Van baseline (DEC-013).

roi:
  name: sanjay_van
  roi_file: aois/sanjay_van.geojson

dates:
  phenology:
    start: 2017-01-01
    end: 2022-12-31
  radar:
    start: 2017-01-01
    end: 2022-12-31
  optical_composite:
    start: 2017-01-01
    end: 2022-12-31
  climate:
    start: 1991-01-01
    end: 2020-12-31

datasets:
  phenology_collection: COPERNICUS/S2_SR_HARMONIZED
  optical_composite_collection: COPERNICUS/S2_SR_HARMONIZED
  radar_collection: COPERNICUS/S1_GRD
  canopy_height: users/nlang/ETH_GlobalCanopyHeight_2020_10m_v1
  dem: NASA/NASADEM_HGT/001
  # CoRE Stack LULC_v4: FOLDER of per-year images, band 'predicted_label'
  # (same legend/handling as the baseline; see that config for details).
  indiasat: "projects/corestack-trees/assets/LULC_v4"
  worldcover: ESA/WorldCover/v200          # habitat fallback where IndiaSAT is unavailable
  water: JRC/GSW1_4/GlobalSurfaceWater
  climate: UCSB-CHG/CHIRPS/PENTAD

cloud_mask:
  max_cloud_pct: 20.0
  drop_scl_classes: [3, 8, 9, 10]

data_load:
  s1_orbit: ASCENDING
  s1_polarizations: [VV, VH]
  s1_instrument_mode: IW
  s2_composite_reducer: median

masking:
  # Habitat = IndiaSAT Trees (6) + Shrubs/Scrubs (12); identical to baseline so
  # the mask is the same across configs (deck Stage 1, single-phase).
  indiasat_habitat_classes: [6, 12]
  indiasat_class_band: predicted_label    # CoRE Stack LULC_v4 class band name
  indiasat_year_min: 2017                 # deck 2017-2022 hydrological years
  indiasat_year_max: 2021
  keep_worldcover_classes: [10, 20, 30]   # WorldCover fallback where IndiaSAT is unavailable
  jrc_water_occurrence_threshold: 50.0    # JRC water for distance-to-water only

# Variant phenology features: NIRv + dual harmonic. time_reference matches
# baseline so phase_annual values stay directly comparable.
features_optical:
  index: nirv
  harmonic_mode: dual
  include_trend: true
  time_reference: 2017-01-01

# Radar features identical to baseline; only the optical variant differs.
features_radar:
  percentiles: [10, 50, 90]
  include_iqr: true
  include_cross_pol_contrast: true

# Structure features identical to baseline.
features_structure:
  include_neighborhood_stats: true
  neighborhood_kernel_size: 3

# Static features identical to baseline.
features_static:
  include_climate: true
  max_water_distance_pixels: 1000

# Same six-band stack as the baseline default, but spelled out because
# features_optical.index: nirv renames the harmonic bands `nirv_*` — the
# default's `ndvi_amplitude_annual` does not exist in this arm. The phenology
# slot is the arm's own index, which is the point of the comparison: baseline
# segments on the NDVI amplitude, this one on the NIRv amplitude.
segmentation:
  size: 10
  compactness: 0.5
  connectivity: 8
  neighborhood_size: 128
  normalize_inputs: true
  normalize_distance_scale: true
  input_bands:
    - {source: s2_composite,       band: B4_median}
    - {source: s2_composite,       band: B8_median}
    - {source: structure_features, band: canopy_height}
    - {source: structure_features, band: canopy_height_std}
    - {source: optical_features,   band: nirv_amplitude_annual}
    - {source: radar_features,     band: vv_minus_vh_median}

# Same merge rule as the baseline, but the composition criterion has to be
# spelled out for the same reason input_bands did: features_optical.index: nirv
# renames the harmonic bands, so the default's `ndvi_amplitude_annual` does not
# exist here. Tolerances are unchanged — the amplitude of NIRv and of NDVI are
# not the same quantity, so a shared tolerance is an assumption, and this arm
# is where that assumption gets tested rather than asserted.
merge:
  criteria:
    - {source: structure_features, band: canopy_height,        tolerance: 2.00}
    - {source: structure_features, band: canopy_height_std,    tolerance: 0.45}
    - {source: optical_features,   band: nirv_amplitude_annual, tolerance: 0.030}

clustering:
  k: 6
  seed: 42
  skewness_threshold: 1.0

normalization:
  method: robust

features:
  optical_harmonic: true
  radar: true
  canopy_height: true
  terrain: true

# Export identical to baseline so vector outputs are comparable.
export:
  export_geotiff: true
  export_gee_asset: false
  analysis_scale_m: 10
  drive_folder: fmu_exports
  export_vector_snic: true
  export_vector_dissolved: true
  vector_formats: [shp, geojson]
  vector_min_stand_pixels: 4

metrics:
  reference_config_name: sanjay_van_baseline  # variant compares against baseline
  n_comparison_samples: 10000
  n_silhouette_samples_per_cluster: 833
  # Same three attributes as the baseline default, respelled for index: nirv.
  # canopy_height is a merge criterion, so R^2 on it is partly circular — it is
  # reported because it is the number the literature quotes (Xiong et al. 2024:
  # 81.80% on mean canopy height), not as evidence.
  r2_attributes:
    - {source: structure_features, band: canopy_height,     held_out: false}
    - {source: optical_features,   band: nirv_trend,        held_out: true}
    - {source: structure_features, band: canopy_height_max, held_out: true}
