# Sanjay Van variant: NIRv + dual harmonic phenology features.
# Compared against the baseline (NDVI + single annual harmonic) by the
# metrics module. See DEC-013 in decisions.md.
#
# Everything else identical to sanjay_van_baseline.yaml. Only the
# `features_optical` section and `name` differ.

name: sanjay_van_nirv_dual
description: NIRv + dual harmonic variant of the Sanjay Van baseline (DEC-013).

roi:
  name: sanjay_van
  roi_file: aois/sanjay_van.geojson

dates:
  phenology:
    start: 2017-01-01
    end: 2022-12-31
  radar:
    start: 2017-01-01
    end: 2022-12-31
  optical_composite:
    start: 2017-01-01
    end: 2022-12-31
  climate:
    start: 1991-01-01
    end: 2020-12-31

datasets:
  phenology_collection: COPERNICUS/S2_SR_HARMONIZED
  optical_composite_collection: COPERNICUS/S2_SR_HARMONIZED
  radar_collection: COPERNICUS/S1_GRD
  canopy_height: users/nlang/ETH_GlobalCanopyHeight_2020_10m_v1
  dem: NASA/NASADEM_HGT/001
  worldcover: ESA/WorldCover/v200
  water: JRC/GSW1_4/GlobalSurfaceWater
  nightlights: NOAA/VIIRS/DNB/MONTHLY_V1/VCMSLCFG
  open_buildings: GOOGLE/Research/open-buildings/v3/polygons
  climate: UCSB-CHG/CHIRPS/PENTAD

cloud_mask:
  max_cloud_pct: 20.0
  drop_scl_classes: [3, 8, 9, 10]

data_load:
  s1_orbit: ASCENDING
  s1_polarizations: [VV, VH]
  s1_instrument_mode: IW
  s2_composite_reducer: median

masking:
  ndvi_min: 0.2
  nightlights_threshold: 30.0
  keep_worldcover_classes: [10, 20, 30]
  jrc_water_occurrence_threshold: 50.0
  open_buildings_confidence: 0.7
  use_viirs: true            # match baseline; keep mask identical across configs
  use_open_buildings: true   # match baseline

# Variant phenology features: NIRv + dual harmonic. time_reference matches
# baseline so phase_annual values stay directly comparable.
features_optical:
  index: nirv
  harmonic_mode: dual
  include_trend: true
  time_reference: 2017-01-01

# Radar features identical to baseline; only the optical variant differs.
features_radar:
  percentiles: [10, 50, 90]
  include_iqr: true
  include_cross_pol_contrast: true

# Structure features identical to baseline.
features_structure:
  include_neighborhood_stats: true
  neighborhood_kernel_size: 3

# Static features identical to baseline.
features_static:
  include_climate: true
  max_water_distance_pixels: 1000

segmentation:
  size: 10
  compactness: 0.5
  connectivity: 8
  neighborhood_size: 128
  normalize_inputs: true

clustering:
  k: 6
  n_training_samples: 10000
  seed: 42
  skewness_threshold: 1.0
  superpixel_max_size: 1024

normalization:
  method: robust

features:
  optical_harmonic: true
  radar: true
  canopy_height: true
  terrain: true

# Export identical to baseline so vector outputs are comparable.
export:
  export_geotiff: true
  export_gee_asset: false
  analysis_scale_m: 10
  drive_folder: fmu_exports
  export_vector_snic: true
  export_vector_dissolved: true
  vector_formats: [shp, geojson]
  vector_min_stand_pixels: 4

metrics:
  reference_config_name: sanjay_van_baseline  # variant compares against baseline
  n_comparison_samples: 10000
  n_silhouette_samples_per_cluster: 833
