# ODISHA ON SQUARES, KENDUJHAR district, 3 ha stand ceiling, feature vector (v120).
#
# Copy of configs/odisha_v120_3ha_kendujhar_repro.yaml. FOUR things differ, each explained below;
# everything else (dates, datasets, masking, features, SNIC bands and seed spacing, merge
# criteria, tolerances and area bounds, k = 5, seed) is identical, so a difference from that run
# comes from the area and the merge rule, not from the method.
#
# 1. name and description.
# 2. roi: aois/odisha_squares_kendujhar.geojson instead of aois/odisha_habitations_kendujhar.geojson.
#    Per habitation with >= 5 plots, a north-up box around its plots widened by 300 m on every
#    side, instead of the plots' convex hull plus 300 m (odisha_script/odisha_squares_0_aois.py).
#    Jaskaran's decision of 13 Oct 2026 (PR #43, option (b)): the hull outlines are blobs drawn
#    from the plots themselves, and the stands stop at their edge; on a box the pipeline covers a
#    whole rectangle of landscape around the plots. The same 267 plots fall inside.
# 3. merge.pass2_skip_at_min_area: true. The merge rule of docs/decisions.yaml,
#    spec-merge-pass2-skip-at-minimum ("configs of the final round set it explicitly"). With it
#    on, the config has its own cache fingerprint.
# 4. export.drive_folder: fmu_exports_odisha_squares, so these files do not mix with the
#    Phase 2 and _repro exports.
#
# Run only through odisha_script/run_config_passes.sh, as the other Odisha configs (CLAUDE.md,
# "Earth Engine"). The analysis of these stands against the FES plots is declared in
# odisha_script/PHASE_SQUARES_PREDECLARED.md, committed before any of these runs.

name: odisha_v120_3ha_squares_kendujhar
description: Odisha KENDUJHAR, v120 hand-crafted method, stands capped at 3 ha, run on boxes around the villages' plots.

roi:
  name: odisha_squares_kendujhar
  roi_file: aois/odisha_squares_kendujhar.geojson

dates:
  phenology:
    start: 2017-01-01
    end: 2022-12-31
  radar:
    start: 2017-01-01
    end: 2022-12-31
  optical_composite:
    start: 2017-01-01
    end: 2022-12-31
  climate:
    start: 1991-01-01
    end: 2020-12-31

datasets:
  phenology_collection: COPERNICUS/S2_SR_HARMONIZED
  optical_composite_collection: COPERNICUS/S2_SR_HARMONIZED
  radar_collection: COPERNICUS/S1_GRD
  canopy_height: users/nlang/ETH_GlobalCanopyHeight_2020_10m_v1
  dem: NASA/NASADEM_HGT/001
  indiasat: "projects/corestack-trees/assets/LULC_v4"
  worldcover: ESA/WorldCover/v200
  water: JRC/GSW1_4/GlobalSurfaceWater
  climate: UCSB-CHG/CHIRPS/PENTAD

cloud_mask:
  max_cloud_pct: 20.0
  drop_scl_classes: [3, 8, 9, 10]

data_load:
  s1_orbit: ASCENDING
  s1_polarizations: [VV, VH]
  s1_instrument_mode: IW
  s2_composite_reducer: median

masking:
  indiasat_habitat_classes: [6, 12]
  indiasat_class_band: predicted_label
  indiasat_year_min: 2017
  indiasat_year_max: 2021
  keep_worldcover_classes: [10, 20, 30]
  jrc_water_occurrence_threshold: 50.0

features_optical:
  index: ndvi
  harmonic_mode: single
  include_trend: true
  time_reference: 2017-01-01

features_radar:
  percentiles: [10, 50, 90]
  include_iqr: true
  include_cross_pol_contrast: true

features_structure:
  include_neighborhood_stats: true
  neighborhood_kernel_size: 3

features_static:
  include_climate: true
  max_water_distance_pixels: 1000

# The pre-Odisha six-band stack.
segmentation:
  size: 6
  compactness: 0.5
  connectivity: 8
  neighborhood_size: 128
  normalize_inputs: true
  normalize_distance_scale: true
  input_bands:
    - {source: s2_composite,       band: B4_median}
    - {source: s2_composite,       band: B8_median}
    - {source: structure_features, band: canopy_height}
    - {source: structure_features, band: canopy_height_std}
    - {source: optical_features,   band: ndvi_amplitude_annual}
    - {source: radar_features,     band: vv_minus_vh_median}

# The pre-Odisha three-criterion merge. Tolerances are the Sanjay Van values.
merge:
  enabled: true
  criteria:
    - {source: structure_features, band: canopy_height,         tolerance: 2.00}
    - {source: structure_features, band: canopy_height_std,     tolerance: 0.45}
    - {source: optical_features,   band: ndvi_amplitude_annual, tolerance: 0.030}
  min_defined_criteria: 2
  min_area_ha: 1.0
  max_area_ha: 3.0
  relax_factor: 1.75
  pass2_skip_at_min_area: true

clustering:
  k: 5
  seed: 42
  skewness_threshold: 1.0

normalization:
  method: robust

features:
  optical_harmonic: true
  radar: true
  canopy_height: true
  terrain: true

export:
  export_geotiff: true
  export_gee_asset: false
  analysis_scale_m: 10
  drive_folder: fmu_exports_odisha_squares
  export_vector_merged: true
  export_vector_snic: true
  export_vector_dissolved: true
  vector_formats: [shp, geojson]
  vector_min_stand_pixels: 4

metrics:
  reference_config_name: null
  n_comparison_samples: 10000
  n_silhouette_samples_per_cluster: 833
