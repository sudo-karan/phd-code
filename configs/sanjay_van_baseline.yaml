# Sanjay Van baseline config. Locked reference; don't modify in place;
# new ideas become new YAML files compared against this.
#
# Approximates the working notebook pipeline (S2_SR_HARMONIZED, k=6, NDVI,
# single annual harmonic) while applying the locked engineering decisions
# from phd-notebook/decisions.md; most notably robust scaling (DEC-003)
# in place of the notebook's zscore. Cross-config variants (HLS, auto-K,
# NIRv, dual harmonic, etc.) go in separate YAML files.

name: sanjay_van_baseline
description: Locked baseline for Sanjay Van.

roi:
  name: sanjay_van
  roi_file: aois/sanjay_van.geojson

# Single shared 2017-2022 window for every time-series feature, so they all
# rest on the same temporal support (deck v3.0, Stage 2). Phenology, radar,
# and the static composite SNIC sees all span 2017-2022.
# - climate: a 30-year standard normal for rainfall climatology, deliberately
#   NOT the 6-year feature window (a climatology needs a long baseline).
dates:
  phenology:
    start: 2017-01-01
    end: 2022-12-31
  radar:
    start: 2017-01-01
    end: 2022-12-31
  optical_composite:
    start: 2017-01-01
    end: 2022-12-31
  climate:
    start: 1991-01-01
    end: 2020-12-31

datasets:
  phenology_collection: COPERNICUS/S2_SR_HARMONIZED
  optical_composite_collection: COPERNICUS/S2_SR_HARMONIZED
  radar_collection: COPERNICUS/S1_GRD
  canopy_height: users/nlang/ETH_GlobalCanopyHeight_2020_10m_v1
  dem: NASA/NASADEM_HGT/001
  # CoRE Stack LULC_v4: a FOLDER of per-year single-band images
  # (lulc_v4_2017_2018 ... lulc_v4_2023_2024), band 'predicted_label'.
  # Same legend as IndiaSAT (6 = Trees, 12 = Shrubs/Scrubs). masking.py builds
  # the annual collection from these images. (The original
  # projects/ee-indiasat/... asset is private; this one is the accessible mirror.)
  indiasat: "projects/corestack-trees/assets/LULC_v4"
  worldcover: ESA/WorldCover/v200          # habitat fallback where IndiaSAT is unavailable
  water: JRC/GSW1_4/GlobalSurfaceWater
  climate: UCSB-CHG/CHIRPS/PENTAD

cloud_mask:
  max_cloud_pct: 20.0
  drop_scl_classes: [3, 8, 9, 10]  # cloud_shadow, cloud_med, cloud_high, thin_cirrus

data_load:
  s1_orbit: ASCENDING
  s1_polarizations: [VV, VH]
  s1_instrument_mode: IW
  s2_composite_reducer: median  # single static image for SNIC

masking:
  # Habitat = IndiaSAT Trees (6) + Shrubs/Scrubs (12), single-phase (deck Stage 1).
  # Water/crops/built-up are excluded by not being in this set.
  indiasat_habitat_classes: [6, 12]
  indiasat_class_band: predicted_label    # CoRE Stack LULC_v4 class band name
  # Deck's "2017-2022 hydrological years" = start years 2017..2021 (the five
  # maps lulc_v4_2017_2018 .. lulc_v4_2021_2022). Widen indiasat_year_max to
  # 2023 to also fold in the newer 2022_2023 / 2023_2024 maps.
  indiasat_year_min: 2017
  indiasat_year_max: 2021
  keep_worldcover_classes: [10, 20, 30]   # WorldCover fallback where IndiaSAT is unavailable
  jrc_water_occurrence_threshold: 50.0    # JRC water for distance-to-water only (>= % = permanent)

# Phenology features from the S2 collection. The baseline mirrors the
# locked notebook approach: NDVI + single annual harmonic. The variant
# config sanjay_van_nirv_dual.yaml uses NIRv + dual harmonic for comparison
# (see DEC-013).
features_optical:
  index: ndvi
  harmonic_mode: single
  include_trend: true
  # Reference epoch for the harmonic regression's time variable t. Shifts
  # the numeric value of phase_annual by a constant; does NOT affect amplitude,
  # trend, or any clustering outcome. Keep identical across configs that you
  # want to compare phases between (the metrics stage relies on this).
  time_reference: 2017-01-01

# Radar features from the S1 collection. Statistical reducers over the
# 2017-2022 window (no harmonic). VV-VH dB difference replaces notebook's
# VV/VH (which was a literal division of dB values, not mathematically
# meaningful; see DEC-016).
features_radar:
  percentiles: [10, 50, 90]
  include_iqr: true
  include_cross_pol_contrast: true

# Structure features from ETH Global Canopy Height. Adds neighborhood
# stats (std + max in 3x3 window) for local heterogeneity.
features_structure:
  include_neighborhood_stats: true
  neighborhood_kernel_size: 3

# Static features: terrain (elevation, slope, aspect), distance to water,
# mean annual rainfall (CHIRPS climatology).
features_static:
  include_climate: true
  max_water_distance_pixels: 1000  # 10 km cap at 10m scale

# input_bands is left at the code default (see _DEFAULT_SNIC_INPUT_BANDS in
# src/fmu/config.py): B4_median, B8_median, canopy_height, canopy_height_std,
# ndvi_amplitude_annual, vv_minus_vh_median. Six bands over ~four independent
# axes — optical colour, vertical structure, canopy roughness, phenology, radar.
# It is not repeated here so the default cannot drift from the shipped arm; set
# input_bands explicitly only when running a segmentation-feature experiment.
segmentation:
  size: 10
  compactness: 0.5
  connectivity: 8
  neighborhood_size: 128
  normalize_inputs: true
  normalize_distance_scale: true

clustering:
  k: 6
  seed: 42
  skewness_threshold: 1.0   # log-transform features with |skew| > this (DEC-004)

normalization:
  method: robust  # DEC-003: median/IQR scaling. This is also the schema default.

features:
  optical_harmonic: true
  radar: true
  canopy_height: true
  terrain: true

export:
  export_geotiff: true
  export_gee_asset: false
  analysis_scale_m: 10
  drive_folder: fmu_exports        # all Drive exports land here
  # Vector outputs (v1.1.0). One polygon-per-SNIC-superpixel layer (debugging /
  # methodology) and one dissolved-cluster layer (forester-facing management
  # units). Each layer exported in every listed format. See docs/outputs.md.
  # The merged-stand layer: the unit SNIC + merge delineate.
  # Written only when merge.enabled; without merge it would duplicate
  # stands_snic exactly.
  export_vector_merged: true
  export_vector_snic: true
  export_vector_dissolved: true
  vector_formats: [shp, geojson]    # SHP gets minimal schema, GeoJSON gets full
  vector_min_stand_pixels: 4        # drop dissolved stands smaller than this

metrics:
  reference_config_name: null  # baseline has no reference; intrinsic silhouette only
  n_comparison_samples: 10000
  n_silhouette_samples_per_cluster: 833
