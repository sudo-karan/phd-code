# Sanjay Van baseline config. Locked reference — don't modify in place;
# new ideas become new YAML files compared against this.
#
# Mirrors the working notebook pipeline: S2_SR_HARMONIZED, k=6, zscore,
# single annual harmonic. HLS / auto-K / robust scaling / dual harmonic
# all go in separate configs later.

name: sanjay_van_baseline
description: Locked baseline for Sanjay Van.

roi:
  name: sanjay_van
  roi_file: aois/sanjay_van.geojson

# Three windows for three jobs. Don't unify them.
# - phenology: long, for stable harmonic fits.
# - radar: 2017-2021, density-consistent (S1B died Dec 2021, halving revisit).
# - optical_composite: one recent year for the static image SNIC sees.
dates:
  phenology:
    start: 2017-01-01
    end: 2024-12-31
  radar:
    start: 2017-01-01
    end: 2021-12-01
  optical_composite:
    start: 2023-01-01
    end: 2023-12-31

datasets:
  phenology_collection: COPERNICUS/S2_SR_HARMONIZED
  optical_composite_collection: COPERNICUS/S2_SR_HARMONIZED
  radar_collection: COPERNICUS/S1_GRD
  canopy_height: users/nlang/ETH_GlobalCanopyHeight_2020_10m_v1
  dem: NASA/NASADEM_HGT/001
  worldcover: ESA/WorldCover/v200
  water: JRC/GSW1_4/GlobalSurfaceWater
  nightlights: NOAA/VIIRS/DNB/MONTHLY_V1/VCMSLCFG

cloud_mask:
  max_cloud_pct: 20.0

masking:
  ndvi_min: 0.2
  nightlights_threshold: 30.0  # Delhi-calibrated, won't generalize
  keep_worldcover_classes: [10, 20, 30]  # trees, shrubs, grass
  jrc_water_occurrence_threshold: 50.0  # >= this% of months observed = permanent water

segmentation:
  size: 10
  compactness: 0.5
  connectivity: 8
  neighborhood_size: 128

clustering:
  k: 6
  n_training_samples: 5000
  seed: 42

normalization:
  method: zscore

features:
  optical_harmonic: true
  radar: true
  canopy_height: true
  terrain: true
  custom_csv: false

custom_csv_features: []

export:
  export_geotiff: true
  export_gee_asset: false
  analysis_scale_m: 10
