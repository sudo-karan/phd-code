# Sanjay Van embedding arm: cluster AlphaEarth's pretrained per-pixel
# embedding instead of the hand-crafted multi-sensor stack.
#
# AlphaEarth supplies the feature vector for both steps that see features: SNIC
# segments on the 64-band embedding, and k-means labels on it. What is held
# identical to sanjay_van_baseline.yaml is everything that is not the feature
# representation — same AOI, same 2017-2022 window, same SNIC hyperparameters
# (size 10, compactness 0.5), same k=6 / seed=42, same masking, and the same
# merge rule. So a difference the metrics stage reports is attributable to the
# representation, while the two arms still draw their own boundaries.
#
# The merge rule being shared is deliberate and is why features_structure and
# features_optical still run here (see below). It is what leaves *delineation*
# as the only thing differing between the arms — the thesis question. If each
# arm merged on its own features, differences in stand geometry would confound
# "different boundaries" with "different merge rules", and the thresholds would
# lose their physical units along with their meaning.
#
# The two arms therefore produce two different stand maps. There is no ground
# truth to declare one correct; they are compared on stability, held-out
# predictive power and geometry, not on agreement with a reference.
#
# AlphaEarth (GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL) is an annual ImageCollection;
# the features_embedding stage averages the 2017-2022 images to one embedding
# image. Google's dataset guidance explicitly recommends unsupervised clustering
# of these embeddings, which is what the clustering stage does.

name: sanjay_van_alphaearth
description: Embedding arm — clusters AlphaEarth Satellite Embedding vs the hand-crafted baseline.

roi:
  name: sanjay_van
  roi_file: aois/sanjay_van.geojson

# Same unified 2017-2022 window as the baseline. dates.phenology doubles as the
# collapse window for the annual embeddings (features_embedding averages the
# yearly images over it), so the embedding rests on the same temporal support
# as the hand-crafted features it is compared against.
dates:
  phenology:
    start: 2017-01-01
    end: 2022-12-31
  radar:
    start: 2017-01-01
    end: 2022-12-31
  optical_composite:
    start: 2017-01-01
    end: 2022-12-31
  climate:
    start: 1991-01-01
    end: 2020-12-31

datasets:
  phenology_collection: COPERNICUS/S2_SR_HARMONIZED
  optical_composite_collection: COPERNICUS/S2_SR_HARMONIZED
  radar_collection: COPERNICUS/S1_GRD
  canopy_height: users/nlang/ETH_GlobalCanopyHeight_2020_10m_v1
  dem: NASA/NASADEM_HGT/001
  # Habitat mask source, identical to baseline (CoRE Stack LULC_v4 folder).
  indiasat: "projects/corestack-trees/assets/LULC_v4"
  worldcover: ESA/WorldCover/v200
  water: JRC/GSW1_4/GlobalSurfaceWater
  climate: UCSB-CHG/CHIRPS/PENTAD
  # AlphaEarth Satellite Embedding: 64-band annual per-pixel embedding.
  embedding: GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL

cloud_mask:
  max_cloud_pct: 20.0
  drop_scl_classes: [3, 8, 9, 10]

data_load:
  s1_orbit: ASCENDING
  s1_polarizations: [VV, VH]
  s1_instrument_mode: IW
  s2_composite_reducer: median  # feeds SNIC (held identical to baseline)

masking:
  # Identical to baseline so the habitat mask is the same across arms.
  indiasat_habitat_classes: [6, 12]
  indiasat_class_band: predicted_label
  indiasat_year_min: 2017
  indiasat_year_max: 2021
  keep_worldcover_classes: [10, 20, 30]
  jrc_water_occurrence_threshold: 50.0

# Optical and structure params still matter here, but NOT for the feature
# vector — this arm segments and labels purely on the embedding. They matter
# because the **merge criteria** are held identical across arms: "what makes two
# adjacent patches one stand" is a fact about forestry, not about the sensor
# pipeline, and holding the merge rule constant is what leaves delineation as
# the only thing differing between the arms. So features_structure and
# features_optical run to supply canopy_height, canopy_height_std and
# ndvi_amplitude_annual to the merge gate.
#
# features_radar and features_static are read by nothing in this arm and do not
# run; their params are kept at baseline values so the file stays diffable and
# so re-enabling one gets the right parameters rather than silent defaults.
features_radar:
  percentiles: [10, 50, 90]
  include_iqr: true
  include_cross_pol_contrast: true

features_structure:
  include_neighborhood_stats: true
  neighborhood_kernel_size: 3

# Embedding feature source. Collapse the annual AlphaEarth images to one image
# by mean over the 2017-2022 window; keep all 64 bands.
features_embedding:
  collapse_reducer: mean
  band_names: null   # keep every embedding dimension (A00..A63)

# SNIC runs on the embedding, not on the hand-crafted bands. This arm is a
# fully independent pipeline: AlphaEarth draws its own boundaries and labels
# its own stands, and the two arms' stand maps are compared as products.
# Holding SNIC identical across arms (the earlier design) would have made the
# embedding answer only "which labels does k-means give inside boundaries the
# hand-crafted stack drew" — the delineation question, which is the thesis
# question, was never actually put to it.
#
# 64 bands vs 6 is exactly why normalize_distance_scale matters: without it,
# summed squared colour distance here is far larger than in the baseline, so
# compactness 0.5 would buy a much weaker spatial term. Dividing by the
# empirical RMS 4-neighbour distance makes the two comparable.
segmentation:
  size: 10
  compactness: 0.5
  connectivity: 8
  neighborhood_size: 128
  normalize_inputs: true
  normalize_distance_scale: true
  input_bands:
    - {source: embedding_features, band: "*"}   # all 64 dimensions

clustering:
  feature_source: embedding   # labels on the embedding; SNIC segments on it too
  k: 6
  seed: 42
  skewness_threshold: 1.0

normalization:
  method: robust

export:
  export_geotiff: true
  export_gee_asset: false
  analysis_scale_m: 10
  drive_folder: fmu_exports
  # The merged-stand layer: the unit SNIC + merge delineate.
  # Written only when merge.enabled; without merge it would duplicate
  # stands_snic exactly.
  export_vector_merged: true
  export_vector_snic: true
  export_vector_dissolved: true
  vector_formats: [shp, geojson]
  vector_min_stand_pixels: 4

metrics:
  # Compare the embedding clustering against the hand-crafted baseline: ARI,
  # NMI, Hungarian correspondence, agreement map, and the per-stand confidence
  # roll-up all come from this comparison.
  reference_config_name: sanjay_van_baseline
  n_comparison_samples: 10000
  n_silhouette_samples_per_cluster: 833
