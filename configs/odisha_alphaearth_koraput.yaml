# FULL SET, KORAPUT district. Copy of configs/odisha_alphaearth.yaml, identical except name, roi and,
# for AlphaEarth, reference_config_name. The 267-plot full set runs once per district because
# one AOI across four districts exceeds Earth Engine's 1 bn-pixel export cap (decision
# 2026-09-14). Every method parameter is unchanged from the pilot arm.

# Odisha Phase 2, embedding arm. Copied from sanjay_van_alphaearth.yaml.
#
# SNIC segments on all 64 AlphaEarth dimensions and k-means labels on them. The
# merge criteria are held IDENTICAL to odisha_v120_handcrafted.yaml -- three
# criteria including canopy_height_std -- which is deliberate: it leaves
# delineation as the only thing differing between this arm and the primary one.
# That is why features_structure and features_optical still run here.
#
# Everything that is not the feature representation (AOI, dates, masking, SNIC
# hyperparameters, merge rule, k, seed) matches the v120 arm.

name: odisha_alphaearth_koraput
description: Odisha Phase 2 embedding arm - AlphaEarth delineation, merge rule identical to the v120 arm.

roi:
  name: odisha_habitations_koraput
  roi_file: aois/odisha_habitations_koraput.geojson

dates:
  phenology:
    start: 2017-01-01
    end: 2022-12-31
  radar:
    start: 2017-01-01
    end: 2022-12-31
  optical_composite:
    start: 2017-01-01
    end: 2022-12-31
  climate:
    start: 1991-01-01
    end: 2020-12-31

datasets:
  phenology_collection: COPERNICUS/S2_SR_HARMONIZED
  optical_composite_collection: COPERNICUS/S2_SR_HARMONIZED
  radar_collection: COPERNICUS/S1_GRD
  canopy_height: users/nlang/ETH_GlobalCanopyHeight_2020_10m_v1
  dem: NASA/NASADEM_HGT/001
  indiasat: "projects/corestack-trees/assets/LULC_v4"
  worldcover: ESA/WorldCover/v200
  water: JRC/GSW1_4/GlobalSurfaceWater
  climate: UCSB-CHG/CHIRPS/PENTAD
  embedding: GOOGLE/SATELLITE_EMBEDDING/V1/ANNUAL

cloud_mask:
  max_cloud_pct: 20.0
  drop_scl_classes: [3, 8, 9, 10]

data_load:
  s1_orbit: ASCENDING
  s1_polarizations: [VV, VH]
  s1_instrument_mode: IW
  s2_composite_reducer: median

masking:
  indiasat_habitat_classes: [6, 12]
  indiasat_class_band: predicted_label
  indiasat_year_min: 2017
  indiasat_year_max: 2021
  keep_worldcover_classes: [10, 20, 30]
  jrc_water_occurrence_threshold: 50.0

features_radar:
  percentiles: [10, 50, 90]
  include_iqr: true
  include_cross_pol_contrast: true

features_structure:
  include_neighborhood_stats: true
  neighborhood_kernel_size: 3

features_embedding:
  collapse_reducer: mean
  band_names: null

segmentation:
  size: 10
  compactness: 0.5
  connectivity: 8
  neighborhood_size: 128
  normalize_inputs: true
  normalize_distance_scale: true
  input_bands:
    - {source: embedding_features, band: "*"}

# Identical to odisha_v120_handcrafted.yaml.
merge:
  enabled: true
  criteria:
    - {source: structure_features, band: canopy_height,         tolerance: 2.00}
    - {source: structure_features, band: canopy_height_std,     tolerance: 0.45}
    - {source: optical_features,   band: ndvi_amplitude_annual, tolerance: 0.030}
  min_defined_criteria: 2
  min_area_ha: 1.0
  max_area_ha: 10.0
  relax_factor: 1.75

clustering:
  feature_source: embedding
  k: 6
  seed: 42
  skewness_threshold: 1.0

normalization:
  method: robust

export:
  export_geotiff: true
  export_gee_asset: false
  analysis_scale_m: 10
  drive_folder: fmu_exports_odisha_phase2
  export_vector_merged: true
  export_vector_snic: true
  export_vector_dissolved: true
  vector_formats: [shp, geojson]
  vector_min_stand_pixels: 4

metrics:
  reference_config_name: odisha_v120_handcrafted_koraput
  n_comparison_samples: 10000
  n_silhouette_samples_per_cluster: 833
