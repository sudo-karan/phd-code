# KEPT LAND ONLY. ODISHA ON BOXES, DHENKANAL district, 3 ha stand ceiling, feature vector (v120).
#
# Copy of configs/odisha_v120_3ha_squares_dhenkanal.yaml. SIX things differ
# (tests/test_keptland_configs.py); everything else is identical, the box ROI, the 3 ha ceiling, k
# (5) and merge.pass2_skip_at_min_area included:
#
# 1. name and description.
# 2. segmentation.mask_before_snic: true. SNIC sees kept land only (habitat_mask 1: trees or scrub),
#    so superpixels and stands lie on kept land only. Small kept patches are not dropped:
#    segmentation.drop_kept_patches_below_min_area stays false, its default. (D1)
# 3. merge.pass2_soft_ceiling: true. In the second pass a region below merge.min_area_ha may join a
#    neighbour that takes it over merge.max_area_ha, never over max_area_ha + min_area_ha (4 ha
#    here). (D2)
# 4. clustering.fit_excludes_stands_below_min_area: true. Stands still below the minimum after the
#    merge stay on the map, typed by the nearest cluster, but are left out of the k-means training
#    rows. (D3)
# 5. export.drive_folder: fmu_exports_kept_land, so these files do not mix with the box runs'
#    exports.
# 6. features_static.cap_distance_to_water: true. distance_to_water is capped at 10 km, where the
#    distance transform otherwise returns a fill value of 463,409.5 m
#    (spec-static-cap-distance-to-water; Jaskaran, 15 Oct 2026, round 6, his answer (a) to round
#    4's question 2).
#
# D1 to D4 are Jaskaran's decisions of 14 Oct 2026, recorded in docs/decisions.yaml
# (spec-keptland-configs-mask-before-snic, spec-merge-pass2-soft-ceiling,
# spec-clustering-fit-excludes-stands-below-min-area, spec-keptland-runs-sites-and-ceilings) and in
# docs/handoff/2026-10-14-round3.md. The four settings give this config its own cache fingerprint.
# Its masking, data-load, optical, radar and structure assets can be copied from those of the box
# run it copies (scripts/reuse_upstream_assets.py), because none of those stages reads anything
# that differs. features_static reads the cap, so its asset is computed afresh, as are segmentation
# and everything after it.
#
# Not run yet: no batch run until Jaskaran says go (round 6). Run it as the box configs were run
# (odisha_script/run_passes_safely.py; CLAUDE.md, "Earth Engine"). The analysis of these stands
# against the FES plots has not been declared yet; it is declared before any score (CLAUDE.md,
# "Results").

name: odisha_v120_3ha_squares_dhenkanal_keptland
description: Odisha DHENKANAL, v120 hand-crafted method, stands capped at 3 ha, run on boxes around the villages' plots, on kept land only (mask before SNIC).

roi:
  name: odisha_squares_dhenkanal
  roi_file: aois/odisha_squares_dhenkanal.geojson

dates:
  phenology:
    start: 2017-01-01
    end: 2022-12-31
  radar:
    start: 2017-01-01
    end: 2022-12-31
  optical_composite:
    start: 2017-01-01
    end: 2022-12-31
  climate:
    start: 1991-01-01
    end: 2020-12-31

datasets:
  phenology_collection: COPERNICUS/S2_SR_HARMONIZED
  optical_composite_collection: COPERNICUS/S2_SR_HARMONIZED
  radar_collection: COPERNICUS/S1_GRD
  canopy_height: users/nlang/ETH_GlobalCanopyHeight_2020_10m_v1
  dem: NASA/NASADEM_HGT/001
  indiasat: "projects/corestack-trees/assets/LULC_v4"
  worldcover: ESA/WorldCover/v200
  water: JRC/GSW1_4/GlobalSurfaceWater
  climate: UCSB-CHG/CHIRPS/PENTAD

cloud_mask:
  max_cloud_pct: 20.0
  drop_scl_classes: [3, 8, 9, 10]

data_load:
  s1_orbit: ASCENDING
  s1_polarizations: [VV, VH]
  s1_instrument_mode: IW
  s2_composite_reducer: median

masking:
  indiasat_habitat_classes: [6, 12]
  indiasat_class_band: predicted_label
  indiasat_year_min: 2017
  indiasat_year_max: 2021
  keep_worldcover_classes: [10, 20, 30]
  jrc_water_occurrence_threshold: 50.0

features_optical:
  index: ndvi
  harmonic_mode: single
  include_trend: true
  time_reference: 2017-01-01

features_radar:
  percentiles: [10, 50, 90]
  include_iqr: true
  include_cross_pol_contrast: true

features_structure:
  include_neighborhood_stats: true
  neighborhood_kernel_size: 3

features_static:
  include_climate: true
  max_water_distance_pixels: 1000
  cap_distance_to_water: true

# The pre-Odisha six-band stack.
segmentation:
  size: 6
  compactness: 0.5
  connectivity: 8
  neighborhood_size: 128
  normalize_inputs: true
  normalize_distance_scale: true
  mask_before_snic: true
  input_bands:
    - {source: s2_composite,       band: B4_median}
    - {source: s2_composite,       band: B8_median}
    - {source: structure_features, band: canopy_height}
    - {source: structure_features, band: canopy_height_std}
    - {source: optical_features,   band: ndvi_amplitude_annual}
    - {source: radar_features,     band: vv_minus_vh_median}

# The pre-Odisha three-criterion merge. Tolerances are the Sanjay Van values.
merge:
  enabled: true
  criteria:
    - {source: structure_features, band: canopy_height,         tolerance: 2.00}
    - {source: structure_features, band: canopy_height_std,     tolerance: 0.45}
    - {source: optical_features,   band: ndvi_amplitude_annual, tolerance: 0.030}
  min_defined_criteria: 2
  min_area_ha: 1.0
  max_area_ha: 3.0
  relax_factor: 1.75
  pass2_skip_at_min_area: true
  pass2_soft_ceiling: true

clustering:
  k: 5
  seed: 42
  skewness_threshold: 1.0
  fit_excludes_stands_below_min_area: true

normalization:
  method: robust

features:
  optical_harmonic: true
  radar: true
  canopy_height: true
  terrain: true

export:
  export_geotiff: true
  export_gee_asset: false
  analysis_scale_m: 10
  drive_folder: fmu_exports_kept_land
  export_vector_merged: true
  export_vector_snic: true
  export_vector_dissolved: true
  vector_formats: [shp, geojson]
  vector_min_stand_pixels: 4

metrics:
  reference_config_name: null
  n_comparison_samples: 10000
  n_silhouette_samples_per_cluster: 833
